<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Research detail · EdgeX</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="edgex-v2.css">
  <script src="edgex-v2-core.js"></script>

  <script src="edgex-shell.js"></script>
</head>
<body data-detail-type="">
  <aside id="side-nav"></aside>
  <main class="page-shell">
    <header class="topbar"><div class="topbar-title" id="detail-title">Research detail</div></header>
    <section id="edgex-detail-root" aria-live="polite">
      <div class="edgex-v2-state edgex-v2-state-loading"><strong>Loading research detail</strong><span>Checking the requested data type.</span></div>
    </section>
  </main>
  <script>
    (() => {
      const views = {
        fixture: { title: 'Fixture details', script: 'edgex-fixture-detail.js' },
        league: { title: 'League details', script: 'edgex-detail.js' },
        market: { title: 'Market details', script: 'edgex-detail.js' },
        player: { title: 'Player details', script: 'edgex-detail.js' },
        crypto: { title: 'Crypto details', script: 'edgex-asset-detail.js' },
        forex: { title: 'Forex details', script: 'edgex-asset-detail.js' },
      };
      const type = new URLSearchParams(location.search).get('type');
      const view = views[type];
      const root = document.getElementById('edgex-detail-root');
      if (!view) {
        document.title = 'Unsupported detail · EdgeX';
        root.innerHTML = '<div class="edgex-v2-state edgex-v2-state-error"><strong>Unsupported detail type</strong><span>Choose a supported Sports or Markets detail page.</span><a class="edgex-v2-button" href="home.html">Back to Overview</a></div>';
        return;
      }
      document.body.dataset.detailType = type;
      document.title = `${view.title} · EdgeX`;
      document.getElementById('detail-title').textContent = view.title;
      const script = document.createElement('script');
      script.src = view.script;
      script.async = false;
      script.onerror = () => {
        root.innerHTML = '<div class="edgex-v2-state edgex-v2-state-error"><strong>Detail view unavailable</strong><span>EdgeX could not load this detail renderer.</span><a class="edgex-v2-button" href="home.html">Back to Overview</a></div>';
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
