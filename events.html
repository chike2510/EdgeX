<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Events — EdgeX</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .search-bar{display:flex;gap:8px;margin-bottom:12px;}
    .search-input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:var(--font-mono);font-size:12px;padding:9px 14px;outline:none;transition:var(--transition);}
    .search-input:focus{border-color:rgba(0,255,157,0.4);}
    .search-input::placeholder{color:var(--text-dim);}
    .analyse-btn{background:linear-gradient(135deg,var(--neon),var(--neon2));border:none;border-radius:var(--radius);color:#07090d;font-family:var(--font-mono);font-size:11px;font-weight:700;padding:9px 16px;cursor:pointer;flex-shrink:0;}
    .cat-row{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
    .sort-row{display:flex;gap:5px;margin-bottom:12px;align-items:center;}
    .sort-label{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;flex-shrink:0;}
    .load-more-btn{width:100%;margin-top:14px;padding:12px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--neon2);font-family:var(--font-mono);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;}
    .market-count{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-bottom:10px;}
    /* Kelly box on market cards */
    .kelly-chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:9px;background:rgba(0,255,157,0.08);border:1px solid rgba(0,255,157,0.2);border-radius:3px;padding:2px 7px;color:var(--neon);margin-top:5px;}
  </style>
</head>
<body>
<nav id="side-nav"></nav>
<div id="page-wrap">
  <header id="page-header">
    <div class="page-title"><span class="page-title-icon">🌍</span>EVENTS<span class="page-subtitle">LIVE · POLYMARKET</span></div>
    <button id="refresh-btn" onclick="loadEvents(true)">⟳ REFRESH</button>
  </header>
  <main id="page-main">

    <div id="data-banner" class="odds-api-banner sim">
      <div class="oab-dot sim" id="banner-dot"></div>
      <div class="oab-text" id="banner-txt">Connecting to Polymarket...</div>
    </div>

    <div class="search-bar">
      <input id="event-input" class="search-input" type="text" placeholder="Search: BTC, election, NBA, Fed rates..."/>
      <button class="analyse-btn" onclick="handleSearch()">ANALYSE →</button>
    </div>

    <!-- Category filters — routes to Polymarket tag IDs server-side -->
    <div class="cat-row" id="cat-filter">
      <button class="filter-btn active" onclick="setCat('all',this)">ALL</button>
      <button class="filter-btn" onclick="setCat('crypto',this)">₿ CRYPTO</button>
      <button class="filter-btn" onclick="setCat('sports',this)">⚽ SPORTS</button>
      <button class="filter-btn" onclick="setCat('economy',this)">📈 FOREX/MACRO</button>
      <button class="filter-btn" onclick="setCat('politics',this)">🗳 POLITICS</button>
      <button class="filter-btn" onclick="setCat('tech',this)">💻 TECH</button>
    </div>

    <div class="sort-row">
      <span class="sort-label">SORT:</span>
      <button class="filter-btn active" onclick="setSort('volume',this)">VOLUME</button>
      <button class="filter-btn" onclick="setSort('liquidity',this)">LIQUIDITY</button>
      <button class="filter-btn" onclick="setSort('end_date',this)">ENDING SOON</button>
      <button class="filter-btn" onclick="setSort('edge',this)">EDGE</button>
    </div>

    <div class="market-count" id="market-count"></div>
    <div id="events-list">
      <div class="loading-wrap"><div class="loader"></div><div class="loading-text">LOADING LIVE MARKETS...</div></div>
    </div>
    <button class="load-more-btn" id="load-more-btn" style="display:none" onclick="loadMore()">▼ LOAD MORE</button>
  </main>
</div>
<div id="ticker-bar"></div>
<script src="common.js"></script>
<script>
'use strict';

// ── STATE ─────────────────────────────────────────────────────────────────────
let offset       = 0;
let sortMode     = 'volume';
let catMode      = 'all';
let allMarkets   = [];
let isSearchMode = false;

// ── CATEGORY KEYWORDS for client-side filtering when cat='all' ──────────────
const CAT_KW = {
  crypto:   ['bitcoin','btc','eth','ethereum','crypto','solana','xrp','defi','nft','token','coin','bnb','avax','doge'],
  sports:   ['nba','nfl','mlb','nhl','soccer','football','champion','league','world cup','title','match','final','playoffs','wimbledon','tennis','golf','f1','ufc','mma'],
  economy:  ['fed','rate','interest','inflation','gdp','recession','cpi','fomc','yield','dollar','usd','euro','pound','forex','gold','oil','treasury','economic'],
  politics: ['election','president','vote','senate','congress','minister','chancellor','party','democrat','republican','trump','modi','macron'],
  tech:     ['ai','openai','gpt','apple','google','microsoft','tesla','nvidia','tech','startup','ipo','meta','amazon','chatgpt'],
};

// ── BOOT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => loadEvents(true));
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.id === 'event-input') handleSearch();
});

// ── LOAD EVENTS FROM POLYMARKET VIA /api/polymarket ──────────────────────────
async function loadEvents(reset = false) {
  if (reset) {
    offset = 0;
    allMarkets = [];
    isSearchMode = false;
    document.getElementById('event-input').value = '';
    document.getElementById('events-list').innerHTML =
      '<div class="loading-wrap"><div class="loader"></div><div class="loading-text">LOADING LIVE MARKETS...</div></div>';
  }

  const btn = document.getElementById('refresh-btn');
  if (btn) btn.classList.add('spinning');

  setBanner('loading', 'Fetching Polymarket data...');

  try {
    // Two pages in parallel for more results
    const [p1, p2] = await Promise.all([
      fetchPage(offset),
      fetchPage(offset + 50),
    ]);

    const raw = [...p1, ...p2];

    if (raw.length === 0) {
      throw new Error('No markets returned from Polymarket');
    }

    // Parse each market
    const parsed = raw
      .filter(m => m.question && m.outcomePrices && m.question.length < 300)
      .map(parseMarket)
      .filter(Boolean);

    // Deduplicate by question
    const seen = new Set(allMarkets.map(m => m.question));
    const fresh = parsed.filter(m => !seen.has(m.question));

    if (reset) {
      allMarkets = parsed;
    } else {
      allMarkets = [...allMarkets, ...fresh];
    }

    renderMarkets();
    document.getElementById('load-more-btn').style.display = raw.length >= 50 ? 'block' : 'none';
    setBanner('live', `${allMarkets.length} live markets · Polymarket`);

  } catch (e) {
    console.error('[EdgeX Events]', e.message);
    // Show whatever we have, or empty state
    if (allMarkets.length === 0) {
      document.getElementById('events-list').innerHTML =
        `<div class="empty-state">
          <strong>Could not connect to Polymarket</strong><br>
          <span style="font-size:11px;color:var(--text-dim)">${e.message}</span><br><br>
          Check your internet connection or try refreshing.
        </div>`;
    }
    document.getElementById('load-more-btn').style.display = 'none';
    setBanner('sim', 'Connection error — check console');
  }

  if (btn) btn.classList.remove('spinning');
}

async function fetchPage(off) {
  const url = `/api/polymarket?sort=${sortMode}&offset=${off}&limit=50&cat=${catMode}`;
  const r   = await fetch(url);
  if (!r.ok) throw new Error(`Proxy error ${r.status}`);
  const d = await r.json();
  return Array.isArray(d) ? d : [];
}

function loadMore() {
  offset += 100;
  loadEvents(false);
}

// ── CONTROLS ──────────────────────────────────────────────────────────────────
function setCat(cat, btn) {
  catMode = cat;
  document.querySelectorAll('#cat-filter .filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  loadEvents(true); // Reload from server with new tag_id
}

function setSort(sort, btn) {
  sortMode = sort;
  document.querySelectorAll('.sort-row .filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  if (sort === 'edge') {
    // Edge sort is client-side only
    renderMarkets();
  } else {
    loadEvents(true);
  }
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function handleSearch() {
  const q = document.getElementById('event-input').value.trim();
  if (!q) { loadEvents(true); return; }

  // First try to filter already-loaded markets
  const matches = allMarkets.filter(m =>
    m.question.toLowerCase().includes(q.toLowerCase())
  );

  if (matches.length > 0) {
    const list = document.getElementById('events-list');
    list.innerHTML = '';
    matches.forEach(m => list.appendChild(buildCard(m)));
    document.getElementById('market-count').textContent = `${matches.length} results for "${q}"`;
    setBanner('live', `${matches.length} results for "${q}" · Polymarket`);
  } else {
    // Custom question analysis
    analyseCustom(q);
  }
}

function analyseCustom(q) {
  const list = document.getElementById('events-list');
  const ph   = document.createElement('div');
  ph.className = 'event-card';
  ph.innerHTML = '<div class="loading-wrap" style="padding:20px"><div class="loader"></div><div class="loading-text">ANALYSING...</div></div>';
  list.insertBefore(ph, list.firstChild);

  setTimeout(() => {
    const qL = q.toLowerCase();
    const factors = [];
    if (qL.includes('bitcoin') || qL.includes('btc')) {
      factors.push('On-chain accumulation vs distribution signals');
      factors.push('Post-halving cycle and ETF flow data');
      factors.push('Polymarket crypto markets pricing');
    } else if (qL.includes('election') || qL.includes('president')) {
      factors.push('Current polling averages and historical accuracy');
      factors.push('Incumbent advantage and turnout models');
    } else if (qL.includes('rate') || qL.includes('fed') || qL.includes('inflation')) {
      factors.push('CPI trajectory and Fed communication signals');
      factors.push('Employment data and neutral rate estimates');
    } else if (qL.includes('nba') || qL.includes('champion') || qL.includes('win')) {
      factors.push('Current team form and injury report');
      factors.push('Historical tournament performance');
    } else {
      factors.push('Available data and expert consensus assessed');
      factors.push('Historical base rate for similar events');
    }
    factors.push('Crowd wisdom from prediction markets integrated');
    factors.push('Model uncertainty reflected in confidence score');

    const y = Math.min(92, Math.max(8, Math.round(50 + (Math.random() - 0.4) * 44)));
    const market = {
      question: q,
      category: 'Custom',
      yesPct: y,
      noPct: 100 - y,
      mktYes: y,
      modelYes: y,
      edgeA: 0,
      verdict: y > 60 ? 'LIKELY' : y < 40 ? 'UNLIKELY' : 'UNCERTAIN',
      verdictColor: y > 60 ? 'var(--neon)' : y < 40 ? 'var(--red)' : 'var(--yellow)',
      edgeLabel: Math.abs(y - 50) > 20 ? 'STRONG' : Math.abs(y - 50) > 10 ? 'MEDIUM' : 'WEAK',
      confidence: Math.min(86, Math.round(42 + Math.abs(y - 50) * 0.9 + Math.random() * 12)),
      factors,
      live: false,
      volume: 0,
      volumeLabel: null,
      kellyStake: null,
    };
    ph.replaceWith(buildCard(market));
  }, 900);

  document.getElementById('event-input').value = '';
}

// ── PARSE MARKET from Polymarket API response ─────────────────────────────────
function parseMarket(m) {
  try {
    // outcomePrices is a JSON string like '["0.65","0.35"]'
    let prices = [];
    try { prices = JSON.parse(m.outcomePrices); } catch { prices = []; }
    if (!prices.length) return null;

    const mktYes = Math.round(parseFloat(prices[0]) * 100); // market's YES price as %
    const vol    = m.volume    ? parseFloat(m.volume)    : 0;
    const liq    = m.liquidity ? parseFloat(m.liquidity) : 0;
    const endDate = m.endDate  ? new Date(m.endDate)     : null;
    const daysLeft = endDate ? Math.round((endDate - new Date()) / 86400000) : null;

    // ── APEX MODEL: adjust market price for thin market / bias ────────────────
    let modelYes = mktYes / 100;
    // Thin market mean-reversion (less liquid = less trustworthy price)
    if (liq < 5000)  modelYes = 0.5 + (modelYes - 0.5) * 0.80;
    if (liq < 1000)  modelYes = 0.5 + (modelYes - 0.5) * 0.60;
    // Low volume = more uncertainty
    if (vol < 5000)  modelYes = 0.5 + (modelYes - 0.5) * 0.75;
    // Distant events have more uncertainty
    if (daysLeft && daysLeft > 90) modelYes = 0.5 + (modelYes - 0.5) * 0.90;
    modelYes = Math.max(0.05, Math.min(0.95, modelYes));

    const yesPct  = Math.round(modelYes * 100);
    const noPct   = 100 - yesPct;
    const edgeA   = +((modelYes - mktYes / 100) * 100).toFixed(1);

    const verdict      = yesPct > 60 ? 'LIKELY' : yesPct < 40 ? 'UNLIKELY' : 'UNCERTAIN';
    const verdictColor = yesPct > 60 ? 'var(--neon)' : yesPct < 40 ? 'var(--red)' : 'var(--yellow)';
    const edgeLabel    = Math.abs(yesPct - 50) > 20 ? 'STRONG' : Math.abs(yesPct - 50) > 10 ? 'MEDIUM' : 'WEAK';

    const factors = [];
    if (vol > 0) factors.push(`$${fmtVol(vol)} traded · ${liq > 10000 ? 'deep' : 'thin'} liquidity`);
    factors.push(mktYes > 65
      ? `Market prices YES at ${mktYes}% — strong crowd conviction`
      : mktYes < 35
      ? `Market prices NO at ${100 - mktYes}% — crowd against`
      : `Market split: ${mktYes}% YES / ${100 - mktYes}% NO`);
    if (Math.abs(edgeA) > 3) factors.push(`APEX edge: ${edgeA > 0 ? '+' : ''}${edgeA}% vs market`);
    if (liq < 5000) factors.push('Thin liquidity — price may not reflect true probability');
    if (daysLeft && daysLeft > 0 && daysLeft < 365) factors.push(`Resolves in ${daysLeft} day${daysLeft === 1 ? '' : 's'}`);
    factors.push('Real-money prediction market — continuous pricing');

    const confidence = Math.min(94, Math.round(
      50 + Math.abs(yesPct - 50) * 0.75
      + (vol > 100000 ? 18 : vol > 10000 ? 12 : vol > 1000 ? 6 : 0)
      + (liq > 50000  ? 8  : liq > 10000 ? 4  : 0)
    ));

    // ── Fractional Kelly (25%) stake calculation ───────────────────────────────
    const p = modelYes;
    const b = 1; // binary market pays $1 on correct outcome
    const q = 1 - p;
    const kelly = Math.max(0, (b * p - q) / b); // full Kelly fraction
    const bankroll = typeof getBankroll === 'function' ? getBankroll() : 1000;
    const kellyStake = +(kelly * 0.25 * bankroll).toFixed(2);

    // Category detection from question text
    const qL = (m.question || '').toLowerCase();
    let category = 'Markets';
    for (const [cat, kws] of Object.entries(CAT_KW)) {
      if (kws.some(k => qL.includes(k))) {
        category = cat.charAt(0).toUpperCase() + cat.slice(1);
        break;
      }
    }

    return {
      question: m.question,
      category,
      yesPct, noPct, mktYes,
      modelYes: Math.round(modelYes * 100),
      edgeA,
      verdict, verdictColor, edgeLabel,
      confidence, factors,
      live: true,
      volume: vol,
      volumeLabel: vol > 0 ? `$${fmtVol(vol)} traded` : null,
      endDate: endDate ? endDate.toLocaleDateString('en-GB') : null,
      kellyStake: kellyStake > 0 ? kellyStake : null,
    };
  } catch (e) {
    return null;
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderMarkets() {
  let data = [...allMarkets];

  // Client-side edge sort
  if (sortMode === 'edge') {
    data.sort((a, b) => Math.abs(b.edgeA) - Math.abs(a.edgeA));
  }

  document.getElementById('market-count').textContent =
    `${data.length} markets${catMode !== 'all' ? ' · ' + catMode.toUpperCase() : ''}`;

  const list = document.getElementById('events-list');
  list.innerHTML = '';

  if (!data.length) {
    list.innerHTML = `<div class="empty-state">No markets found for this filter.<br>Try <strong>ALL</strong> category.</div>`;
    return;
  }

  data.forEach(m => list.appendChild(buildCard(m)));
}

function buildCard(m) {
  const card = document.createElement('div');
  card.className = 'event-card';
  const ec = edgeClass(m.edgeLabel);

  card.innerHTML = `
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap">
      <div class="event-category">${m.category.toUpperCase()}</div>
      ${m.live ? '<span style="font-family:var(--font-mono);font-size:8px;color:var(--neon);background:var(--neon-dim);border:1px solid rgba(0,255,157,.3);padding:2px 6px;border-radius:3px;letter-spacing:1px">LIVE</span>' : ''}
      ${m.volumeLabel ? `<span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">${m.volumeLabel}</span>` : ''}
      ${m.endDate ? `<span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">ends ${m.endDate}</span>` : ''}
    </div>

    <div class="event-question-text">${m.question}</div>

    <div class="yes-no-bars">
      <div class="yes-bar" style="width:${m.yesPct}%">${m.yesPct > 14 ? 'YES ' + m.yesPct + '%' : ''}</div>
      <div class="no-bar">NO ${m.noPct}%</div>
    </div>

    ${m.mktYes !== undefined && Math.abs(m.edgeA || 0) > 2 ? `
    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:4px">
      Market: <strong>${m.mktYes}%</strong> ·
      APEX Model: <strong style="color:${m.edgeA > 0 ? 'var(--neon)' : 'var(--red)'}">${m.modelYes}%</strong> ·
      Edge: <span style="color:${m.edgeA > 0 ? 'var(--neon)' : 'var(--red)'}"><strong>${m.edgeA > 0 ? '+' : ''}${m.edgeA}%</strong></span>
    </div>` : ''}

    <div class="verdict-row">
      <span class="verdict-label" style="color:${m.verdictColor}">${m.verdict}</span>
      <div class="value-badge ${ec}" style="margin:0;padding:3px 8px;font-size:9px"><div class="value-dot"></div>${m.edgeLabel} EDGE</div>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--neon)">CONF: ${m.confidence}</span>
    </div>

    ${m.kellyStake ? `
    <div class="kelly-chip">⚖️ Kelly 25%: $${m.kellyStake} stake</div>` : ''}

    <div class="event-factors">
      <div class="event-factors-title">KEY FACTORS</div>
      ${m.factors.map(f => `<div class="event-factor">${f}</div>`).join('')}
    </div>`;

  return card;
}

// ── BANNER ────────────────────────────────────────────────────────────────────
function setBanner(mode, txt) {
  const dot = document.getElementById('banner-dot');
  const t   = document.getElementById('banner-txt');
  const b   = document.getElementById('data-banner');
  if (!b) return;

  if (mode === 'live') {
    b.className    = 'odds-api-banner live';
    dot.className  = 'oab-dot live';
    t.innerHTML    = `LIVE MARKETS — <strong>Polymarket</strong> · ${txt} · ${new Date().toLocaleTimeString()}`;
  } else if (mode === 'loading') {
    b.className    = 'odds-api-banner sim';
    dot.className  = 'oab-dot sim';
    t.textContent  = txt;
  } else {
    b.className    = 'odds-api-banner sim';
    dot.className  = 'oab-dot sim';
    t.textContent  = txt;
  }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function fmtVol(v) {
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return v.toFixed(0);
}
</script>
</body>
</html>
