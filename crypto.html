<script>
'use strict';

let page = 1, cat = 'all', sortBy = 'market_cap';
let allCoins = [], activeCoin = null;
let isSearch = false;
const PER = 20;

document.addEventListener('DOMContentLoaded', () => loadCrypto(true));
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.activeElement.id === 'crypto-search') searchCoin(); });

// ── APEX TECHNICAL INDICATORS ─────────────────────────────────────────────────
function calcRSI(prices, period = 14) {
  if (prices.length < period + 1) return 50;
  let gains = 0, losses = 0;
  for (let i = prices.length - period; i < prices.length; i++) {
    const d = prices[i] - prices[i - 1];
    if (d >= 0) gains += d; else losses -= d;
  }
  const rs = (gains / period) / ((losses / period) || 0.001);
  return +(100 - 100 / (1 + rs)).toFixed(1);
}

function calcMACD(prices) {
  if (prices.length < 26) return { hist: 0, label: 'Insufficient data' };
  const ema = (arr, n) => { const k = 2 / (n + 1); let e = arr[0]; for (let i = 1; i < arr.length; i++) e = arr[i] * k + e * (1 - k); return e; };
  const ema12 = ema(prices.slice(-12), 12), ema26 = ema(prices.slice(-26), 26);
  const macd = ema12 - ema26, signal = macd * 0.9, hist = macd - signal;
  const label = macd > 0 && hist > 0 ? 'Bullish Crossover' : macd < 0 && hist < 0 ? 'Bearish Crossover' : macd > 0 ? 'Above Signal' : 'Below Signal';
  return { macd: +macd.toFixed(4), hist: +hist.toFixed(4), label };
}

function calcBB(prices, period = 20) {
  if (prices.length < period) return { pct: 50 };
  const slice = prices.slice(-period);
  const mid = slice.reduce((a, b) => a + b, 0) / period;
  const std = Math.sqrt(slice.reduce((s, p) => s + (p - mid) ** 2, 0) / period);
  const upper = mid + 2 * std, lower = mid - 2 * std;
  const last = prices[prices.length - 1];
  return { pct: std > 0 ? Math.min(100, Math.max(0, Math.round(((last - lower) / (upper - lower)) * 100))) : 50 };
}

function avg(arr) { return arr.reduce((a, b) => a + b, 0) / arr.length; }

function enrichCoin(coin) {
  const spark = coin.sparkline_in_7d?.price || [];
  const rsi   = calcRSI(spark);
  const macd  = calcMACD(spark);
  const bb    = calcBB(spark);
  const ma7   = spark.length >= 7  ? avg(spark.slice(-7))  : coin.current_price;
  const ma20  = spark.length >= 20 ? avg(spark.slice(-20)) : coin.current_price;
  const price = coin.current_price;
  const chg24 = coin.price_change_percentage_24h_in_currency || 0;
  const chg7d = coin.price_change_percentage_7d_in_currency  || 0;
  const chg1h = coin.price_change_percentage_1h_in_currency  || 0;

  // APEX composite score
  const rsiSig   = rsi > 70 ? -0.30 : rsi < 30 ? +0.40 : rsi > 55 ? +0.15 : -0.05;
  const volSig   = chg24 > 5 ? +0.15 : chg24 > 2 ? +0.08 : chg24 < -5 ? -0.15 : chg24 < -2 ? -0.08 : 0;
  const trendSig = price > ma20 ? +0.15 : price < ma20 ? -0.12 : 0;
  const macdSig  = macd.label.includes('Bull') ? +0.12 : macd.label.includes('Bear') ? -0.12 : macd.hist > 0 ? +0.06 : -0.06;
  const bbSig    = bb.pct > 85 ? -0.10 : bb.pct < 15 ? +0.10 : 0;
  const wkSig    = chg7d > 10 ? +0.10 : chg7d < -10 ? -0.10 : chg7d > 0 ? +0.04 : -0.04;

  const bull = Math.min(97, Math.max(3, Math.round((0.50 + rsiSig + volSig + trendSig + macdSig + bbSig + wkSig) * 100)));
  const signal = bull > 74 ? { label: 'STRONG BUY', color: '#00ff9d' }
               : bull > 60 ? { label: 'BUY',         color: '#7affc4' }
               : bull > 45 ? { label: 'NEUTRAL',     color: '#f0c040' }
               : bull > 30 ? { label: 'SELL',        color: '#ff6b6b' }
               :             { label: 'STRONG SELL', color: '#ff2d55' };

  const zone = rsi > 72  ? { zone: 'OVERBOUGHT', action: 'Reversal risk — reduce exposure',    risk: 'HIGH' }
             : rsi < 28  ? { zone: 'OVERSOLD',   action: 'Bounce opportunity — DCA zone',     risk: 'MEDIUM' }
             : price > ma20 * 1.08 ? { zone: 'BREAKOUT', action: 'Momentum — trail stop',    risk: 'MEDIUM' }
             : price < ma20 * 0.92 ? { zone: 'DISCOUNT', action: 'Accumulation — scale in',  risk: 'LOW' }
             : macd.hist > 0 ? { zone: 'TRENDING', action: 'Momentum continuing',              risk: 'MEDIUM' }
             : { zone: 'NEUTRAL', action: 'Wait for directional break',                        risk: 'LOW' };

  const conf = Math.min(96, Math.round(50 + Math.abs(rsi - 50) * 0.8 + Math.abs(chg24) * 1.0 + Math.abs(chg7d) * 0.4));

  const atr7 = spark.length >= 7 ? Math.max(...spark.slice(-7)) - Math.min(...spark.slice(-7)) : price * 0.05;
  const dir  = bull > 57 ? 'LONG' : bull < 43 ? 'SHORT' : 'WAIT';
  const tp1  = dir === 'LONG'  ? +(price + atr7 * 0.6) : dir === 'SHORT' ? +(price - atr7 * 0.6) : null;
  const tp2  = dir === 'LONG'  ? +(price + atr7 * 1.2) : dir === 'SHORT' ? +(price - atr7 * 1.2) : null;
  const sl   = dir === 'LONG'  ? +(price - atr7 * 0.4) : dir === 'SHORT' ? +(price + atr7 * 0.4) : null;

  const reasons = [];
  if (Math.abs(chg24) > 2) reasons.push(`${chg24 >= 0 ? '+' : ''}${chg24.toFixed(1)}% 24h — ${chg24 > 0 ? 'bullish' : 'bearish'} pressure`);
  reasons.push(price > ma20 ? `Above MA20 ($${fmtP(ma20)}) — bullish structure` : `Below MA20 ($${fmtP(ma20)}) — bearish`);
  if (rsi > 68) reasons.push(`RSI ${rsi} — overbought, watch reversal`);
  else if (rsi < 32) reasons.push(`RSI ${rsi} — oversold, bounce potential`);
  else reasons.push(`RSI ${rsi} — neutral zone`);
  reasons.push(`MACD: ${macd.label} · BB position: ${bb.pct}%${bb.pct > 80 ? ' (extended)' : bb.pct < 20 ? ' (near support)' : ''}`);
  if (Math.abs(chg7d) > 5) reasons.push(`7d: ${chg7d >= 0 ? '+' : ''}${chg7d.toFixed(1)}% weekly ${chg7d > 0 ? 'strength' : 'weakness'}`);

  // Kelly
  const p = bull / 100;
  const b = 1.5;
  const kellyF = Math.max(0, (b * p - (1 - p)) / b);
  const bankroll = typeof getBankroll === 'function' ? getBankroll() : 1000;
  const kellyStake = +(kellyF * 0.25 * bankroll).toFixed(2);

  return {
    _spark: spark,
    symbol: coin.symbol?.toUpperCase(), name: coin.name, price, image: coin.image,
    change24: +chg24.toFixed(2), change7d: +chg7d.toFixed(2), change1h: +chg1h.toFixed(2),
    volume24h: coin.total_volume, rank: coin.market_cap_rank,
    rsi, macd, bb,
    ma7: +ma7.toFixed(price > 100 ? 2 : 6), ma20: +ma20.toFixed(price > 100 ? 2 : 6),
    bullish: bull, bearish: 100 - bull, signal, edgeZone: zone,
    edgeLabel: Math.abs(bull - 50) > 24 ? 'STRONG' : Math.abs(bull - 50) > 12 ? 'MEDIUM' : 'WEAK',
    confidence: conf, reasons, dir, tp1, tp2, sl,
    ath: coin.ath, athChange: +(coin.ath_change_percentage || 0).toFixed(1),
    kellyStake, kellyF: +(kellyF * 100).toFixed(1),
  };
}

// ── CARD HTML ─────────────────────────────────────────────────────────────────
function buildCard(a) {
  const cc    = a.change24 >= 0 ? 'pos' : 'neg';
  const cs    = a.change24 >= 0 ? '+' : '';
  const ec    = edgeClass(a.edgeLabel);
  const dCol  = a.dir === 'LONG' ? 'var(--neon)' : a.dir === 'SHORT' ? 'var(--red)' : 'var(--text-dim)';
  return `
  <div class="crypto-header">
    <div>
      <div style="display:flex;align-items:center;gap:6px">
        ${a.image ? `<img src="${a.image}" style="width:20px;height:20px;border-radius:50%" onerror="this.style.display='none'"/>` : ''}
        <div class="crypto-symbol">${a.symbol}</div>
        ${a.rank ? `<span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);background:var(--bg4);padding:2px 5px;border-radius:3px">#${a.rank}</span>` : ''}
      </div>
      <div class="crypto-name">${a.name}</div>
    </div>
    <div>
      <div class="crypto-price">$${fmtP(a.price)}</div>
      <div class="crypto-change ${cc}">${cs}${a.change24}%<span style="color:var(--text-dim);font-size:9px"> 24H</span></div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap">
    <span style="background:${a.signal.color}22;color:${a.signal.color};border:1px solid ${a.signal.color}44;font-family:var(--font-mono);font-size:10px;padding:2px 8px;border-radius:4px">${a.signal.label}</span>
    <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${dCol};background:${dCol}18;border:1px solid ${dCol}33;border-radius:4px;padding:2px 7px">${a.dir}</span>
    <span class="apex-tag">APEX</span>
  </div>

  <div class="bias-gauge">
    <div class="bias-labels"><span>BEAR ${a.bearish}%</span><span>BULL ${a.bullish}%</span></div>
    <div class="bias-bar-wrap"><div class="bias-bar-fill" data-w="${a.bullish}" style="width:0%"></div></div>
  </div>

  <div class="rsi-row"><span class="rsi-label">RSI</span><div class="rsi-track"><div class="rsi-needle" style="left:${a.rsi}%"></div></div><span class="rsi-value">${a.rsi}</span></div>
  <div class="edge-zone-box"><div class="ez-zone">${a.edgeZone.zone}</div><div class="ez-action">${a.edgeZone.action}</div></div>

  <div style="margin:8px 0">
    <div class="macd-row"><span class="macd-lbl">MACD</span><span class="macd-val" style="color:${a.macd.hist > 0 ? 'var(--neon)' : 'var(--red)'}">${a.macd.label}</span></div>
    <div class="macd-row"><span class="macd-lbl">BB Band</span><span class="macd-val">${a.bb.pct}% of range</span></div>
    <div class="macd-row"><span class="macd-lbl">MA20</span><span class="macd-val" style="color:${a.price > a.ma20 ? 'var(--neon)' : 'var(--red)'}">$${fmtP(a.ma20)} ${a.price > a.ma20 ? '▲' : '▼'}</span></div>
  </div>

  ${a.dir !== 'WAIT' ? `<div class="level-row">
    <div class="level-box"><div class="level-lbl">TP1</div><div class="level-val" style="color:var(--neon)">$${fmtP(a.tp1)}</div></div>
    <div class="level-box"><div class="level-lbl">TP2</div><div class="level-val" style="color:var(--neon2)">$${fmtP(a.tp2)}</div></div>
    <div class="level-box"><div class="level-lbl">STOP</div><div class="level-val" style="color:var(--red)">$${fmtP(a.sl)}</div></div>
  </div>` : ''}

  <div class="stat-chips" style="margin-top:8px">
    ${a.change1h !== undefined ? `<div class="stat-chip">1H <span style="color:${a.change1h >= 0 ? 'var(--neon)' : 'var(--red)'}">${a.change1h >= 0 ? '+' : ''}${a.change1h}%</span></div>` : ''}
    <div class="stat-chip">7D <span style="color:${a.change7d >= 0 ? 'var(--neon)' : 'var(--red)'}">${a.change7d >= 0 ? '+' : ''}${a.change7d}%</span></div>
    ${a.volume24h ? `<div class="stat-chip">VOL <span>$${fmtV(a.volume24h)}</span></div>` : ''}
  </div>

  <div class="value-badge ${ec}" style="margin-top:8px"><div class="value-dot"></div>${a.edgeLabel} EDGE · RISK: ${a.edgeZone.risk}</div>
  <div class="conf-row"><span class="conf-label">CONF</span><div class="conf-bar-wrap"><div class="conf-bar" data-w="${a.confidence}" style="width:0%"></div></div><span class="conf-value">${a.confidence}</span></div>

  <div style="font-family:var(--font-mono);font-size:9px;color:var(--neon);margin-top:6px">⚖️ Kelly 25%: <strong>$${a.kellyStake}</strong> <span style="color:var(--text-dim)">recommended stake</span></div>

  <div class="ai-explain" style="margin-top:8px"><div class="ai-explain-title">⚡ APEX ANALYSIS</div><ul class="ai-explain-list">${a.reasons.map(r => `<li>${r}</li>`).join('')}</ul></div>
  <div style="font-family:var(--font-mono);font-size:9px;color:var(--neon2);margin-top:8px;text-align:right">TAP FOR DEEP DIVE →</div>`;
}

// ── RENDER GRID ───────────────────────────────────────────────────────────────
function renderGrid(data) {
  const el = document.getElementById('crypto-content');
  el.innerHTML = `<div class="section-header"><div class="section-title">Crypto Intelligence</div><div class="section-meta">${data.length} ASSETS · APEX ENGINE</div></div><div class="cards-grid" id="crypto-grid"></div>`;
  const grid = document.getElementById('crypto-grid');
  data.forEach(a => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.cursor = 'pointer';
    card.innerHTML = buildCard(a);
    card.addEventListener('click', () => openHub(a));
    grid.appendChild(card);
    // Animate bars
    setTimeout(() => {
      card.querySelectorAll('[data-w]').forEach(el => {
        setTimeout(() => { el.style.width = el.dataset.w + '%'; }, 80);
      });
    }, 60);
  });
}

// ── DATA LOADING ──────────────────────────────────────────────────────────────
async function loadCrypto(reset = false) {
  if (reset) { page = 1; allCoins = []; isSearch = false; document.getElementById('crypto-search').value = ''; }
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.classList.add('spinning');
  if (reset) showLoading('crypto-content');

  const catParam = cat !== 'all' ? `&category=${cat}` : '';
  const url = `https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=${sortBy}_desc&per_page=${PER}&page=${page}&sparkline=true&price_change_percentage=1h,24h,7d${catParam}`;

  try {
    const res = await fetch(url);
    const raw = await res.json();
    if (!Array.isArray(raw) || !raw.length) throw new Error('empty');
    const enriched = raw.map(enrichCoin);
    if (reset) allCoins = enriched; else allCoins = [...allCoins, ...enriched];
    renderGrid(allCoins);
    document.getElementById('load-more-btn').style.display = raw.length === PER ? 'block' : 'none';
    updateBanner('live');
  } catch (e) {
    if (reset) { const fb = getFallback(); allCoins = fb; renderGrid(fb); updateBanner('sim'); }
    document.getElementById('load-more-btn').style.display = 'none';
  }
  if (btn) btn.classList.remove('spinning');
}

function loadMore() {
  if (isSearch) return;
  page++;
  const btn = document.getElementById('load-more-btn');
  btn.textContent = '▼ LOADING...'; btn.disabled = true;
  loadCrypto(false).then(() => { btn.textContent = '▼ LOAD MORE COINS'; btn.disabled = false; });
}

async function searchCoin() {
  const q = document.getElementById('crypto-search').value.trim();
  if (!q) { loadCrypto(true); return; }
  isSearch = true;
  showLoading('crypto-content');
  document.getElementById('load-more-btn').style.display = 'none';
  try {
    const sRes  = await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(q)}`);
    const sData = await sRes.json();
    const ids   = (sData.coins || []).slice(0, 12).map(c => c.id).join(',');
    if (!ids) throw new Error('No results');
    const mRes  = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}&order=market_cap_desc&sparkline=true&price_change_percentage=1h,24h,7d`);
    const mData = await mRes.json();
    if (!Array.isArray(mData) || !mData.length) throw new Error('No market data');
    allCoins = mData.map(enrichCoin);
    renderGrid(allCoins);
    updateBanner('live', `Search: "${q}" — ${allCoins.length} results`);
  } catch (e) {
    document.getElementById('crypto-content').innerHTML = `<div class="empty-state">No results for <strong>"${q}"</strong></div>`;
  }
}

function setCat(c, btn) { cat = c; page = 1; document.querySelectorAll('#cat-row .filter-btn').forEach(b => b.classList.toggle('active', b === btn)); loadCrypto(true); }
function setSort(s, btn) { sortBy = s; page = 1; document.querySelectorAll('.sort-row .filter-btn').forEach(b => b.classList.toggle('active', b === btn)); loadCrypto(true); }

function updateBanner(mode, extra = '') {
  const banner = document.getElementById('data-banner');
  if (mode === 'live') {
    banner.className = 'odds-api-banner live';
    banner.innerHTML = `<div class="oab-dot live"></div><div class="oab-text">${extra || `LIVE — <strong>CoinGecko</strong> · APEX Engine · ${allCoins.length} assets · ${new Date().toLocaleTimeString()}`}</div>`;
  } else {
    banner.className = 'odds-api-banner sim';
    banner.innerHTML = `<div class="oab-dot sim"></div><div class="oab-text">SIMULATION MODE — live data unavailable</div>`;
  }
}

async function loadCoinPolymarket(coin) {
  const body = document.getElementById('hub-body');
  try {
    const res  = await fetch('/api/polymarket?cat=crypto&limit=50');
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) throw new Error('No data');

    const sym  = (coin.symbol || '').toLowerCase();
    const name = (coin.name || '').toLowerCase();
    const relevant = data.filter(m => {
      const q = (m.question || '').toLowerCase();
      return q.includes(sym) || q.includes(name)
        || (sym === 'btc'  && q.includes('bitcoin'))
        || (sym === 'eth'  && q.includes('ethereum'))
        || (sym === 'sol'  && q.includes('solana'))
        || (sym === 'xrp'  && q.includes('ripple'))
        || (sym === 'doge' && q.includes('dogecoin'));
    }).slice(0, 8);

    if (!relevant.length) {
      body.innerHTML = `<div class="empty-state">No Polymarket markets for <strong>${coin.symbol}</strong>.<br>Try the <a href="events.html" style="color:var(--neon)">Events page</a> to browse all crypto markets.</div>`;
      return;
    }

    body.innerHTML = `<div style="font-family:var(--font-mono);font-size:9px;color:var(--neon2);letter-spacing:1px;margin-bottom:10px">📊 POLYMARKET — ${coin.symbol} (${relevant.length} markets)</div>` +
      relevant.map(m => {
        let prices = [];
        try { prices = JSON.parse(m.outcomePrices || '[]'); } catch {}
        const yes = prices[0] ? Math.round(parseFloat(prices[0]) * 100) : 50;
        const vol = m.volume ? parseFloat(m.volume) : 0;
        return `<div class="pm-market-item">
          <div style="font-size:12px;font-weight:600;margin-bottom:6px;line-height:1.4">${m.question}</div>
          ${vol > 0 ? `<div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-bottom:6px">$${fmtV(vol)} traded</div>` : ''}
          <div style="display:flex;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin-bottom:5px">
            <div style="width:${yes}%;background:var(--neon)"></div>
            <div style="flex:1;background:var(--red)"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px">
            <span style="color:var(--neon)">YES ${yes}%</span>
            <span style="color:var(--red)">NO ${100 - yes}%</span>
          </div>
        </div>`;
      }).join('');
  } catch (e) {
    body.innerHTML = `<div class="empty-state">Could not load Polymarket data<br><span style="font-size:11px;color:var(--text-dim)">${e.message}</span></div>`;
  }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function fmtP(p) {
  if (!p && p !== 0) return '—';
  if (p >= 1000) return p.toLocaleString('en-US', { maximumFractionDigits: 2 });
  if (p >= 1)    return p.toFixed(3);
  if (p >= 0.01) return p.toFixed(4);
  return p.toFixed(6);
}
function fmtV(v) {
  if (!v) return '—';
  if (v >= 1e9) return (v / 1e9).toFixed(1) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(0) + 'M';
  return (v / 1e3).toFixed(0) + 'K';
}
