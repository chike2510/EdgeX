<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Journal — EdgeX</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
    .stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px;}
    .stat-box.highlight{border-color:rgba(0,255,157,0.3);background:linear-gradient(135deg,rgba(0,255,157,0.05),transparent);}
    .sb-val{font-family:var(--font-mono);font-size:22px;font-weight:700;line-height:1;margin-bottom:4px;}
    .sb-lbl{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:1px;}
    .sb-sub{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:4px;}
    .chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:14px;}
    .chart-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
    .chart-title{font-family:var(--font-mono);font-size:11px;font-weight:700;}
    .roi-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
    .roi-label{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);flex:1;}
    .roi-bar-wrap{flex:2;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;}
    .roi-bar-fill{height:100%;border-radius:3px;transition:width 0.8s ease;}
    .roi-pct{font-family:var(--font-mono);font-size:10px;font-weight:700;width:48px;text-align:right;flex-shrink:0;}
    .journal-tabs{display:flex;gap:6px;margin-bottom:14px;}
    .jt{flex:1;padding:8px;font-family:var(--font-mono);font-size:10px;font-weight:700;border-radius:var(--radius);cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text-muted);text-align:center;}
    .jt.active{background:var(--neon-dim);color:var(--neon);border-color:rgba(0,255,157,0.3);}
    .pick-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px;margin-bottom:8px;}
    .pr-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
    .pr-match{font-weight:700;font-size:12px;margin-bottom:2px;}
    .pr-pick{font-family:var(--font-mono);font-size:10px;color:var(--neon2);}
    .pr-date{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:2px;}
    .r-won{background:var(--neon-dim);color:var(--neon);border:1px solid rgba(0,255,157,0.3);padding:4px 10px;border-radius:3px;font-family:var(--font-mono);font-size:9px;font-weight:700;}
    .r-lost{background:rgba(255,45,85,0.08);color:var(--red);border:1px solid rgba(255,45,85,0.2);padding:4px 10px;border-radius:3px;font-family:var(--font-mono);font-size:9px;font-weight:700;}
    .r-pending{background:var(--bg3);color:var(--yellow);border:1px solid rgba(245,200,66,0.2);padding:4px 10px;border-radius:3px;font-family:var(--font-mono);font-size:9px;font-weight:700;}
    .best-worst{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:14px;}
    .streak-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
  </style>
</head>
<body>
<nav id="side-nav"></nav>
<div id="page-wrap">
  <header id="page-header">
    <div class="page-title"><span class="page-title-icon">📋</span>JOURNAL<span class="page-subtitle">P&amp;L · ROI · STREAKS</span></div>
    <div class="bankroll-wrap"><span class="br-currency">$</span><input class="br-input" id="br-input" type="number" min="1" step="100" value="1000"/></div>
  </header>
  <main id="page-main">
    <div class="stats-grid" id="stats-grid"></div>
    <div id="streak-wrap"></div>

    <div class="chart-wrap">
      <div class="chart-hdr"><div class="chart-title">📈 Bankroll Over Time</div><div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)" id="chart-meta"></div></div>
      <canvas id="bankroll-chart" style="width:100%;height:150px;display:block"></canvas>
    </div>

    <div class="chart-wrap">
      <div class="chart-hdr"><div class="chart-title">🎯 ROI by Sport</div></div>
      <div id="roi-sport"></div>
      <div style="height:12px"></div>
      <div class="chart-hdr"><div class="chart-title">📊 ROI by Market</div></div>
      <div id="roi-market"></div>
    </div>

    <div class="best-worst">
      <div style="font-family:var(--font-mono);font-size:11px;font-weight:700;margin-bottom:10px">🏆 Top 5 Best Bets</div>
      <div id="best-bets"></div>
      <div style="height:12px"></div>
      <div style="font-family:var(--font-mono);font-size:11px;font-weight:700;margin-bottom:10px">💀 Top 5 Worst Bets</div>
      <div id="worst-bets"></div>
    </div>

    <div class="journal-tabs">
      <div class="jt active" id="jt-all"     onclick="setFilter('all')">ALL</div>
      <div class="jt"        id="jt-pending" onclick="setFilter('pending')">⏳</div>
      <div class="jt"        id="jt-won"     onclick="setFilter('won')">✅ WON</div>
      <div class="jt"        id="jt-lost"    onclick="setFilter('lost')">❌ LOST</div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button onclick="clearJournal()" style="padding:6px 12px;font-family:var(--font-mono);font-size:9px;background:rgba(255,45,85,0.08);color:var(--red);border:1px solid rgba(255,45,85,0.2);border-radius:var(--radius);cursor:pointer">🗑 Clear All</button>
      <button onclick="exportCSV()" style="padding:6px 12px;font-family:var(--font-mono);font-size:9px;background:var(--bg3);color:var(--text-muted);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer">📤 Export CSV</button>
    </div>
    <div id="picks-list"></div>
  </main>
</div>
<div id="ticker-bar"></div>
<script src="common.js"></script>
<script>
'use strict';
let pFilter='all';

document.addEventListener('DOMContentLoaded',()=>{
  const inp=document.getElementById('br-input');
  if(inp){inp.value=getBankroll();inp.addEventListener('change',e=>setBankroll(e.target.value));}
  renderAll();
});

function renderAll(){
  const j=getJournal();
  renderStats(j); renderStreak(j); renderChart(j); renderROI(j); renderBestWorst(j); renderPicks(j);
}

function renderStats(j){
  const s=j.filter(x=>x.result!=='pending');
  const won=j.filter(x=>x.result==='won');
  const pend=j.filter(x=>x.result==='pending');
  const staked=s.reduce((a,x)=>a+(parseFloat(x.stake)||0),0);
  const profit=s.reduce((a,x)=>a+(parseFloat(x.profit)||0),0);
  const roi=staked>0?+(profit/staked*100).toFixed(1):0;
  const wr=s.length?+(won.length/s.length*100).toFixed(1):0;
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-box highlight"><div class="sb-val" style="color:${profit>=0?'var(--neon)':'var(--red)'}">${profit>=0?'+':''}$${profit.toFixed(2)}</div><div class="sb-lbl">TOTAL P&L</div><div class="sb-sub">on $${staked.toFixed(2)} staked</div></div>
    <div class="stat-box"><div class="sb-val" style="color:${roi>=0?'var(--neon)':'var(--red)'}">${roi>=0?'+':''}${roi}%</div><div class="sb-lbl">ROI</div><div class="sb-sub">${s.length} settled bets</div></div>
    <div class="stat-box"><div class="sb-val" style="color:var(--neon2)">${wr}%</div><div class="sb-lbl">WIN RATE</div><div class="sb-sub">${won.length}W ${s.length-won.length}L</div></div>
    <div class="stat-box"><div class="sb-val" style="color:var(--yellow)">${pend.length}</div><div class="sb-lbl">PENDING</div><div class="sb-sub">$${pend.reduce((a,x)=>a+(parseFloat(x.stake)||0),0).toFixed(2)} at risk</div></div>`;
}

function renderStreak(j){
  const s=j.filter(x=>x.result!=='pending');
  if(!s.length){document.getElementById('streak-wrap').innerHTML='';return;}
  let streak=0,last=s[0]?.result;
  for(const p of s){if(p.result===last)streak++;else break;}
  let best=0,cur=0,prev='';
  s.slice().reverse().forEach(p=>{if(p.result==='won'){if(prev==='won')cur++;else cur=1;best=Math.max(best,cur);}else cur=0;prev=p.result;});
  const isW=last==='won';
  document.getElementById('streak-wrap').innerHTML=`
    <div class="streak-wrap">
      <div>
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-bottom:4px">CURRENT STREAK</div>
        <span style="background:${isW?'var(--neon-dim)':'rgba(255,45,85,0.08)'};color:${isW?'var(--neon)':'var(--red)'};border:1px solid ${isW?'rgba(0,255,157,0.3)':'rgba(255,45,85,0.2)'};padding:4px 12px;border-radius:4px;font-family:var(--font-mono);font-size:11px;font-weight:700">${isW?'🔥':'❄️'} ${streak} ${last?.toUpperCase()}</span>
      </div>
      <div style="text-align:right"><div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">Best win streak</div><div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--neon)">${best}W</div></div>
    </div>`;
}

function renderChart(j){
  const canvas=document.getElementById('bankroll-chart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth||300,H=150;
  canvas.width=W;canvas.height=H;
  const s=j.filter(x=>x.result!=='pending').slice().reverse();
  if(s.length<2){ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText('Log more bets to see chart',W/2,H/2);return;}
  let br=getBankroll()-s.reduce((a,x)=>a+(parseFloat(x.profit)||0),0);
  const pts=[{v:br}];
  s.forEach(p=>{br+=parseFloat(p.profit)||0;pts.push({v:br});});
  document.getElementById('chart-meta').textContent=`${pts.length-1} bets · $${pts[0].v.toFixed(0)}→$${pts[pts.length-1].v.toFixed(0)}`;
  const minV=Math.min(...pts.map(p=>p.v))*0.97,maxV=Math.max(...pts.map(p=>p.v))*1.03;
  const rng=maxV-minV||1,PAD=16;
  const tx=i=>PAD+(i/(pts.length-1))*(W-PAD*2);
  const ty=v=>H-PAD-((v-minV)/rng)*(H-PAD*2);
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
  for(let i=0;i<=3;i++){const y=PAD+i*(H-PAD*2)/3;ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(W-PAD,y);ctx.stroke();}
  const last=pts[pts.length-1].v;const up=last>=pts[0].v;
  const col=up?'0,255,157':'255,45,85';
  const g=ctx.createLinearGradient(0,PAD,0,H);g.addColorStop(0,`rgba(${col},0.3)`);g.addColorStop(1,`rgba(${col},0.02)`);
  ctx.fillStyle=g;ctx.beginPath();pts.forEach((p,i)=>{if(i===0)ctx.moveTo(tx(i),ty(p.v));else ctx.lineTo(tx(i),ty(p.v));});
  ctx.lineTo(tx(pts.length-1),H-PAD);ctx.lineTo(tx(0),H-PAD);ctx.closePath();ctx.fill();
  ctx.strokeStyle=`rgba(${col},1)`;ctx.lineWidth=2;ctx.beginPath();
  pts.forEach((p,i)=>{if(i===0)ctx.moveTo(tx(i),ty(p.v));else ctx.lineTo(tx(i),ty(p.v));});ctx.stroke();
}

function renderROI(j){
  const s=j.filter(x=>x.result!=='pending');
  const bySport={},byMkt={};
  s.forEach(p=>{
    const sp=p.sport||'Football';
    if(!bySport[sp])bySport[sp]={pr:0,st:0,n:0};bySport[sp].pr+=parseFloat(p.profit)||0;bySport[sp].st+=parseFloat(p.stake)||0;bySport[sp].n++;
    const pick=(p.pick||'').toLowerCase();
    const mkt=pick.includes('win')?'Match Result':pick.includes('over')||pick.includes('under')?'Goals':pick.includes('btts')?'BTTS':pick.includes('fold')?'Acca':'Other';
    if(!byMkt[mkt])byMkt[mkt]={pr:0,st:0,n:0};byMkt[mkt].pr+=parseFloat(p.profit)||0;byMkt[mkt].st+=parseFloat(p.stake)||0;byMkt[mkt].n++;
  });
  const rows=obj=>Object.entries(obj).map(([lbl,d])=>{const roi=d.st>0?+(d.pr/d.st*100).toFixed(1):0;return`<div class="roi-row"><span class="roi-label">${lbl} <span style="font-size:8px;color:var(--text-dim)">(${d.n})</span></span><div class="roi-bar-wrap"><div class="roi-bar-fill" style="width:${Math.min(100,Math.abs(roi)*2)}%;background:${roi>=0?'var(--neon)':'var(--red)'}"></div></div><span class="roi-pct" style="color:${roi>=0?'var(--neon)':'var(--red)'}">${roi>=0?'+':''}${roi}%</span></div>`;}).join('');
  document.getElementById('roi-sport').innerHTML=Object.keys(bySport).length?rows(bySport):'<div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">No data</div>';
  document.getElementById('roi-market').innerHTML=Object.keys(byMkt).length?rows(byMkt):'';
}

function renderBestWorst(j){
  const s=j.filter(x=>x.result!=='pending').sort((a,b)=>b.profit-a.profit);
  const row=p=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.03)"><div><div style="font-weight:700;font-size:11px">${p.match||'—'}</div><div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">${p.pick} · $${p.stake}</div></div><div style="font-family:var(--font-mono);font-size:13px;font-weight:700;color:${p.profit>=0?'var(--neon)':'var(--red)'];margin-left:8px">${p.profit>=0?'+':''}$${parseFloat(p.profit||0).toFixed(2)}</div></div>`;
  document.getElementById('best-bets').innerHTML=s.slice(0,5).map(row).join('')||'<div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">No data</div>';
  document.getElementById('worst-bets').innerHTML=s.slice(-5).reverse().map(row).join('')||'<div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">No data</div>';
}

function renderPicks(j){
  let picks=pFilter==='all'?j:j.filter(x=>x.result===pFilter);
  if(!picks.length){document.getElementById('picks-list').innerHTML=`<div class="empty-state">${pFilter==='all'?'No picks yet — add from Football or Basketball pages.':'No '+pFilter+' picks.'}</div>`;return;}
  document.getElementById('picks-list').innerHTML=picks.map((p,i)=>`
    <div class="pick-row">
      <div class="pr-top">
        <div><div class="pr-match">${p.match||'—'}</div><div class="pr-pick">📌 ${p.pick||'—'}</div><div class="pr-date">${new Date(p.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>
        <span class="${p.result==='won'?'r-won':p.result==='lost'?'r-lost':'r-pending'}">${p.result==='won'?'✅ WON':p.result==='lost'?'❌ LOST':'⏳ PENDING'}</span>
      </div>
      <div class="stat-chips">
        <div class="stat-chip">Stake <span>$${p.stake||0}</span></div>
        <div class="stat-chip">Edge <span style="color:var(--neon)">+${p.edge||0}%</span></div>
        <div class="stat-chip">${p.sport||'Football'}</div>
        ${p.result!=='pending'?`<div class="stat-chip">P&L <span style="color:${p.profit>=0?'var(--neon)':'var(--red)'}">${p.profit>=0?'+':''}$${parseFloat(p.profit||0).toFixed(2)}</span></div>`:''}
      </div>
      ${p.result==='pending'?`<div style="display:flex;gap:6px;margin-top:8px">
        <button onclick="mark(${i},'won')" style="flex:1;padding:6px;font-family:var(--font-mono);font-size:9px;font-weight:700;background:var(--neon-dim);color:var(--neon);border:1px solid rgba(0,255,157,0.3);border-radius:var(--radius);cursor:pointer">✅ WON</button>
        <button onclick="mark(${i},'lost')" style="flex:1;padding:6px;font-family:var(--font-mono);font-size:9px;font-weight:700;background:rgba(255,45,85,0.08);color:var(--red);border:1px solid rgba(255,45,85,0.2);border-radius:var(--radius);cursor:pointer">❌ LOST</button>
        <button onclick="del(${i})" style="padding:6px 10px;font-family:var(--font-mono);font-size:9px;background:var(--bg3);color:var(--text-dim);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer">🗑</button>
      </div>`:''}
    </div>`).join('');
}

function mark(idx,result){
  const j=getJournal();
  const actual=pFilter==='all'?j[idx]:j.filter(x=>x.result===pFilter)[idx];
  const i=j.indexOf(actual);if(i<0)return;
  j[i].result=result;
  j[i].profit=result==='won'?+(parseFloat(j[i].stake||0)*1.91).toFixed(2):-parseFloat(j[i].stake||0);
  saveJournal(j);renderAll();
}

function del(idx){
  const j=getJournal();
  const actual=pFilter==='all'?j[idx]:j.filter(x=>x.result===pFilter)[idx];
  const i=j.indexOf(actual);if(i>=0){j.splice(i,1);saveJournal(j);renderAll();}
}

function setFilter(f){
  pFilter=f;
  ['all','pending','won','lost'].forEach(t=>document.getElementById('jt-'+t).classList.toggle('active',t===f));
  renderPicks(getJournal());
}

function clearJournal(){if(!confirm('Clear journal?'))return;saveJournal([]);renderAll();}

function exportCSV(){
  const j=getJournal();if(!j.length){alert('No picks');return;}
  const csv='Date,Match,Pick,Sport,Stake,Edge,Result,Profit\n'+j.map(p=>`"${new Date(p.date).toLocaleDateString()}","${p.match}","${p.pick}","${p.sport}","${p.stake}","${p.edge}","${p.result}","${p.profit||0}"`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='edgex-journal.csv';a.click();
}
</script>
</body>
</html>
