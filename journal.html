<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Journal — EdgeX</title><link rel="stylesheet" href="style.css"/></head>
<body>
<nav id="side-nav"></nav>
<div id="page-wrap">
  <header id="page-header">
    <div class="page-title"><span class="page-title-icon">📋</span>JOURNAL<span class="page-subtitle">P&amp;L TRACKER</span></div>
    <button id="refresh-btn" onclick="renderJournalPage()">⟳ REFRESH</button>
  </header>
  <main id="page-main">
    <div id="journal-content"></div>
  </main>
</div>
<div id="ticker-bar"></div>
<script src="common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', renderJournalPage);
function renderJournalPage(){
  const j=getJournal();
  const won=j.filter(e=>e.result==='WON').length,lost=j.filter(e=>e.result==='LOST').length;
  const pnl=+j.reduce((s,e)=>s+(+e.profit),0).toFixed(2);
  const sr=won+lost>0?((won/(won+lost))*100).toFixed(0):'--';
  const roi=j.filter(e=>e.result!=='PENDING').length>0?(pnl/j.filter(e=>e.result!=='PENDING').reduce((s,e)=>s+(+e.stake),0)*100).toFixed(1):'--';

  document.getElementById('journal-content').innerHTML=`
    <div class="journal-stats">
      <div class="js-card"><div class="js-val" style="color:var(--neon)">${won}</div><div class="js-label">WON</div></div>
      <div class="js-card"><div class="js-val" style="color:var(--red)">${lost}</div><div class="js-label">LOST</div></div>
      <div class="js-card"><div class="js-val">${sr}%</div><div class="js-label">HIT RATE</div></div>
      <div class="js-card"><div class="js-val" style="color:${pnl>=0?'var(--neon)':'var(--red)'}">${pnl>=0?'+':''}$${Math.abs(pnl)}</div><div class="js-label">P&amp;L</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
      <div class="js-card"><div class="js-val" style="color:var(--neon2)">${roi}%</div><div class="js-label">ROI</div></div>
      <div class="js-card"><div class="js-val">${j.length}</div><div class="js-label">TOTAL PICKS</div></div>
    </div>
    ${j.length===0?`<div class="empty-state">No picks logged yet.<br>Go to <strong>Football</strong> or <strong>Basketball</strong> and click <strong>LOG PICK</strong>.</div>`
    :j.map(e=>`
      <div class="journal-entry">
        <div class="je-meta"><span class="je-date">${e.date}</span><span style="font-family:var(--font-mono);font-size:9px;color:var(--neon2);padding:1px 5px;background:rgba(0,201,255,0.08);border-radius:3px;">${e.market||'FOOTBALL'}</span><span class="je-match">${e.match}</span></div>
        <div class="je-pick">${e.pick}</div>
        <div class="je-row">
          <span class="je-stat">EDGE <strong>+${e.edge}%</strong></span>
          <span class="je-stat">CONF <strong>${e.conf}</strong></span>
          <span class="je-stat">STAKE <strong>$${e.stake}</strong></span>
        </div>
        <div class="je-result-row">
          <span class="je-result ${e.result.toLowerCase()}">${e.result}</span>
          ${e.result==='PENDING'?`
            <button class="result-btn won" onclick="markResult(${e.id},'WON')">✓ WON</button>
            <button class="result-btn lost" onclick="markResult(${e.id},'LOST')">✗ LOST</button>
            <button class="result-btn void" onclick="markResult(${e.id},'VOID')">VOID</button>`
          :`<span class="je-profit" style="color:${e.profit>=0?'var(--neon)':'var(--red)'};margin-left:auto;">${e.profit>=0?'+':''}$${Math.abs(+e.profit).toFixed(2)}</span>`}
        </div>
      </div>`).join('')}
    ${j.length>0?`<button onclick="if(confirm('Clear all journal entries?')){localStorage.removeItem('edgex_journal');location.reload();}" style="width:100%;margin-top:8px;background:none;border:1px dashed rgba(255,45,85,0.3);border-radius:var(--radius);color:var(--red);font-family:var(--font-mono);font-size:10px;padding:8px;cursor:pointer;">🗑️ CLEAR ALL ENTRIES</button>`:''}
  `;
}
function markResult(id,result){
  const j=getJournal();const e=j.find(x=>x.id===id);if(!e)return;
  e.result=result;e.profit=result==='WON'?+(e.stake*1.9).toFixed(2):result==='LOST'?-e.stake:0;
  localStorage.setItem('edgex_journal',JSON.stringify(j));EDGEX.journal=j;
  renderJournalPage();showToast(result==='WON'?'✅ Marked as WON':'❌ Marked as LOST');
}
</script>
</body>
</html>
