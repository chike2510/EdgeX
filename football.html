<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Football — EdgeX</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .tab-row{display:flex;gap:6px;margin-bottom:14px;}
    .tab-btn{flex:1;padding:9px 0;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:1.5px;border-radius:var(--radius);cursor:pointer;transition:var(--transition);border:1px solid var(--border);}
    .tab-btn.active{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#07090d;border-color:transparent;}
    .tab-btn:not(.active){background:var(--bg2);color:var(--text-muted);}
    .live-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9px;color:var(--neon);background:var(--neon-dim);border:1px solid rgba(0,255,157,0.3);padding:2px 7px;border-radius:3px;letter-spacing:1px;}
    .live-dot{width:5px;height:5px;border-radius:50%;background:var(--neon);animation:ndot 1s ease-in-out infinite;}
    .match-live-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:10px;cursor:pointer;transition:var(--transition);}
    .match-live-card:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-1px);}
    .match-live-card.has-edge{border-left:3px solid var(--neon);}
    .mlc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .mlc-score{display:flex;align-items:center;gap:10px;}
    .mlc-team{font-weight:800;font-size:14px;}
    .mlc-num{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--neon);min-width:20px;text-align:center;}
    .mlc-vs{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);}
    .mlc-min{font-family:var(--font-mono);font-size:10px;color:var(--yellow);background:rgba(245,200,66,0.1);padding:2px 7px;border-radius:3px;border:1px solid rgba(245,200,66,0.2);}
    .mlc-min.ht{color:var(--text-dim);background:var(--bg4);}
    .mlc-min.ft{color:var(--red);background:rgba(255,45,85,0.08);}
    .momentum-bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:8px 0;display:flex;}
    .mb-home{background:linear-gradient(90deg,var(--neon),var(--neon2));transition:width 0.8s ease;}
    .mb-away{background:linear-gradient(90deg,#a855f7,#7b5cff);flex:1;}
    .mom-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--text-dim);}
    .ngp-row{display:flex;align-items:center;gap:8px;padding:6px 0;}
    .ngp-label{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);flex-shrink:0;}
    .ngp-bar{flex:1;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
    .ngp-fill{height:100%;background:linear-gradient(90deg,var(--neon),var(--neon2));transition:width 0.6s ease;}
    .ngp-pct{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--neon);flex-shrink:0;}
    .latest-event{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:6px;display:flex;align-items:center;gap:5px;}
    /* Match Hub */
    .match-hub-overlay{position:fixed;inset:0;background:var(--bg);z-index:600;display:flex;flex-direction:column;overflow:hidden;}
    .mh-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 14px;flex-shrink:0;}
    .mh-back{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);cursor:pointer;background:var(--bg3);border:1px solid var(--border);padding:5px 10px;border-radius:var(--radius);margin-bottom:10px;display:inline-flex;align-items:center;gap:5px;}
    .mh-scoreboard{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .mh-team{font-weight:800;font-size:15px;}
    .mh-team.away{text-align:right;}
    .mh-score-center{text-align:center;}
    .mh-score-big{font-family:var(--font-mono);font-size:32px;font-weight:700;color:var(--neon);line-height:1;}
    .mh-min{font-family:var(--font-mono);font-size:10px;color:var(--yellow);margin-top:3px;}
    .mh-tabs{display:flex;gap:4px;margin-top:10px;}
    .mh-tab{flex:1;padding:6px 0;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:1px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text-muted);transition:var(--transition);}
    .mh-tab.active{background:var(--neon-dim);color:var(--neon);border-color:rgba(0,255,157,0.3);}
    .mh-body{flex:1;overflow-y:auto;padding:14px;}
    /* Canvas pitch */
    #pitch-canvas{width:100%;border-radius:var(--radius);display:block;}
    .pitch-wrap{background:#1a3a17;border-radius:var(--radius);overflow:hidden;margin:10px 0;position:relative;}
    .pitch-overlay{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;}
    .pitch-team-label{font-family:var(--font-mono);font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;}
    .pitch-home-label{background:rgba(0,255,157,0.2);color:var(--neon);}
    .pitch-away-label{background:rgba(168,85,247,0.2);color:#a855f7;}
    /* Timeline */
    .timeline{margin:10px 0;}
    .tl-event{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
    .tl-min{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);width:30px;flex-shrink:0;}
    .tl-icon{font-size:14px;flex-shrink:0;width:20px;text-align:center;}
    .tl-detail{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);flex:1;line-height:1.5;}
    .tl-detail strong{color:var(--text);}
    /* Alerts */
    .alert-box{border-radius:var(--radius);padding:8px 12px;margin:5px 0;font-family:var(--font-mono);font-size:10px;line-height:1.5;border-left:3px solid;}
    .alert-box.warn{background:rgba(245,200,66,0.06);border-color:var(--yellow);color:var(--yellow);}
    .alert-box.hot{background:rgba(255,45,85,0.06);border-color:var(--red);color:var(--red);}
    .alert-box.info{background:rgba(0,201,255,0.06);border-color:var(--neon2);color:var(--neon2);}
    .alert-box.good{background:var(--neon-dim);border-color:var(--neon);color:var(--neon);}
    /* Stats */
    .team-stat-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
    .tsr-label{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);width:80px;text-align:center;}
    .tsr-bar-wrap{flex:1;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;display:flex;}
    .tsr-home{background:var(--neon);height:100%;transition:width 0.8s ease;}
    .tsr-away{background:#a855f7;height:100%;transition:width 0.8s ease;}
    .tsr-val{font-family:var(--font-mono);font-size:10px;font-weight:700;width:24px;}
    .tsr-val.home{color:var(--neon);}
    .tsr-val.away{color:#a855f7;text-align:right;}
    /* Player table */
    .player-table{width:100%;border-collapse:collapse;margin:10px 0;}
    .player-table th{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:1px;padding:5px 6px;text-align:left;border-bottom:1px solid var(--border);}
    .player-table td{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);padding:5px 6px;border-bottom:1px solid rgba(255,255,255,0.02);}
    .player-table tr.best td{color:var(--text);background:rgba(0,255,157,0.04);}
    .player-table .rating{font-weight:700;}
    .player-table .rating.high{color:var(--neon);}
    .player-table .rating.mid{color:var(--yellow);}
    /* Auto-refresh countdown */
    .refresh-bar{height:2px;background:var(--border);position:fixed;top:0;left:0;right:0;z-index:999;}
    .refresh-progress{height:100%;background:var(--neon);transition:width 1s linear;}
  </style>
</head>
<body>
<div class="refresh-bar"><div class="refresh-progress" id="ref-progress" style="width:100%"></div></div>
<nav id="side-nav"></nav>
<div id="page-wrap">
  <header id="page-header">
    <div class="page-title"><span class="page-title-icon">⚽</span>FOOTBALL<span class="page-subtitle">LIVE · PREDICTIONS · ANALYSIS</span></div>
    <div class="bankroll-wrap"><span class="br-currency">$</span><input class="br-input" id="br-input" type="number" min="1" step="100" value="1000"/></div>
    <button id="refresh-btn" onclick="refreshAll()">⟳</button>
  </header>
  <main id="page-main">
    <div class="tab-row">
      <button class="tab-btn active" id="tab-live" onclick="switchTab('live')">🔴 LIVE</button>
      <button class="tab-btn" id="tab-fixtures" onclick="switchTab('fixtures')">📅 FIXTURES</button>
    </div>

    <!-- LIVE TAB -->
    <div id="panel-live">
      <div id="live-banner" class="odds-api-banner live" style="margin-bottom:12px;">
        <div class="oab-dot live"></div>
        <div class="oab-text" id="live-count">Loading live matches...</div>
      </div>
      <div id="live-matches"></div>
    </div>

    <!-- FIXTURES TAB -->
    <div id="panel-fixtures" style="display:none">
      <div class="toolbar">
        <div class="toolbar-left">
          <span class="tool-label">LEAGUE</span>
          <button class="filter-btn active" onclick="filterLeague('ALL',this)">ALL</button>
          <button class="filter-btn" onclick="filterLeague('EPL',this)">EPL</button>
          <button class="filter-btn" onclick="filterLeague('UCL',this)">UCL</button>
          <button class="filter-btn" onclick="filterLeague('LA LIGA',this)">LA LIGA</button>
          <button class="filter-btn" onclick="filterLeague('BUNDESLIGA',this)">BUND</button>
          <button class="filter-btn" onclick="filterLeague('SERIE A',this)">SERIE A</button>
        </div>
      </div>
      <div id="acca-bar" style="display:none;background:linear-gradient(135deg,rgba(0,201,255,0.08),rgba(0,255,157,0.05));border:1px solid rgba(0,201,255,0.25);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;"></div>
      <div id="fixture-calendar">
        <div class="loading-wrap"><div class="loader"></div><div class="loading-text">GENERATING FIXTURES...</div></div>
      </div>
    </div>
  </main>
</div>

<!-- MATCH HUB OVERLAY -->
<div id="match-hub" class="match-hub-overlay" style="display:none">
  <div class="mh-header">
    <div class="mh-back" onclick="closeMatchHub()">← BACK</div>
    <div class="mh-scoreboard">
      <div class="mh-team" id="mh-home-name">Home</div>
      <div class="mh-score-center">
        <div class="mh-score-big" id="mh-score">0 – 0</div>
        <div class="mh-min" id="mh-min">0'</div>
      </div>
      <div class="mh-team away" id="mh-away-name">Away</div>
    </div>
    <div class="mh-tabs">
      <button class="mh-tab active" id="mht-match" onclick="switchMHTab('match')">MATCH</button>
      <button class="mh-tab" id="mht-pitch" onclick="switchMHTab('pitch')">⚽ PITCH</button>
      <button class="mh-tab" id="mht-stats" onclick="switchMHTab('stats')">STATS</button>
      <button class="mh-tab" id="mht-analysis" onclick="switchMHTab('analysis')">ANALYSIS</button>
    </div>
  </div>
  <div class="mh-body" id="mh-body"></div>
</div>

<div id="ticker-bar"></div>
<script src="common.js"></script>
<script src="football-live.js"></script>
<script src="football-page.js"></script>
<script>
let currentTab = 'live';
let currentMHTab = 'match';
let activeMatchId = null;
let refreshTimer = 30;
let refInterval = null;

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('panel-live').style.display = tab==='live'?'':'none';
  document.getElementById('panel-fixtures').style.display = tab==='fixtures'?'':'none';
  document.getElementById('tab-live').className = 'tab-btn'+(tab==='live'?' active':'');
  document.getElementById('tab-fixtures').className = 'tab-btn'+(tab==='fixtures'?' active':'');
  if(tab==='fixtures' && window.ALL_FIXTURES && window.ALL_FIXTURES.length===0) renderCalendar();
}

function switchMHTab(tab) {
  currentMHTab = tab;
  ['match','pitch','stats','analysis'].forEach(t => {
    document.getElementById('mht-'+t).className = 'mh-tab'+(t===tab?' active':'');
  });
  if(activeMatchId !== null) renderMHTab(tab, activeMatchId);
}

function closeMatchHub() {
  document.getElementById('match-hub').style.display = 'none';
  if(window.activePitch) { window.activePitch.stop(); window.activePitch = null; }
  activeMatchId = null;
}

function refreshAll() {
  if(currentTab === 'live') { LIVE_MATCHES.forEach(m => { if(m.status==='LIVE') { for(let i=0;i<5;i++) m.tick(); } }); renderLiveList(); }
  else { ALL_FIXTURES = enrichFixtures(generateFixtures()); renderCalendar(); }
}

function filterLeague(league, btn) {
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b===btn));
  document.querySelectorAll('.fixture-row').forEach(row => {
    const lt = row.querySelector('.fr-league')?.textContent || '';
    const show = league==='ALL' || lt.includes(league);
    row.style.display = show ? '' : 'none';
  });
  document.querySelectorAll('.calendar-day').forEach(day => {
    const vis = [...day.querySelectorAll('.fixture-row')].some(r=>r.style.display!=='none');
    day.style.display = vis?'':'none';
  });
}

// Auto-refresh countdown bar
function startRefreshBar() {
  refreshTimer = 30;
  if(refInterval) clearInterval(refInterval);
  refInterval = setInterval(() => {
    refreshTimer--;
    const pct = (refreshTimer/30)*100;
    const bar = document.getElementById('ref-progress');
    if(bar) bar.style.width = pct + '%';
    if(refreshTimer <= 0) {
      refreshTimer = 30;
      LIVE_MATCHES.forEach(m => { if(m.status==='LIVE') { for(let i=0;i<30;i++) m.tick(); } });
      renderLiveList();
      if(activeMatchId!==null) { updateMatchHubHeader(activeMatchId); renderMHTab(currentMHTab, activeMatchId); }
    }
  }, 1000);
}

document.addEventListener('DOMContentLoaded', () => {
  setupBankroll();
  initLiveMatches();
  renderLiveList();
  startRefreshBar();
  // Fixtures load in background
  setTimeout(() => { ALL_FIXTURES = enrichFixtures(generateFixtures()); }, 300);
});

function setupBankroll() {
  const inp = document.getElementById('br-input');
  if(inp){ inp.value=getBankroll(); inp.addEventListener('change',e=>setBankroll(e.target.value)); }
}
</script>
</body>
</html>
