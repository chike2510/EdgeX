<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Football — EdgeX</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .tab-row{display:flex;gap:6px;margin-bottom:14px;}
    .tab-btn{flex:1;padding:10px 0;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:1.5px;border-radius:var(--radius);cursor:pointer;transition:var(--transition);border:1px solid var(--border);background:var(--bg2);color:var(--text-muted);}
    .tab-btn.active{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#07090d;border-color:transparent;}
    /* Match card */
    .mcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:10px;cursor:pointer;transition:var(--transition);}
    .mcard:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-1px);}
    .mcard.live{border-left:3px solid var(--neon);}
    .mcard.ht{border-left:3px solid var(--yellow);}
    .mcard.ft{border-left:3px solid var(--text-dim);}
    .mcard.upcoming{border-left:3px solid var(--neon2);}
    .mc-top{display:flex;align-items:center;gap:6px;margin-bottom:10px;overflow:hidden;}
    .mc-home{font-weight:800;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .mc-score{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--neon);min-width:52px;text-align:center;flex-shrink:0;}
    .mc-score.ns{color:var(--text-dim);font-size:14px;}
    .mc-away{font-weight:800;font-size:13px;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .mc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
    .live-pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:9px;color:var(--neon);background:var(--neon-dim);border:1px solid rgba(0,255,157,0.3);padding:2px 7px;border-radius:3px;letter-spacing:1px;}
    .live-dot{width:5px;height:5px;border-radius:50%;background:var(--neon);animation:ndot 1s ease-in-out infinite;}
    .status-tag{font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:3px;border:1px solid;}
    .status-tag.live{color:var(--yellow);background:rgba(245,200,66,0.08);border-color:rgba(245,200,66,0.2);}
    .status-tag.ht{color:var(--text-dim);background:var(--bg4);border-color:var(--border);}
    .status-tag.ft{color:var(--red);background:rgba(255,45,85,0.06);border-color:rgba(255,45,85,0.2);}
    .status-tag.ns{color:var(--neon2);background:rgba(0,201,255,0.06);border-color:rgba(0,201,255,0.2);}
    .mc-league{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:1px;}
    .mom-wrap{margin:8px 0 4px;}
    .mom-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-bottom:3px;}
    .mom-bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;display:flex;}
    .mom-h{background:linear-gradient(90deg,var(--neon),var(--neon2));transition:width 0.8s ease;}
    .mom-a{background:linear-gradient(90deg,#a855f7,#7b5cff);flex:1;}
    .ngp-row{display:flex;align-items:center;gap:8px;}
    .ngp-lbl{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);width:68px;flex-shrink:0;}
    .ngp-bar{flex:1;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
    .ngp-fill{height:100%;background:linear-gradient(90deg,var(--neon),var(--neon2));transition:width 0.6s ease;}
    .ngp-pct{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--neon);width:32px;text-align:right;flex-shrink:0;}
    .last-evt{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;align-items:center;gap:5px;}
    .pred-strip{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
    /* Hub */
    .hub{position:fixed;inset:0;background:var(--bg);z-index:600;display:flex;flex-direction:column;overflow:hidden;width:100vw;max-width:100vw;box-sizing:border-box;}
    .hub-hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 12px;flex-shrink:0;overflow:hidden;}
    .hub-back{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);cursor:pointer;background:var(--bg3);border:1px solid var(--border);padding:5px 10px;border-radius:var(--radius);margin-bottom:10px;display:inline-flex;align-items:center;gap:5px;}
    .hub-score-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-bottom:8px;overflow:hidden;}
    .hub-team{font-weight:800;font-size:12px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
    .hub-team.r{text-align:right;}
    .hub-num{font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--neon);line-height:1;text-align:center;}
    .hub-min{font-family:var(--font-mono);font-size:10px;color:var(--yellow);margin-top:3px;text-align:center;}
    .hub-tabs{display:flex;gap:3px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
    .hub-tab{flex-shrink:0;padding:5px 8px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.3px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text-muted);transition:var(--transition);white-space:nowrap;}
    .hub-tab.active{background:var(--neon-dim);color:var(--neon);border-color:rgba(0,255,157,0.3);}
    .hub-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;}
    /* Timeline */
    .tl-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
    .tl-min{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);width:30px;flex-shrink:0;}
    .tl-ico{font-size:14px;width:20px;text-align:center;flex-shrink:0;}
    .tl-txt{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);flex:1;line-height:1.5;}
    .tl-txt strong{color:var(--text);}
    /* Stats compare */
    .sc-row{display:flex;align-items:center;gap:8px;margin:5px 0;}
    .sc-h{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--neon);width:28px;text-align:right;}
    .sc-a{font-family:var(--font-mono);font-size:10px;font-weight:700;color:#a855f7;width:28px;}
    .sc-bar{flex:1;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;display:flex;}
    .sc-bh{height:100%;background:var(--neon);transition:width 0.8s ease;}
    .sc-ba{height:100%;background:#a855f7;transition:width 0.8s ease;}
    .sc-lbl{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);text-align:center;margin:-2px 0 6px;}
    /* Pitch */
    .pitch-wrap{background:#1e4d1a;border-radius:var(--radius);overflow:hidden;position:relative;margin:10px 0;}
    #pitch-canvas{width:100%;display:block;}
    .pitch-legend{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;}
    .plbl{font-family:var(--font-mono);font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;}
    .plbl.h{background:rgba(0,255,157,0.2);color:var(--neon);}
    .plbl.a{background:rgba(168,85,247,0.2);color:#a855f7;}
    /* Lineup */
    .lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
    .lineup-col{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px;}
    .lineup-title{font-family:var(--font-mono);font-size:9px;letter-spacing:1px;margin-bottom:8px;}
    .lineup-title.h{color:var(--neon);}
    .lineup-title.a{color:#a855f7;}
    .player-row{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
    .player-num{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);width:18px;flex-shrink:0;text-align:right;}
    .player-name{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);flex:1;}
    .player-pos{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);background:var(--bg4);padding:1px 4px;border-radius:2px;}
    /* Refresh bar */
    .ref-bar{height:2px;background:var(--border);position:fixed;top:0;left:0;right:0;z-index:999;}
    .ref-prog{height:100%;background:var(--neon);transition:width 1s linear;}
  </style>
</head>
<body>
<div class="ref-bar"><div class="ref-prog" id="ref-prog" style="width:100%"></div></div>
<nav id="side-nav"></nav>

<div id="page-wrap">
  <header id="page-header">
    <div class="page-title">
      <span class="page-title-icon">⚽</span>FOOTBALL
      <span class="page-subtitle">LIVE · PREDICTIONS · ANALYSIS</span>
    </div>
    <div class="bankroll-wrap">
      <span class="br-currency">$</span>
      <input class="br-input" id="br-input" type="number" min="1" step="100" value="1000"/>
    </div>
    <button id="refresh-btn" onclick="refresh()">⟳</button>
  </header>

  <main id="page-main">
    <!-- Date navigation -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <button onclick="changeDay(-1)" style="padding:7px 14px;font-family:var(--font-mono);font-size:14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-muted);cursor:pointer;line-height:1">‹</button>
      <div id="date-display" style="flex:1;font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--neon);text-align:center;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:7px">TODAY</div>
      <button onclick="changeDay(1)" style="padding:7px 14px;font-family:var(--font-mono);font-size:14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-muted);cursor:pointer;line-height:1">›</button>
    </div>
    <div class="tab-row">
      <button class="tab-btn active" id="tb-live"      onclick="showTab('live')">🔴 LIVE</button>
      <button class="tab-btn"        id="tb-fixtures"  onclick="showTab('fixtures')">📅 FIXTURES</button>
      <button class="tab-btn"        id="tb-standings" onclick="showTab('standings')">🏆 TABLE</button>
      <button class="tab-btn"        id="tb-players"   onclick="showTab('topscorers')">⚽ STATS</button>
    </div>

    <!-- Live -->
    <div id="pnl-live">
      <div id="live-banner" class="odds-api-banner sim" style="margin-bottom:12px;">
        <div class="oab-dot sim" id="banner-dot"></div>
        <div class="oab-text" id="banner-txt">Loading matches...</div>
      </div>
      <div id="live-list"></div>
    </div>

    <!-- Fixtures -->
    <div id="pnl-fixtures" style="display:none">
      <div class="toolbar" style="margin-bottom:12px;">
        <div class="toolbar-left">
          <span class="tool-label">LEAGUE</span>
          <button class="filter-btn active" onclick="filterBy('ALL',this)">ALL</button>
          <button class="filter-btn" onclick="filterBy('Premier',this)">EPL</button>
          <button class="filter-btn" onclick="filterBy('Champions',this)">UCL</button>
          <button class="filter-btn" onclick="filterBy('La Liga',this)">LA LIGA</button>
          <button class="filter-btn" onclick="filterBy('Bundesliga',this)">BUND</button>
          <button class="filter-btn" onclick="filterBy('Serie A',this)">SERIE A</button>
        </div>
      </div>
      <div id="fix-list"></div>
    </div>
    <!-- Standings panel -->
    <div id="pnl-standings" style="display:none">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px">
        <button class="filter-btn active" onclick="selectStandingsLeague(39,'EPL',this)">EPL</button>
        <button class="filter-btn" onclick="selectStandingsLeague(140,'La Liga',this)">La Liga</button>
        <button class="filter-btn" onclick="selectStandingsLeague(78,'Bundesliga',this)">Bundesliga</button>
        <button class="filter-btn" onclick="selectStandingsLeague(135,'Serie A',this)">Serie A</button>
        <button class="filter-btn" onclick="selectStandingsLeague(61,'Ligue 1',this)">Ligue 1</button>
        <button class="filter-btn" onclick="selectStandingsLeague(88,'Eredivisie',this)">Eredivisie</button>
      </div>
      <div id="standings-banner" class="odds-api-banner sim" style="margin-bottom:12px">
        <div class="oab-dot sim" id="std-dot"></div>
        <div class="oab-text" id="std-txt">Select a league</div>
      </div>
      <div id="standings-content"></div>
    </div>

    <!-- Top scorers panel -->
    <div id="pnl-topscorers" style="display:none">
      <div style="display:flex;gap:6px;margin-bottom:12px">
        <div class="filter-btn active" id="ts-scorers" onclick="switchScorersView('scorers',this)" style="cursor:pointer">⚽ SCORERS</div>
        <div class="filter-btn" id="ts-assists" onclick="switchScorersView('assists',this)" style="cursor:pointer">🎯 ASSISTS</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px">
        <button class="filter-btn active" onclick="selectScorersLeague(39,this)">EPL</button>
        <button class="filter-btn" onclick="selectScorersLeague(140,this)">La Liga</button>
        <button class="filter-btn" onclick="selectScorersLeague(78,this)">Bundesliga</button>
        <button class="filter-btn" onclick="selectScorersLeague(135,this)">Serie A</button>
        <button class="filter-btn" onclick="selectScorersLeague(61,this)">Ligue 1</button>
        <button class="filter-btn" onclick="selectScorersLeague(2,this)">UCL</button>
      </div>
      <div id="scorers-content"></div>
    </div>
  </main>
</div>

<!-- Hub overlay -->
<div id="match-hub" class="hub" style="display:none">
  <div class="hub-hdr">
    <button class="hub-back" onclick="closeHub()">← BACK</button>
    <div class="hub-score-row">
      <div class="hub-team" id="hh-home">—</div>
      <div class="hub-score-center">
        <div class="hub-num" id="hh-score">0–0</div>
        <div class="hub-min" id="hh-status">—</div>
      </div>
      <div class="hub-team r" id="hh-away">—</div>
    </div>
    <div class="hub-tabs" style="flex-wrap:wrap;gap:3px;">
      <button class="hub-tab active" id="ht-match"       onclick="hubTab('match')">MATCH</button>
      <button class="hub-tab"        id="ht-commentary"  onclick="hubTab('commentary')">📢</button>
      <button class="hub-tab"        id="ht-players"     onclick="hubTab('players')">👤</button>
      <button class="hub-tab"        id="ht-lineup"      onclick="hubTab('lineup')">LINEUP</button>
      <button class="hub-tab"        id="ht-pitch"       onclick="hubTab('pitch')">PITCH</button>
      <button class="hub-tab"        id="ht-h2h"         onclick="hubTab('h2h')">H2H</button>
      <button class="hub-tab"        id="ht-matrix"      onclick="hubTab('matrix')">MATRIX</button>
      <button class="hub-tab"        id="ht-analysis"    onclick="hubTab('analysis')">EDGE</button>
    </div>
  </div>
  <div class="hub-body" id="hub-body"></div>
</div>

<div id="ticker-bar"></div>
<script src="common.js"></script>
<script>
'use strict';

const ICONS = {GOAL:'⚽',YELLOW:'🟨',RED:'🟥',subst:'🔄',VAR:'📺',CHANCE:'🎯',CORNER:'🚩',FOUL:'⚠️'};

// ── STATE ─────────────────────────────────────────────────────────────────────
let LIVE_DATA    = [];   // live/today matches from API
let DATE_OFFSET  = 0;    // 0=today, -1=yesterday, +1=tomorrow etc.
let FIX_DATA     = [];   // fixtures from API
let ACTIVE       = null; // match open in hub
let ACTIVE_TAB   = 'match';
let PITCH_ANIM   = null;
let REF_TIMER    = 30;

// ── TEAMS DB for predictions ──────────────────────────────────────────────────
const TEAMS_DB = [
  {name:'Manchester City',   atk:91,def:87,form:[3,3,1,3,3],ha:1.18},
  {name:'Arsenal',           atk:88,def:85,form:[3,3,3,1,3],ha:1.15},
  {name:'Liverpool',         atk:90,def:82,form:[3,1,3,3,1],ha:1.20},
  {name:'Manchester United', atk:74,def:70,form:[0,1,3,0,1],ha:1.10},
  {name:'Chelsea',           atk:81,def:78,form:[1,0,3,1,3],ha:1.10},
  {name:'Tottenham',         atk:79,def:74,form:[3,1,1,0,3],ha:1.08},
  {name:'Newcastle',         atk:77,def:80,form:[3,3,1,0,1],ha:1.12},
  {name:'Aston Villa',       atk:80,def:76,form:[3,3,1,3,0],ha:1.09},
  {name:'Brighton',          atk:75,def:72,form:[1,1,3,1,3],ha:1.06},
  {name:'West Ham',          atk:70,def:68,form:[0,1,3,1,0],ha:1.05},
  {name:'Real Madrid',       atk:94,def:88,form:[3,3,3,1,3],ha:1.22},
  {name:'Barcelona',         atk:92,def:84,form:[3,3,1,3,3],ha:1.20},
  {name:'Atletico Madrid',   atk:79,def:88,form:[3,1,3,3,0],ha:1.15},
  {name:'Villarreal',        atk:75,def:74,form:[1,3,0,3,1],ha:1.08},
  {name:'Bayern Munich',     atk:93,def:86,form:[3,3,3,3,1],ha:1.21},
  {name:'Borussia Dortmund', atk:83,def:75,form:[1,3,3,1,3],ha:1.14},
  {name:'Bayer Leverkusen',  atk:86,def:80,form:[3,3,3,1,3],ha:1.16},
  {name:'RB Leipzig',        atk:81,def:78,form:[3,1,3,3,1],ha:1.12},
  {name:'Inter Milan',       atk:85,def:86,form:[3,1,3,3,1],ha:1.16},
  {name:'AC Milan',          atk:82,def:80,form:[3,3,0,1,3],ha:1.14},
  {name:'Juventus',          atk:78,def:82,form:[1,1,3,3,3],ha:1.10},
  {name:'Napoli',            atk:80,def:78,form:[3,3,1,3,0],ha:1.13},
  {name:'AS Roma',           atk:77,def:74,form:[1,3,3,0,1],ha:1.09},
  {name:'PSG',               atk:89,def:83,form:[3,3,1,3,3],ha:1.18},
  {name:'Porto',             atk:76,def:79,form:[3,3,1,1,3],ha:1.12},
  {name:'Benfica',           atk:79,def:77,form:[3,1,3,3,1],ha:1.13},
  {name:'Celtic',            atk:74,def:70,form:[3,3,3,1,3],ha:1.15},
  {name:'Rangers',           atk:70,def:68,form:[1,3,1,3,0],ha:1.11},
  {name:'Ajax',              atk:80,def:74,form:[3,3,1,3,0],ha:1.14},
  {name:'PSV',               atk:82,def:76,form:[3,3,3,1,1],ha:1.15},
];

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('br-input');
  if (inp) { inp.value = getBankroll(); inp.addEventListener('change', e => setBankroll(e.target.value)); }
  loadLive();
  startRefBar();
});

// ── LOAD LIVE ─────────────────────────────────────────────────────────────────
async function loadLive() {
  setBanner('loading', 'Fetching matches...');
  showLoading('live-list');
  try {
    const dateParam = DATE_OFFSET !== 0 ? '&date=' + getDateStr(DATE_OFFSET) : '';
    const res  = await fetch('/api/sports?type=football-live' + dateParam);
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'No data');

    LIVE_DATA = json.data.map(parseMatch).filter(Boolean);
    if (LIVE_DATA.length === 0) throw new Error('No matches returned');

    // Attach predictions to each match
    LIVE_DATA.forEach(m => { Object.assign(m, computePred(m.home, m.away)); });

    // Try to get live odds
    try {
      const oddsRes  = await fetch('/api/sports?type=football-odds&sport=soccer_epl');
      const oddsJson = await oddsRes.json();
      if (oddsJson.success) attachOdds(oddsJson.data);
    } catch {}

    renderLiveList();
    const liveCount = LIVE_DATA.filter(m => m.isLive).length;
    const src = json.source;
    setBanner('live', src === 'live'
      ? `<strong>${liveCount} LIVE NOW</strong> · ${LIVE_DATA.length} total · SportsAPIPro`
      : src === 'today'
      ? `${LIVE_DATA.length} matches today · SportsAPIPro`
      : `${LIVE_DATA.length} upcoming matches · SportsAPIPro`
    );
  } catch (e) {
    document.getElementById('live-list').innerHTML = `
      <div class="empty-state">
        <strong>No matches found</strong><br>
        ${e.message}<br><br>
        Try the Fixtures tab for upcoming games.
      </div>`;
    setBanner('sim', 'No live matches right now');
  }
}

// ── LOAD FIXTURES ─────────────────────────────────────────────────────────────
async function loadFixtures() {
  showLoading('fix-list');
  try {
    const res  = await fetch('/api/sports?type=football-fixtures');
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'No fixtures');

    FIX_DATA = json.data.map(parseMatch).filter(Boolean);
    FIX_DATA.forEach(m => { Object.assign(m, computePred(m.home, m.away)); });
    renderFixtures();
  } catch (e) {
    document.getElementById('fix-list').innerHTML = `<div class="empty-state"><strong>No fixtures found</strong><br>${e.message}</div>`;
  }
}

// ── PARSE MATCH ───────────────────────────────────────────────────────────────
// ── PARSE MATCH ───────────────────────────────────────────────────────────────
// api/sports.js already transforms API-Football to EdgeX format.
// Just validate and add momentum.
function parseMatch(e) {
  if (!e.home || !e.away) return null;
  return {
    ...e,
    stats:    null,
    lineups:  null,
    momentum: { home: 50 + (e.isLive ? ((e.score?.home||0) - (e.score?.away||0)) * 8 : 0) },
  };
}


function parseStats(raw) {
  if (!Array.isArray(raw) || raw.length === 0) return null;
  const stats = {};
  raw.forEach(team => {
    const name = team.team_name || team.team?.name;
    if (!name) return;
    stats[name] = {};
    (team.statistics || team.stats || []).forEach(s => {
      stats[name][s.type] = s.value;
    });
  });
  return Object.keys(stats).length > 0 ? stats : null;
}

function parseLineups(raw) {
  if (!Array.isArray(raw) || raw.length === 0) return null;
  return raw.map(team => ({
    team:      team.team_name || team.team?.name || '',
    formation: team.lineup_formation || team.formation || '',
    players:   (team.lineup_players || team.startXI || []).map(p => ({
      name:   p.player_name || p.player?.name || p.name || '',
      number: p.player_number || p.number || '',
      pos:    p.player_position || p.pos || '',
    })),
    subs: (team.lineup_substitutes || team.substitutes || []).map(p => ({
      name:   p.player_name || p.player?.name || '',
      number: p.player_number || '',
    })),
  }));
}

function attachOdds(oddsData) {
  if (!Array.isArray(oddsData)) return;
  oddsData.forEach(o => {
    const m = LIVE_DATA.find(x => String(x.id) === String(o.id || o.event_key));
    if (!m || !Array.isArray(o.odds)) return;
    const main = o.odds.find(x => x.odd_name === 'Match Result' || x.odd_id === '1' || x.odd_name === '1X2') || o.odds[0];
    if (main) {
      m.odds = {
        home: parseFloat(main.odd_1 || main.odd_home_value || 0),
        draw: parseFloat(main.odd_x || main.odd_draw_value || 0),
        away: parseFloat(main.odd_2 || main.odd_away_value || 0),
      };
    }
  });
}

// ── PREDICTION ENGINE ─────────────────────────────────────────────────────────
function poisson(l, k) { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; }

// ── Poisson PMF ──────────────────────────────────────────────────────────────
function poisson(l, k) { if(k<0||l<=0) return 0; let p=Math.exp(-l); for(let i=1;i<=k;i++) p*=l/i; return p; }

// ── APEX football prediction engine ──────────────────────────────────────────
// matchCtx = { score:{home,away}, isLive, status, hxG, axG, hShots, aShots, hShotsOnT, aShotsOnT, h2h }
function computePred(homeName, awayName, matchCtx) {
  const ctx = matchCtx || {};
  const find = name => {
    if (!name) return null;
    const n = name.toLowerCase().trim();
    return TEAMS_DB.find(t => n === t.name.toLowerCase())
      || TEAMS_DB.find(t => n.includes(t.name.toLowerCase()) || t.name.toLowerCase().includes(n))
      || TEAMS_DB.find(t => t.name.toLowerCase().split(' ').some(w => w.length > 3 && n.split(' ').includes(w)));
  };
  const h = find(homeName), a = find(awayName);
  const ff = form => (form||[1]).slice(-5).reduce((s,v)=>s+v,0)/((form||[1]).length*3);

  // ── λ expected goals ─────────────────────────────────────────────────────
  let λH, λA;
  if (ctx.hxG && ctx.axG) {
    // Real xG from API — most accurate
    λH = parseFloat(ctx.hxG);
    λA = parseFloat(ctx.axG);
  } else if (h && a) {
    const ATK = 2.4;
    λH = ATK*(h.atk/100)*(1-(a.def/100)*0.7)*(0.7+ff(h.form)*0.6)*h.ha;
    λA = ATK*(a.atk/100)*(1-(h.def/100)*0.7)*(0.7+ff(a.form)*0.6);
  } else {
    λH = 1.25 + Math.random()*0.3;
    λA = 0.95 + Math.random()*0.3;
  }
  λH = Math.max(0.2, Math.min(4.0, λH));
  λA = Math.max(0.2, Math.min(3.5, λA));

  // H2H adjustment
  if (ctx.h2h && ctx.h2h.length >= 3) {
    let hw=0, aw=0;
    ctx.h2h.slice(0,5).forEach(g=>{
      const hg=g.goals?.home??g.score?.fulltime?.home??0;
      const ag=g.goals?.away??g.score?.fulltime?.away??0;
      if(hg>ag) hw++; else if(ag>hg) aw++;
    });
    const bias=(hw-aw)/ctx.h2h.slice(0,5).length;
    λH = Math.max(0.2, λH*(1+bias*0.08));
    λA = Math.max(0.2, λA*(1-bias*0.08));
  }

  // ── Bivariate Poisson matrix 0-7 ────────────────────────────────────────
  const MAX=7; let hW=0,dr=0,aW=0;
  const mat=[];
  for(let i=0;i<=MAX;i++){
    mat[i]=[];
    for(let j=0;j<=MAX;j++){
      const p=poisson(λH,i)*poisson(λA,j);
      mat[i][j]=p;
      if(i>j) hW+=p; else if(i===j) dr+=p; else aW+=p;
    }
  }
  const tot=hW+dr+aW; hW/=tot; dr/=tot; aW/=tot;

  // ── All market probabilities ─────────────────────────────────────────────
  let o15=0,o25=0,o35=0;
  for(let i=0;i<=MAX;i++) for(let j=0;j<=MAX;j++){
    const p=poisson(λH,i)*poisson(λA,j);
    if(i+j>1) o15+=p;
    if(i+j>2) o25+=p;
    if(i+j>3) o35+=p;
  }
  const btts  = (1-poisson(λH,0))*(1-poisson(λA,0));
  const pHO05 = 1-poisson(λH,0);
  const pAO05 = 1-poisson(λA,0);
  const pHO15 = 1-poisson(λH,0)-poisson(λH,1);
  const pAO15 = 1-poisson(λA,0)-poisson(λA,1);
  const dc1x  = hW+dr, dcx2=dr+aW, dc12=hW+aW;

  // Half-time markets (λ split ~50/50 per half)
  const λH2=λH/2, λA2=λA/2;
  let h1U15=0;
  for(let i=0;i<=1;i++) for(let j=0;j<=1;j++) h1U15+=poisson(λH2,i)*poisson(λA2,j);
  const pBothHalvesU15 = h1U15*h1U15;
  const p2HO05 = 1-poisson(λH2,0)*poisson(λA2,0);
  // Win either half
  let pH1W=0, pA1W=0;
  for(let i=1;i<=7;i++) for(let j=0;j<i;j++) pH1W+=poisson(λH2,i)*poisson(λA2,j);
  for(let i=1;i<=7;i++) for(let j=0;j<i;j++) pA1W+=poisson(λA2,i)*poisson(λH2,j);
  const pHWEH=Math.min(0.96, hW+pH1W*(1-hW)*0.5);
  const pAWEH=Math.min(0.96, aW+pA1W*(1-aW)*0.5);

  // Combo markets — REAL probabilities, not flat offsets
  // P(Home or GG) = P(Home) + P(GG) - P(Home AND GG)
  let pHomeAndGG=0, pAwayAndGG=0, pHomeAndO25=0, pAwayAndO25=0, pDrawAndO25=0;
  for(let i=0;i<=MAX;i++) for(let j=0;j<=MAX;j++){
    const p=poisson(λH,i)*poisson(λA,j);
    if(i>j&&i>0&&j>0) pHomeAndGG+=p;
    if(j>i&&i>0&&j>0) pAwayAndGG+=p;
    if(i>j&&i+j>2)    pHomeAndO25+=p;
    if(j>i&&i+j>2)    pAwayAndO25+=p;
    if(i===j&&i+j>2)  pDrawAndO25+=p;
  }
  const pHomeOrGG  = Math.min(0.97, hW+btts-pHomeAndGG);
  const pAwayOrGG  = Math.min(0.97, aW+btts-pAwayAndGG);
  const pHomeOrO25 = Math.min(0.97, hW+o25-pHomeAndO25);
  const pAwayOrO25 = Math.min(0.97, aW+o25-pAwayAndO25);
  const pDrawOrO25 = Math.min(0.97, dr+o25-pDrawAndO25);
  const pDCO15     = Math.min(0.97, dc1x*o15);

  // 1UP: at least one team leads by exactly 1 at some point
  const p1UP = Math.min(0.97, 1 - poisson(λH,0)*poisson(λA,0) - 0.05);
  const pH1UP= Math.min(0.95, hW*1.12+0.06);
  const pA1UP= Math.min(0.92, aW*1.12+0.05);

  // Corners estimated from shots
  const estCorn=Math.round((λH+λA)*3.0);
  const pCO85 = estCorn>8?0.55+Math.min(0.25,(estCorn-8)*0.08):0.35+estCorn*0.05;
  const pCO95 = estCorn>9?0.42+Math.min(0.20,(estCorn-9)*0.07):0.25+estCorn*0.04;

  // ── Bookmaker implied prices (with ~5% overround per market) ─────────────
  // Instead of flat random noise, each market has a real book margin
  const bk=(p,margin=0.05)=>Math.max(0.05,Math.min(0.95,p*(1-margin)));

  // ── Current match state for invalidating impossible markets ──────────────
  const cHS = ctx.score?.home ?? 0;
  const cAS = ctx.score?.away ?? 0;
  const cTot= cHS + cAS;
  const live = ctx.isLive || ctx.status==='HT';

  function mkInvalid(label) {
    // Markets that are already settled or impossible given the current score
    if (!live && ctx.status !== 'HT') return false;
    if (label==='Over 1.5' && cTot>=2) return true;   // already over
    if (label==='Over 2.5' && cTot>=3) return true;
    if (label==='Over 3.5' && cTot>=4) return true;
    if (label.includes('Under') && cTot>=2) return true; // most unders blown
    if (label==='Both Halves Under 1.5' && (cTot>=2||cHS>=2||cAS>=2)) return true;
    if (label==='GG (Both Score)' && cHS>=1&&cAS>=1) return true; // already happened
    if (label.includes('Over 0.5') && label.includes(homeName||'') && cHS>=1) return true;
    if (label.includes('Over 0.5') && label.includes(awayName||'') && cAS>=1) return true;
    return false;
  }

  // ── Build full market table ───────────────────────────────────────────────
  const allMkts = [
    // 1X2
    {cat:'1X2', label:`${homeName||'Home'} Win`, prob:hW, bkProb:bk(hW)},
    {cat:'1X2', label:'Draw',                    prob:dr, bkProb:bk(dr)},
    {cat:'1X2', label:`${awayName||'Away'} Win`, prob:aW, bkProb:bk(aW)},
    // Double Chance
    {cat:'DC', label:'DC Home/Draw (1X)', prob:dc1x, bkProb:bk(dc1x,0.04)},
    {cat:'DC', label:'DC Away/Draw (X2)', prob:dcx2, bkProb:bk(dcx2,0.04)},
    {cat:'DC', label:'DC Home/Away (12)', prob:dc12, bkProb:bk(dc12,0.04)},
    // Goals O/U
    {cat:'Goals', label:'Over 1.5', prob:o15, bkProb:bk(o15,0.05)},
    {cat:'Goals', label:'Over 2.5', prob:o25, bkProb:bk(o25,0.05)},
    {cat:'Goals', label:'Over 3.5', prob:o35, bkProb:bk(o35,0.06)},
    // BTTS
    {cat:'BTTS', label:'GG (Both Score)',     prob:btts,       bkProb:bk(btts,0.05)},
    {cat:'BTTS', label:'GG + Over 2.5',       prob:btts*o25,   bkProb:bk(btts*o25,0.07)},
    // Team Goals
    {cat:'Team', label:`${homeName||'Home'} Over 0.5`, prob:pHO05, bkProb:bk(pHO05,0.04)},
    {cat:'Team', label:`${homeName||'Home'} Over 1.5`, prob:pHO15, bkProb:bk(pHO15,0.05)},
    {cat:'Team', label:`${awayName||'Away'} Over 0.5`, prob:pAO05, bkProb:bk(pAO05,0.04)},
    {cat:'Team', label:`${awayName||'Away'} Over 1.5`, prob:pAO15, bkProb:bk(pAO15,0.05)},
    // Halves
    {cat:'Halves', label:'2nd Half Over 0.5',         prob:p2HO05,       bkProb:bk(p2HO05,0.04)},
    {cat:'Halves', label:'Both Halves Under 1.5: YES',prob:pBothHalvesU15,bkProb:bk(pBothHalvesU15,0.06)},
    {cat:'Halves', label:'Both Halves Under 1.5: NO', prob:1-pBothHalvesU15,bkProb:bk(1-pBothHalvesU15,0.06)},
    {cat:'Halves', label:`${homeName||'Home'} Win Either Half`,prob:pHWEH,bkProb:bk(pHWEH,0.05)},
    {cat:'Halves', label:`${awayName||'Away'} Win Either Half`,prob:pAWEH,bkProb:bk(pAWEH,0.06)},
    // Combo
    {cat:'Combo', label:'Home or GG',      prob:pHomeOrGG,  bkProb:bk(pHomeOrGG,0.06)},
    {cat:'Combo', label:'Away or GG',      prob:pAwayOrGG,  bkProb:bk(pAwayOrGG,0.06)},
    {cat:'Combo', label:'Draw or Over 2.5',prob:pDrawOrO25, bkProb:bk(pDrawOrO25,0.06)},
    {cat:'Combo', label:'Home or Over 2.5',prob:pHomeOrO25, bkProb:bk(pHomeOrO25,0.06)},
    {cat:'Combo', label:'Away or Over 2.5',prob:pAwayOrO25, bkProb:bk(pAwayOrO25,0.07)},
    {cat:'Combo', label:'DC + Over 1.5',   prob:pDCO15,     bkProb:bk(pDCO15,0.07)},
    // Corners
    {cat:'Corners', label:'Corners Over 8.5', prob:pCO85, bkProb:bk(pCO85,0.06)},
    {cat:'Corners', label:'Corners Over 9.5', prob:pCO95, bkProb:bk(pCO95,0.07)},
    // 1UP
    {cat:'1UP', label:'1UP (Any Team Leads)',          prob:p1UP,  bkProb:bk(p1UP,0.05)},
    {cat:'1UP', label:`${homeName||'Home'} 1UP`,       prob:pH1UP, bkProb:bk(pH1UP,0.05)},
    {cat:'1UP', label:`${awayName||'Away'} 1UP`,       prob:pA1UP, bkProb:bk(pA1UP,0.06)},
  ].map(m => ({
    ...m,
    edge: +(((m.prob - m.bkProb)*100)).toFixed(1),
    invalid: mkInvalid(m.label),
  }));

  // ── Best picks: top 3 valid markets by edge ───────────────────────────────
  const valid   = allMkts.filter(m => !m.invalid && m.edge > -5);
  const top3    = [...valid].sort((a,b)=>b.edge-a.edge).slice(0,3);
  const best    = top3[0] || allMkts[0];
  const edgeLbl = best.edge > 7 ? 'STRONG' : best.edge > 3 ? 'MEDIUM' : 'WEAK';

  // ── Reasons ──────────────────────────────────────────────────────────────
  const reasons = [];
  if (ctx.hxG) reasons.push(`Live xG data: ${homeName} ${parseFloat(ctx.hxG).toFixed(2)} vs ${awayName} ${parseFloat(ctx.axG).toFixed(2)}`);
  if (h&&a) {
    if (h.atk>85) reasons.push(`${h.name} elite attack (${h.atk})`);
    if (a.def<75)  reasons.push(`${a.name} leaky defence (${a.def} DEF)`);
    if (ff(h.form)>ff(a.form)+0.1) reasons.push(`${h.name} in superior form`);
    else if (ff(a.form)>ff(h.form)+0.1) reasons.push(`${a.name} in better form`);
    if (h.ha>1.14) reasons.push(`Strong home advantage for ${h.name}`);
  }
  if (λH>λA+0.4) reasons.push(`Model favours ${homeName}: λ ${λH.toFixed(2)} vs ${λA.toFixed(2)}`);
  else if (λA>λH+0.4) reasons.push(`Model favours ${awayName}: λ ${λA.toFixed(2)} vs ${λH.toFixed(2)}`);
  else reasons.push(`Closely matched: λ ${λH.toFixed(2)} vs ${λA.toFixed(2)}`);
  if (btts>0.55) reasons.push(`Both teams likely to score: ${(btts*100).toFixed(0)}%`);
  if (o25>0.60)  reasons.push(`High-scoring game likely: Over 2.5 at ${(o25*100).toFixed(0)}%`);
  if (ctx.h2h?.length) reasons.push(`H2H integrated: ${ctx.h2h.length} previous meetings`);
  top3.forEach(pk => {
    if (pk.edge>3) reasons.push(`✓ ${pk.label}: model edge +${pk.edge}%`);
  });

  const conf = Math.min(95, Math.round(
    50+Math.abs(λH-λA)*15+(h&&a?8:0)+(ctx.hxG?10:0)+(ctx.h2h?.length>3?5:0)
  ));

  return {
    hWin:+(hW*100).toFixed(1), draw:+(dr*100).toFixed(1), aWin:+(aW*100).toFixed(1),
    hxG:+λH.toFixed(2), axG:+λA.toFixed(2),
    btts:+(btts*100).toFixed(1), over25:+(o25*100).toFixed(1),
    over15:+(o15*100).toFixed(1), over35:+(o35*100).toFixed(1),
    markets: allMkts, top3,
    bestPick:{ label:best.label, edge:best.edge, prob:+(best.prob*100).toFixed(1) },
    conf, edgeLbl, reasons,
    λH, λA, scoreMatrix:mat,
    dc1x:+(dc1x*100).toFixed(1), dcx2:+(dcx2*100).toFixed(1),
  };
}


// ── RENDER LIVE LIST ──────────────────────────────────────────────────────────
function renderLiveList() {
  const el = document.getElementById('live-list');
  if (!el) return;
  el.innerHTML = LIVE_DATA.map(m => buildCard(m)).join('');
}

function buildCard(m) {
  const stCls  = m.status === 'LIVE' ? 'live' : m.status === 'HT' ? 'ht' : m.status === 'FT' ? 'ft' : 'upcoming';
  const minTxt = m.status === 'HT' ? 'HT' : m.status === 'FT' ? 'FT' : m.status === 'NS' ? m.kickoff : `${m.minute}'`;
  const scoreTxt = m.hasScore ? `${m.score.home} – ${m.score.away}` : 'vs';
  const scoreCls = m.hasScore ? '' : 'ns';
  const lastEvt  = m.events && m.events[0];
  const ecls     = m.edgeLbl === 'STRONG' ? 'has-edge' : '';

  return `
  <div class="mcard ${stCls} ${ecls}" onclick="openHub('${m.id}')">
    <div class="mc-top">
      <div class="mc-home">${m.home}</div>
      <div class="mc-score ${scoreCls}">${scoreTxt}</div>
      <div class="mc-away">${m.away}</div>
      <div class="mc-right">
        ${m.isLive ? '<span class="live-pill"><span class="live-dot"></span>LIVE</span>' : ''}
        <div class="status-tag ${stCls.toLowerCase()}">${minTxt}</div>
        <div class="mc-league">${m.league}</div>
      </div>
    </div>
    ${m.isLive ? `
    <div class="mom-wrap">
      <div class="mom-labels"><span>${m.home} ${Math.round(m.momentum.home)}%</span><span>MOMENTUM</span><span>${Math.round(100 - m.momentum.home)}% ${m.away}</span></div>
      <div class="mom-bar"><div class="mom-h" style="width:${m.momentum.home}%"></div><div class="mom-a"></div></div>
    </div>
    <div class="ngp-row">
      <span class="ngp-lbl">NEXT GOAL</span>
      <div class="ngp-bar"><div class="ngp-fill" style="width:${Math.round(m.momentum.home * 0.9)}%"></div></div>
      <span class="ngp-pct">${Math.round(m.momentum.home * 0.9)}% H</span>
    </div>` : ''}
    <div class="pred-strip">
      <div class="stat-chip">H ${m.hWin}%</div>
      <div class="stat-chip">D ${m.draw}%</div>
      <div class="stat-chip">A ${m.aWin}%</div>
      <div class="stat-chip">xG ${m.hxG}–${m.axG}</div>
      <div class="stat-chip">O2.5 ${m.over25}%</div>
      ${m.edgeLbl !== 'WEAK' ? `<div class="value-badge ${edgeClass(m.edgeLbl)}" style="padding:2px 7px;"><div class="value-dot"></div>${m.edgeLbl}</div>` : ''}
    </div>
    ${lastEvt ? `<div class="last-evt">${ICONS[lastEvt.type] || '•'} ${lastEvt.minute}' ${lastEvt.detail}</div>` : ''}
    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:6px;text-align:right">Tap for full analysis →</div>
  </div>`;
}

// ── RENDER FIXTURES ───────────────────────────────────────────────────────────
function renderFixtures() {
  const el = document.getElementById('fix-list');
  if (!el) return;
  const grouped = {};
  FIX_DATA.forEach(m => {
    if (!grouped[m.dayLabel]) grouped[m.dayLabel] = [];
    grouped[m.dayLabel].push(m);
  });
  el.innerHTML = Object.entries(grouped).map(([day, matches]) => `
    <div class="calendar-day">
      <div class="cal-day-header">
        <span class="cal-day-label">${day}</span>
        <span class="cal-day-count">${matches.length} MATCHES</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      ${matches.map(m => {
        const ec = m.edgeLbl === 'STRONG' ? 'has-edge' : m.edgeLbl === 'MEDIUM' ? 'medium-edge' : '';
        const hBest = m.hWin > m.draw && m.hWin > m.aWin;
        const dBest = m.draw > m.hWin && m.draw > m.aWin;
        const aBest = m.aWin > m.hWin && m.aWin > m.draw;
        return `<div class="fixture-row ${ec}" data-league="${m.league}" onclick="openHub('${m.id}','fix')">
          <div class="fr-time">${m.kickoff}</div>
          <div class="fr-teams">
            <div class="fr-home">${m.home}</div>
            <div class="fr-away">${m.away}</div>
            <div class="fr-league">${m.league}</div>
          </div>
          <div class="fr-probs">
            <span class="fr-p ${hBest?'best':''}">${m.hWin}%</span>
            <span class="fr-p ${dBest?'best':''}">${m.draw}%</span>
            <span class="fr-p ${aBest?'best':''}">${m.aWin}%</span>
          </div>
          ${m.edgeLbl !== 'WEAK' ? `<span class="fr-edge ${m.edgeLbl.toLowerCase()}">+${m.bestPick?.edge||''}%</span>` : '<span class="fr-arrow">›</span>'}
        </div>`;
      }).join('')}
    </div>`).join('');
}

function filterBy(league, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.fixture-row').forEach(row => {
    const lt = row.dataset.league || '';
    row.style.display = (league === 'ALL' || lt.includes(league)) ? '' : 'none';
  });
  document.querySelectorAll('.calendar-day').forEach(day => {
    const vis = [...day.querySelectorAll('.fixture-row')].some(r => r.style.display !== 'none');
    day.style.display = vis ? '' : 'none';
  });
}

// ── HUB ───────────────────────────────────────────────────────────────────────
function openHub(id, src) {
  const pool = src === 'fix' ? FIX_DATA : LIVE_DATA;
  ACTIVE = pool.find(m => String(m.id) === String(id));
  if (!ACTIVE) return;
  const mb = document.getElementById('mob-menu-btn');
  if (mb) mb.style.display = 'none';
  ACTIVE_TAB = src === 'fix' ? 'analysis' : 'match';
  document.getElementById('match-hub').style.display = 'flex';
  updateHubHeader();
  document.querySelectorAll('.hub-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('ht-' + ACTIVE_TAB).classList.add('active');

  // Run APEX prediction with full context (score, live state, real xG if available)
  const predCtx = {
    score: ACTIVE.score,
    isLive: ACTIVE.isLive,
    status: ACTIVE.status,
    hxG: ACTIVE.stats?.[ACTIVE.home]?.['expected_goals'] || null,
    axG: ACTIVE.stats?.[ACTIVE.away]?.['expected_goals'] || null,
    h2h: ACTIVE.h2hData || [],
  };
  Object.assign(ACTIVE, computePred(ACTIVE.home, ACTIVE.away, predCtx));

  renderHubTab(ACTIVE_TAB);
  // Fetch detail for all matches (live + FT + upcoming)
  if (!ACTIVE._detailFetched) fetchMatchDetail(ACTIVE.id);
}

async function fetchMatchDetail(id) {
  try {
    const [luRes, stRes, evRes, predRes, plRes] = await Promise.all([
      fetch(`/api/sports?type=football-lineups&id=${id}`),
      fetch(`/api/sports?type=football-stats&id=${id}`),
      fetch(`/api/sports?type=football-events&id=${id}`),
      fetch(`/api/sports?type=football-predictions&id=${id}`),
      fetch(`/api/sports?type=football-players&id=${id}`),
    ]);

    const [lu, st, ev, pred, pl] = await Promise.all([
      luRes.json(), stRes.json(), evRes.json(), predRes.json(), plRes.json()
    ]);

    if (lu.success && lu.data?.length > 0) ACTIVE.lineups = lu.data;

    if (st.success && st.data?.length > 0) {
      const statsMap = {};
      st.data.forEach(team => {
        const name = team.team?.name;
        if (!name) return;
        statsMap[name] = {};
        (team.statistics||[]).forEach(s => { statsMap[name][s.type] = s.value; });
      });
      ACTIVE.stats = statsMap;
    }

    if (ev.success && ev.data?.length > 0) {
      ACTIVE.events = ev.data.map(e => ({
        type:   e.type==='Goal'?'GOAL':e.type==='Card'?(e.detail?.includes('Red')?'RED':'YELLOW'):e.type==='subst'?'SUB':'EVENT',
        minute: e.time?.elapsed||0,
        extra:  e.time?.extra||null,
        player: e.player?.name||'',
        assist: e.assist?.name||'',
        team:   e.team?.name===ACTIVE.home?'home':'away',
        detail: e.type==='Goal'
          ? `${e.player?.name} scores!${e.time?.extra?' ('+e.time.elapsed+'+'+e.time.extra+"')":' ('+e.time?.elapsed+"')"} — ${e.detail}${e.assist?.name?' ⚡ '+e.assist.name:''}`
          : `${e.player?.name||''} — ${e.detail||e.type}`,
      })).sort((a,b) => b.minute-a.minute);
      ACTIVE.momentum.home = 50 + computeMomentum(ACTIVE.events, ACTIVE.home);
    }

    // Store real API predictions
    if (pred.success && pred.data) ACTIVE.apiPred = pred.data;

    // Store real player stats
    if (pl.success && pl.data?.length > 0) ACTIVE.playerStats = pl.data;

    // Re-run APEX with real xG data now that stats are loaded
    if (ACTIVE.stats) {
      const hS = ACTIVE.stats[ACTIVE.home] || {};
      const aS = ACTIVE.stats[ACTIVE.away] || {};
      Object.assign(ACTIVE, computePred(ACTIVE.home, ACTIVE.away, {
        score: ACTIVE.score, isLive: ACTIVE.isLive, status: ACTIVE.status,
        hxG: parseFloat(hS['expected_goals']||0)||null,
        axG: parseFloat(aS['expected_goals']||0)||null,
        hShots: parseInt(hS['Total Shots']||0)||null,
        aShots: parseInt(aS['Total Shots']||0)||null,
        hShotsOnT: parseInt(hS['Shots on Goal']||0)||null,
        aShotsOnT: parseInt(aS['Shots on Goal']||0)||null,
        h2h: ACTIVE.h2hData || [],
      }));
    }
    ACTIVE._detailFetched = true;
    renderHubTab(ACTIVE_TAB);
  } catch(e) { console.log('fetchMatchDetail error:', e); }
}

function computeMomentum(events, homeName) {
  // Score-based + recent events momentum
  let score = 0;
  events.forEach(e => {
    if (e.type==='GOAL') score += e.team==='home' ? 15 : -15;
    if (e.type==='RED')  score += e.team==='home' ? -12: 12;
  });
  return Math.max(-30, Math.min(30, score));
}

function closeHub() {
  document.getElementById('match-hub').style.display = 'none';
  if (PITCH_ANIM) { cancelAnimationFrame(PITCH_ANIM); PITCH_ANIM = null; }
  ACTIVE = null;
  // Restore hamburger menu
  const mb = document.getElementById('mob-menu-btn');
  if (mb) mb.style.display = '';
}

function hubTab(tab) {
  ACTIVE_TAB = tab;
  document.querySelectorAll('.hub-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('ht-' + tab).classList.add('active');
  if (PITCH_ANIM) { cancelAnimationFrame(PITCH_ANIM); PITCH_ANIM = null; }

}

function updateHubHeader() {
  const m = ACTIVE; if (!m) return;
  document.getElementById('hh-home').textContent  = m.home;
  document.getElementById('hh-away').textContent  = m.away;
  document.getElementById('hh-score').textContent = m.hasScore ? `${m.score.home} – ${m.score.away}` : 'vs';
  document.getElementById('hh-status').textContent =
    m.status === 'HT'   ? 'HALF TIME' :
    m.status === 'FT'   ? 'FULL TIME' :
    m.status === 'LIVE' ? `${m.minute}' LIVE` :
    m.kickoff ? `${m.dayLabel} · ${m.kickoff}` : m.dayLabel;
}

// ── H2H + MATRIX TABS ────────────────────────────────────────────────────────
async function renderH2HTab(m, body) {
  body.innerHTML = '<div style="padding:20px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-dim)"><div class="live-dot" style="display:inline-block;margin-right:6px"></div>Loading head-to-head...</div>';

  // Use stored IDs directly — no extra API calls needed
  try {
    // homeId & awayId come from transformFixture in sports.js
    const hId = m.homeId || null;
    const aId = m.awayId || null;
    const h2hUrl = hId && aId
      ? `/api/sports?type=football-h2h&h2h=${hId}-${aId}`
      : `/api/sports?type=football-h2h&home=${encodeURIComponent(m.home)}&away=${encodeURIComponent(m.away)}`;
    const h2hRes  = await fetch(h2hUrl);
    const h2hJson = await h2hRes.json();
    const matches  = h2hJson.data || [];
    if (!matches.length) {
      body.innerHTML = '<div class="empty-state">No head-to-head history found.</div>';
      return;
    }

    // Stats
    let hW=0,aW=0,dr=0,hG=0,aG=0;
    matches.forEach(f => {
      const g=f.goals||{};const s=f.score?.fulltime||{};
      const hg=g.home??s.home??0,ag=g.away??s.away??0;
      hG+=hg;aG+=ag;
      if(hg>ag)hW++;else if(hg<ag)aW++;else dr++;

    body.innerHTML = `
      <div class="section-header" style="margin-top:0">
        <div class="section-title" style="font-size:14px">Head to Head</div>
        <div class="section-meta">${matches.length} meetings</div>

          <div style="font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--neon)">${hW}</div>
          <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:2px">${m.home.split(' ').pop()}</div>
        </div>
        <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center">
          <div style="font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--yellow)">${dr}</div>
          <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:2px">DRAWS</div>
        </div>
        <div style="background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.25);border-radius:var(--radius);padding:10px;text-align:center">
          <div style="font-family:var(--font-mono);font-size:22px;font-weight:700;color:#a855f7">${aW}</div>
          <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:2px">${m.away.split(' ').pop()}</div>
        </div>
      </div>
      <div class="stat-chips" style="margin-bottom:14px">
        <div class="stat-chip">Avg goals <span style="color:var(--neon)">${((hG+aG)/matches.length).toFixed(1)}/game</span></div>
        <div class="stat-chip">${m.home} goals <span>${hG}</span></div>
        <div class="stat-chip">${m.away} goals <span>${aG}</span></div>
      </div>
      <div class="section-header"><div class="section-title" style="font-size:14px">Last ${Math.min(10,matches.length)} Meetings</div></div>
      <div id="_h2h_rows_"></div>`;
    // Now build rows safely
    let h2hRows='';
    matches.slice(0,10).forEach(f=>{
      const g=f.goals||{};const s=f.score?.fulltime||{};
      const hg=g.home??s.home??0,ag=g.away??s.away??0;
      const res=hg>ag?'H':hg<ag?'A':'D';
      const date=f.fixture?.date?new Date(f.fixture.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'}):'';
      h2hRows+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.03)">';
      h2hRows+='<span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);width:52px;flex-shrink:0">'+date+'</span>';
      h2hRows+='<span style="flex:1;font-family:var(--font-mono);font-size:10px">'+(f.teams?.home?.name||m.home)+'</span>';

  } catch(e) {

  }
}

    const allLines = [1, ...lines]; // GK + outfield lines

    let html = '<div style="background:#1a4417;border-radius:8px;padding:10px 8px;margin-bottom:8px">';

    html += '<div style="font-family:var(--font-mono);font-size:9px;font-weight:700;text-align:center;color:' + color + ';margin-bottom:8px">' + team.team + ' · ' + formation + '</div>';

// ── CANVAS PITCH ───────────────────────────────────────────────────────────────
function formationToPositions(formation) {
  // Returns normalized [x,y] positions for outfield players (0-1 range, GK at x=0.05)
  const lines = String(formation).split('-').map(Number);
  const positions = [{x:0.05, y:0.5}]; // GK
  let xStep = 0.85 / (lines.length + 1);
  lines.forEach((count, lineIdx) => {
    const x = 0.05 + xStep * (lineIdx + 1);
    for (let i = 0; i < count; i++) {
      const y = (i + 1) / (count + 1);
      positions.push({x, y});
    }
  });
  return positions;
}

function initPitch(m, hFormation='4-3-3', aFormation='4-3-3', homePoss=50) {
  const canvas = document.getElementById('pitch-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W   = canvas.offsetWidth || 320;
  const H   = Math.round(W * 0.62);
  canvas.width = W; canvas.height = H;
  const PAD = 16, PW = W - PAD*2, PH = H - PAD*2;

  // Build player positions from formations
  const hPositions = formationToPositions(hFormation);
  const aPositions = formationToPositions(aFormation);

  // Home: attack right (left side of pitch), Away: attack left (right side)
  const homePts = hPositions.map((p,i) => {
    const bx = PAD + p.x * PW;
    const by = PAD + p.y * PH;
    const lineup = m.lineups?.[0]?.players?.[i];
    return { x: bx, y: by, bx, by, n: lineup?.number||i+1, name: lineup?.name?.split(' ').pop()||'' };
  });
  const awayPts = aPositions.map((p,i) => {
    const bx = PAD + (1 - p.x) * PW;
    const by = PAD + p.y * PH;
    const lineup = m.lineups?.[1]?.players?.[i];
    return { x: bx, y: by, bx, by, n: lineup?.number||i+1, name: lineup?.name?.split(' ').pop()||'' };
  });

  let bx = W/2, by = H/2, btx = W/2, bty = H/2;
  let ptick = 0;
  // Ball ownership bias based on possession
  const homeBias = (homePoss || 50) / 100;

  const drawPitch = () => {
    // Grass stripes
    ctx.fillStyle = '#1a4a17';
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 8; i++) {
      ctx.fillStyle = i%2===0 ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.03)';
      ctx.fillRect(i*(W/8), 0, W/8, H);
    }
    // Lines
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(PAD, PAD, PW, PH);
    // Centre line
    ctx.beginPath(); ctx.moveTo(W/2, PAD); ctx.lineTo(W/2, H-PAD); ctx.stroke();
    // Centre circle
    ctx.beginPath(); ctx.arc(W/2, H/2, PH*0.14, 0, Math.PI*2); ctx.stroke();
    // Centre spot
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(W/2, H/2, 2.5, 0, Math.PI*2); ctx.fill();
    // Penalty areas
    const paw = PW*0.14, pah = PH*0.44;
    ctx.strokeRect(PAD, H/2-pah/2, paw, pah);
    ctx.strokeRect(W-PAD-paw, H/2-pah/2, paw, pah);
    // Goal boxes
    const gbw = PW*0.05, gbh = PH*0.22;
    ctx.strokeRect(PAD, H/2-gbh/2, gbw, gbh);
    ctx.strokeRect(W-PAD-gbw, H/2-gbh/2, gbw, gbh);
    // Goals
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
    ctx.strokeRect(PAD-7, H/2-PH*0.095, 7, PH*0.19);
    ctx.strokeRect(W-PAD, H/2-PH*0.095, 7, PH*0.19);
    // Penalty spots
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(PAD+PW*0.11, H/2, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W-PAD-PW*0.11, H/2, 2, 0, Math.PI*2); ctx.fill();
  };

  const drawPlayers = (pts, col, glow, showNames) => {
    pts.forEach(p => {
      // Drift naturally
      p.x += (p.bx - p.x) * 0.05 + (Math.random()-0.5) * 1.2;
      p.y += (p.by - p.y) * 0.05 + (Math.random()-0.5) * 1.2;
      // Shadow
      ctx.shadowColor = glow; ctx.shadowBlur = 12;
      // Player circle
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      // Number
      ctx.fillStyle = 'rgba(0,0,0,0.9)';
      ctx.font = 'bold 7px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.n, p.x, p.y);
    });
  };

  const frame = () => {
    drawPitch();

    // Ball movement
    bx += (btx - bx) * 0.12;
    by += (bty - by) * 0.12;
    ptick--;
    if (ptick <= 0) {
      // Choose next target based on possession bias
      const pool = Math.random() < homeBias ? homePts : awayPts;
      const target = pool[Math.floor(Math.random() * pool.length)];
      // Occasional long ball vs short pass
      const range = Math.random() < 0.3 ? 40 : 15;
      btx = target.x + (Math.random()-0.5) * range;
      bty = target.y + (Math.random()-0.5) * range;
      ptick = 25 + Math.random()*40|0;
    }

    drawPlayers(homePts, '#00ff9d', '#00ff9d');
    drawPlayers(awayPts, '#a855f7', '#a855f7');

    // Ball with glow
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    PITCH_ANIM = requestAnimationFrame(frame);
  };
  frame();
}

function changeDay(delta) {
  DATE_OFFSET += delta;
  const d = new Date();
  d.setDate(d.getDate() + DATE_OFFSET);
  const dayStr = DATE_OFFSET === 0 ? 'TODAY'
    : DATE_OFFSET === -1 ? 'YESTERDAY'
    : DATE_OFFSET === 1  ? 'TOMORROW'
    : d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}).toUpperCase();
  document.getElementById('date-display').textContent = dayStr;
  // Reload data for new date
  LIVE_DATA = []; FIX_DATA = [];
  const activeTab = document.querySelector('.tab-btn.active')?.id?.replace('tb-','') || 'live';
  if (activeTab === 'live' || activeTab === 'fixtures') {
    loadLiveForDate(); 
  }
}

function getDateStr(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().split('T')[0];
}

    if (btn) btn.className = 'tab-btn' + (
      (t === 'live'      && tab === 'live')      ||
      (t === 'fixtures'  && tab === 'fixtures')  ||
      (t === 'standings' && tab === 'standings') ||
      (t === 'players'   && tab === 'topscorers')
      ? ' active' : '');
  });

  if (tab==='fixtures')  { if (!FIX_DATA.length) loadFixtures(); else renderFixtures(); }
  else if (tab==='live') { if (!LIVE_DATA.length) loadLive(); }
  else if (tab==='standings')   loadStandings(STANDINGS_LEAGUE);
  else if (tab==='topscorers')  loadScorers(SCORERS_LEAGUE);
}

// ── Standings ─────────────────────────────────────────────────────────────────
let STANDINGS_LEAGUE = 39;
let SCORERS_LEAGUE   = 39;
let SCORERS_VIEW     = 'scorers';
const STANDINGS_CACHE = {};

function selectStandingsLeague(id, name, btn) {
  STANDINGS_LEAGUE = id;
  btn.closest('.league-select')?.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b===btn));
  loadStandings(id, name);
}

function selectScorersLeague(id, btn) {
  SCORERS_LEAGUE = id;
  btn.closest('.league-select')?.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b===btn));
  loadScorers(id);
}

function switchScorersView(view, btn) {
  SCORERS_VIEW = view;
  document.getElementById('ts-scorers').classList.toggle('active', view==='scorers');
  document.getElementById('ts-assists').classList.toggle('active', view==='assists');
  loadScorers(SCORERS_LEAGUE);
}

async function loadStandings(leagueId) {
  if (!leagueId) leagueId = 39;
  const key = 'std_' + leagueId;
  if (STANDINGS_CACHE[key]) { renderStandings(STANDINGS_CACHE[key]); return; }

  const dot = document.getElementById('std-dot');
  const txt = document.getElementById('std-txt');
  const con = document.getElementById('standings-content');
  if (txt) txt.innerHTML = 'Loading standings...';
  if (con) showLoading('standings-content');

  // Try 2025 first, fall back to 2024
  let data = null;
  for (const season of [2025, 2024]) {
    try {
      const res  = await fetch('/api/sports?type=football-standings&league=' + leagueId + '&season=' + season);
      const json = await res.json();
      if (json.success && json.data?.length > 0) {
        data = { rows: json.data, season };
        break;
      }
    } catch {}
  }

  if (!data) {
    if (con) con.innerHTML = '<div class="empty-state">Standings not available for this league right now.</div>';
    if (txt) txt.innerHTML = 'No standings available';
    return;
  }

  STANDINGS_CACHE[key] = data;
  renderStandings(data);
  if (dot) dot.className = 'oab-dot live';
  if (txt) txt.innerHTML = 'Live standings · ' + data.season + '/' + (data.season+1) + ' season';
}

function renderStandings(data) {
  const con = document.getElementById('standings-content');
  if (!con) return;
  const rows = data.rows.map(t => {
    const form = (t.form||'').split('').slice(-5);
    const formHtml = form.map(r =>
      r==='W'?'<span style="background:#00ff9d;color:#07090d;padding:1px 4px;border-radius:2px;font-size:8px;font-weight:800">W</span>':
      r==='D'?'<span style="background:#f5c842;color:#07090d;padding:1px 4px;border-radius:2px;font-size:8px;font-weight:800">D</span>':
      r==='L'?'<span style="background:#ff2d55;color:#fff;padding:1px 4px;border-radius:2px;font-size:8px;font-weight:800">L</span>':''
    ).join('');
    const rank = t.rank;
    const desc = t.description||'';
    const zoneColor = rank<=4?'var(--neon)':rank===5?'var(--neon2)':rank>=18?'var(--red)':'var(--text-dim)';
    const icon = desc.includes('Champions')?'🏆':desc.includes('Europa')?'🔵':desc.includes('Relegat')?'↓':'';
    return '<tr style="border-bottom:1px solid rgba(255,255,255,0.03)">' +
      '<td style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:'+zoneColor+';padding:7px 4px;text-align:center">'+rank+'</td>' +
      '<td style="font-weight:700;font-size:11px;padding:7px 4px">'+(t.team?.name||'—')+' '+icon+'</td>' +
      '<td style="font-family:var(--font-mono);font-size:11px;font-weight:700;padding:7px 4px;text-align:center;color:var(--neon)">'+(t.points||0)+'</td>' +
      '<td style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);padding:7px 4px;text-align:center">'+(t.all?.played||0)+'</td>' +
      '<td style="font-family:var(--font-mono);font-size:10px;color:var(--neon);padding:7px 4px;text-align:center">'+(t.all?.win||0)+'</td>' +
      '<td style="font-family:var(--font-mono);font-size:10px;color:var(--yellow);padding:7px 4px;text-align:center">'+(t.all?.draw||0)+'</td>' +
      '<td style="font-family:var(--font-mono);font-size:10px;color:var(--red);padding:7px 4px;text-align:center">'+(t.all?.lose||0)+'</td>' +
      '<td style="font-family:var(--font-mono);font-size:10px;color:'+(t.goalsDiff>=0?'var(--neon)':'var(--red)')+';padding:7px 4px;text-align:center">'+(t.goalsDiff>=0?'+':'')+t.goalsDiff+'</td>' +
      '<td style="padding:7px 4px"><div style="display:flex;gap:2px">' + formHtml + '</div></td>' +
    '</tr>';
  }).join('');

  con.innerHTML = '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">' +
    '<table style="width:100%;border-collapse:collapse;min-width:320px">' +
    '<thead><tr style="border-bottom:1px solid var(--border)">' +
    '<th style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);padding:6px 4px;text-align:center">#</th>' +
    '<th style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);padding:6px 4px;text-align:left">TEAM</th>' +
    '<th style="font-family:var(--font-mono);font-size:8px;color:var(--neon);padding:6px 4px;text-align:center">PTS</th>' +
    '<th style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);padding:6px 4px;text-align:center">P</th>' +
    '<th style="font-family:var(--font-mono);font-size:8px;color:var(--neon);padding:6px 4px;text-align:center">W</th>' +
    '<th style="font-family:var(--font-mono);font-size:8px;color:var(--yellow);padding:6px 4px;text-align:center">D</th>' +
    '<th style="font-family:var(--font-mono);font-size:8px;color:var(--red);padding:6px 4px;text-align:center">L</th>' +
    '<th style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);padding:6px 4px;text-align:center">GD</th>' +
    '<th style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);padding:6px 4px">FORM</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-family:var(--font-mono);font-size:9px">' +
    '<span><span style="color:var(--neon)">■</span> Champions League</span>' +
    '<span><span style="color:var(--neon2)">■</span> Europa League</span>' +
    '<span><span style="color:var(--red)">■</span> Relegation</span>' +
    '</div>';
}

async function loadScorers(leagueId) {
  if (!leagueId) leagueId = 39;
  const con = document.getElementById('scorers-content');
  if (con) showLoading('scorers-content');
  const type = SCORERS_VIEW === 'scorers' ? 'football-topscorers' : 'football-topassists';
  try {
    let data = null;
    for (const season of [2025, 2024]) {
      const res  = await fetch('/api/sports?type='+type+'&league='+leagueId+'&season='+season);
      const json = await res.json();
      if (json.success && json.data?.length > 0) { data = json.data; break; }
    }
    if (!data) throw new Error('No data available');
    con.innerHTML = data.map((item,i) => {
      const p = item.player;
      const s = item.statistics?.[0]||{};
      const stat = SCORERS_VIEW==='scorers' ? (s.goals?.total||0) : (s.goals?.assists||0);
      const apps = s.games?.appearences||0;
      return '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)">' +
        '<span style="font-family:var(--font-mono);font-size:11px;font-weight:700;width:24px;flex-shrink:0;color:'+(i<3?'var(--neon)':'var(--text-dim)')+'">'+( i+1)+'</span>' +
        '<img src="'+(p?.photo||'')+'" style="width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--bg4);flex-shrink:0" alt=""/>' +
        '<div style="flex:1"><div style="font-weight:700;font-size:12px">'+(p?.name||'—')+'</div>' +
        '<div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:2px">'+(s.team?.name||'')+'  ·  '+apps+' apps</div></div>' +
        '<div style="text-align:right;flex-shrink:0"><div style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:'+(i<3?'var(--neon)':'var(--text)')+'">'+stat+'</div>' +
        '<div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim)">'+(SCORERS_VIEW==='scorers'?'goals':'assists')+'</div></div>' +
      '</div>';
    }).join('');
  } catch(e) {
    if (con) con.innerHTML = '<div class="empty-state">'+e.message+'</div>';
  }
}

// ── BANNER ────────────────────────────────────────────────────────────────────
function setBanner(mode, txt) {
  const b = document.getElementById('live-banner');
  const d = document.getElementById('banner-dot');
  const t = document.getElementById('banner-txt');
  if (!b) return;
  b.className = mode === 'live' ? 'odds-api-banner live' : 'odds-api-banner sim';
  if (d) d.className = 'oab-dot ' + (mode === 'live' ? 'live' : 'sim');
  if (t) t.innerHTML = txt;
}

// ── REFRESH + AUTO ────────────────────────────────────────────────────────────
function loadLiveForDate() { loadLive(); }
function refresh() {
  LIVE_DATA = []; FIX_DATA = [];
  const activeTab = document.querySelector('.tab-btn.active')?.id?.replace('tb-','') || 'live';
  if (activeTab === 'fixtures') loadFixtures();
  else loadLive();
}

function startRefBar() {
  setInterval(() => {
    REF_TIMER--;
    const bar = document.getElementById('ref-prog');
    if (bar) bar.style.width = (REF_TIMER / 30 * 100) + '%';
    if (REF_TIMER <= 0) {
      REF_TIMER = 30;
      if (document.getElementById('pnl-live').style.display !== 'none') loadLive();
    }
  }, 1000);
}
</script>
