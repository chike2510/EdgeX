<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Football — EdgeX</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .tab-row{display:flex;gap:6px;margin-bottom:14px;}
    .tab-btn{flex:1;padding:10px 0;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:1.5px;border-radius:var(--radius);cursor:pointer;transition:var(--transition);border:1px solid var(--border);background:var(--bg2);color:var(--text-muted);}
    .tab-btn.active{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#07090d;border-color:transparent;}
    /* Match card */
    .mcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:10px;cursor:pointer;transition:var(--transition);}
    .mcard:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-1px);}
    .mcard.live{border-left:3px solid var(--neon);}
    .mcard.ht{border-left:3px solid var(--yellow);}
    .mcard.ft{border-left:3px solid var(--text-dim);}
    .mcard.upcoming{border-left:3px solid var(--neon2);}
    .mc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .mc-home{font-weight:800;font-size:14px;flex:1;}
    .mc-score{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--neon);min-width:60px;text-align:center;flex-shrink:0;}
    .mc-score.ns{color:var(--text-dim);font-size:16px;}
    .mc-away{font-weight:800;font-size:14px;flex:1;text-align:right;}
    .mc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
    .live-pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:9px;color:var(--neon);background:var(--neon-dim);border:1px solid rgba(0,255,157,0.3);padding:2px 7px;border-radius:3px;letter-spacing:1px;}
    .live-dot{width:5px;height:5px;border-radius:50%;background:var(--neon);animation:ndot 1s ease-in-out infinite;}
    .status-tag{font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:3px;border:1px solid;}
    .status-tag.live{color:var(--yellow);background:rgba(245,200,66,0.08);border-color:rgba(245,200,66,0.2);}
    .status-tag.ht{color:var(--text-dim);background:var(--bg4);border-color:var(--border);}
    .status-tag.ft{color:var(--red);background:rgba(255,45,85,0.06);border-color:rgba(255,45,85,0.2);}
    .status-tag.ns{color:var(--neon2);background:rgba(0,201,255,0.06);border-color:rgba(0,201,255,0.2);}
    .mc-league{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:1px;}
    .mom-wrap{margin:8px 0 4px;}
    .mom-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-bottom:3px;}
    .mom-bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;display:flex;}
    .mom-h{background:linear-gradient(90deg,var(--neon),var(--neon2));transition:width 0.8s ease;}
    .mom-a{background:linear-gradient(90deg,#a855f7,#7b5cff);flex:1;}
    .ngp-row{display:flex;align-items:center;gap:8px;}
    .ngp-lbl{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);width:68px;flex-shrink:0;}
    .ngp-bar{flex:1;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
    .ngp-fill{height:100%;background:linear-gradient(90deg,var(--neon),var(--neon2));transition:width 0.6s ease;}
    .ngp-pct{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--neon);width:32px;text-align:right;flex-shrink:0;}
    .last-evt{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;align-items:center;gap:5px;}
    .pred-strip{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
    /* Hub */
    .hub{position:fixed;inset:0;background:var(--bg);z-index:600;display:flex;flex-direction:column;overflow:hidden;}
    .hub-hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 14px;flex-shrink:0;}
    .hub-back{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);cursor:pointer;background:var(--bg3);border:1px solid var(--border);padding:5px 10px;border-radius:var(--radius);margin-bottom:10px;display:inline-flex;align-items:center;gap:5px;}
    .hub-score-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .hub-team{font-weight:800;font-size:15px;}
    .hub-team.r{text-align:right;}
    .hub-num{font-family:var(--font-mono);font-size:32px;font-weight:700;color:var(--neon);line-height:1;}
    .hub-min{font-family:var(--font-mono);font-size:10px;color:var(--yellow);margin-top:3px;text-align:center;}
    .hub-tabs{display:flex;gap:4px;margin-top:10px;}
    .hub-tab{flex:1;padding:6px 0;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:1px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text-muted);transition:var(--transition);}
    .hub-tab.active{background:var(--neon-dim);color:var(--neon);border-color:rgba(0,255,157,0.3);}
    .hub-body{flex:1;overflow-y:auto;padding:14px;}
    /* Timeline */
    .tl-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
    .tl-min{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);width:30px;flex-shrink:0;}
    .tl-ico{font-size:14px;width:20px;text-align:center;flex-shrink:0;}
    .tl-txt{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);flex:1;line-height:1.5;}
    .tl-txt strong{color:var(--text);}
    /* Stats compare */
    .sc-row{display:flex;align-items:center;gap:8px;margin:5px 0;}
    .sc-h{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--neon);width:28px;text-align:right;}
    .sc-a{font-family:var(--font-mono);font-size:10px;font-weight:700;color:#a855f7;width:28px;}
    .sc-bar{flex:1;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;display:flex;}
    .sc-bh{height:100%;background:var(--neon);transition:width 0.8s ease;}
    .sc-ba{height:100%;background:#a855f7;transition:width 0.8s ease;}
    .sc-lbl{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);text-align:center;margin:-2px 0 6px;}
    /* Pitch */
    .pitch-wrap{background:#1e4d1a;border-radius:var(--radius);overflow:hidden;position:relative;margin:10px 0;}
    #pitch-canvas{width:100%;display:block;}
    .pitch-legend{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;}
    .plbl{font-family:var(--font-mono);font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;}
    .plbl.h{background:rgba(0,255,157,0.2);color:var(--neon);}
    .plbl.a{background:rgba(168,85,247,0.2);color:#a855f7;}
    /* Lineup */
    .lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
    .lineup-col{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px;}
    .lineup-title{font-family:var(--font-mono);font-size:9px;letter-spacing:1px;margin-bottom:8px;}
    .lineup-title.h{color:var(--neon);}
    .lineup-title.a{color:#a855f7;}
    .player-row{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
    .player-num{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);width:18px;flex-shrink:0;text-align:right;}
    .player-name{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);flex:1;}
    .player-pos{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);background:var(--bg4);padding:1px 4px;border-radius:2px;}
    /* Refresh bar */
    .ref-bar{height:2px;background:var(--border);position:fixed;top:0;left:0;right:0;z-index:999;}
    .ref-prog{height:100%;background:var(--neon);transition:width 1s linear;}
  </style>
</head>
<body>
<div class="ref-bar"><div class="ref-prog" id="ref-prog" style="width:100%"></div></div>
<nav id="side-nav"></nav>

<div id="page-wrap">
  <header id="page-header">
    <div class="page-title">
      <span class="page-title-icon">⚽</span>FOOTBALL
      <span class="page-subtitle">LIVE · PREDICTIONS · ANALYSIS</span>
    </div>
    <div class="bankroll-wrap">
      <span class="br-currency">$</span>
      <input class="br-input" id="br-input" type="number" min="1" step="100" value="1000"/>
    </div>
    <button id="refresh-btn" onclick="refresh()">⟳</button>
  </header>

  <main id="page-main">
    <div class="tab-row">
      <button class="tab-btn active" id="tb-live"     onclick="showTab('live')">🔴 LIVE</button>
      <button class="tab-btn"        id="tb-fixtures" onclick="showTab('fixtures')">📅 FIXTURES</button>
    </div>

    <!-- Live -->
    <div id="pnl-live">
      <div id="live-banner" class="odds-api-banner sim" style="margin-bottom:12px;">
        <div class="oab-dot sim" id="banner-dot"></div>
        <div class="oab-text" id="banner-txt">Loading matches...</div>
      </div>
      <div id="live-list"></div>
    </div>

    <!-- Fixtures -->
    <div id="pnl-fixtures" style="display:none">
      <div class="toolbar" style="margin-bottom:12px;">
        <div class="toolbar-left">
          <span class="tool-label">LEAGUE</span>
          <button class="filter-btn active" onclick="filterBy('ALL',this)">ALL</button>
          <button class="filter-btn" onclick="filterBy('Premier',this)">EPL</button>
          <button class="filter-btn" onclick="filterBy('Champions',this)">UCL</button>
          <button class="filter-btn" onclick="filterBy('La Liga',this)">LA LIGA</button>
          <button class="filter-btn" onclick="filterBy('Bundesliga',this)">BUND</button>
          <button class="filter-btn" onclick="filterBy('Serie A',this)">SERIE A</button>
        </div>
      </div>
      <div id="fix-list"></div>
    </div>
  </main>
</div>

<!-- Hub overlay -->
<div id="match-hub" class="hub" style="display:none">
  <div class="hub-hdr">
    <div class="hub-back" onclick="closeHub()">← BACK</div>
    <div class="hub-score-row">
      <div class="hub-team" id="hh-home">—</div>
      <div style="text-align:center">
        <div class="hub-num" id="hh-score">— : —</div>
        <div class="hub-min" id="hh-status">—</div>
      </div>
      <div class="hub-team r" id="hh-away">—</div>
    </div>
    <div class="hub-tabs">
      <button class="hub-tab active" id="ht-match"    onclick="hubTab('match')">MATCH</button>
      <button class="hub-tab"        id="ht-lineup"   onclick="hubTab('lineup')">LINEUP</button>
      <button class="hub-tab"        id="ht-pitch"    onclick="hubTab('pitch')">PITCH</button>
      <button class="hub-tab"        id="ht-analysis" onclick="hubTab('analysis')">EDGE</button>
    </div>
  </div>
  <div class="hub-body" id="hub-body"></div>
</div>

<div id="ticker-bar"></div>
<script src="common.js"></script>
<script>
'use strict';

const ICONS = {GOAL:'⚽',YELLOW:'🟨',RED:'🟥',subst:'🔄',VAR:'📺',CHANCE:'🎯',CORNER:'🚩',FOUL:'⚠️'};

// ── STATE ─────────────────────────────────────────────────────────────────────
let LIVE_DATA    = [];   // live/today matches from API
let FIX_DATA     = [];   // fixtures from API
let ACTIVE       = null; // match open in hub
let ACTIVE_TAB   = 'match';
let PITCH_ANIM   = null;
let REF_TIMER    = 30;

// ── TEAMS DB for predictions ──────────────────────────────────────────────────
const TEAMS_DB = [
  {name:'Manchester City',   atk:91,def:87,form:[3,3,1,3,3],ha:1.18},
  {name:'Arsenal',           atk:88,def:85,form:[3,3,3,1,3],ha:1.15},
  {name:'Liverpool',         atk:90,def:82,form:[3,1,3,3,1],ha:1.20},
  {name:'Manchester United', atk:74,def:70,form:[0,1,3,0,1],ha:1.10},
  {name:'Chelsea',           atk:81,def:78,form:[1,0,3,1,3],ha:1.10},
  {name:'Tottenham',         atk:79,def:74,form:[3,1,1,0,3],ha:1.08},
  {name:'Newcastle',         atk:77,def:80,form:[3,3,1,0,1],ha:1.12},
  {name:'Aston Villa',       atk:80,def:76,form:[3,3,1,3,0],ha:1.09},
  {name:'Brighton',          atk:75,def:72,form:[1,1,3,1,3],ha:1.06},
  {name:'West Ham',          atk:70,def:68,form:[0,1,3,1,0],ha:1.05},
  {name:'Real Madrid',       atk:94,def:88,form:[3,3,3,1,3],ha:1.22},
  {name:'Barcelona',         atk:92,def:84,form:[3,3,1,3,3],ha:1.20},
  {name:'Atletico Madrid',   atk:79,def:88,form:[3,1,3,3,0],ha:1.15},
  {name:'Villarreal',        atk:75,def:74,form:[1,3,0,3,1],ha:1.08},
  {name:'Bayern Munich',     atk:93,def:86,form:[3,3,3,3,1],ha:1.21},
  {name:'Borussia Dortmund', atk:83,def:75,form:[1,3,3,1,3],ha:1.14},
  {name:'Bayer Leverkusen',  atk:86,def:80,form:[3,3,3,1,3],ha:1.16},
  {name:'RB Leipzig',        atk:81,def:78,form:[3,1,3,3,1],ha:1.12},
  {name:'Inter Milan',       atk:85,def:86,form:[3,1,3,3,1],ha:1.16},
  {name:'AC Milan',          atk:82,def:80,form:[3,3,0,1,3],ha:1.14},
  {name:'Juventus',          atk:78,def:82,form:[1,1,3,3,3],ha:1.10},
  {name:'Napoli',            atk:80,def:78,form:[3,3,1,3,0],ha:1.13},
  {name:'AS Roma',           atk:77,def:74,form:[1,3,3,0,1],ha:1.09},
  {name:'PSG',               atk:89,def:83,form:[3,3,1,3,3],ha:1.18},
  {name:'Porto',             atk:76,def:79,form:[3,3,1,1,3],ha:1.12},
  {name:'Benfica',           atk:79,def:77,form:[3,1,3,3,1],ha:1.13},
  {name:'Celtic',            atk:74,def:70,form:[3,3,3,1,3],ha:1.15},
  {name:'Rangers',           atk:70,def:68,form:[1,3,1,3,0],ha:1.11},
  {name:'Ajax',              atk:80,def:74,form:[3,3,1,3,0],ha:1.14},
  {name:'PSV',               atk:82,def:76,form:[3,3,3,1,1],ha:1.15},
];

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('br-input');
  if (inp) { inp.value = getBankroll(); inp.addEventListener('change', e => setBankroll(e.target.value)); }
  loadLive();
  startRefBar();
});

// ── LOAD LIVE ─────────────────────────────────────────────────────────────────
async function loadLive() {
  setBanner('loading', 'Fetching matches...');
  showLoading('live-list');
  try {
    const res  = await fetch('/api/sports?type=football-live');
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'No data');

    LIVE_DATA = json.data.map(parseMatch).filter(Boolean);
    if (LIVE_DATA.length === 0) throw new Error('No matches returned');

    // Attach predictions to each match
    LIVE_DATA.forEach(m => { Object.assign(m, computePred(m.home, m.away)); });

    // Try to get live odds
    try {
      const oddsRes  = await fetch('/api/sports?type=football-odds');
      const oddsJson = await oddsRes.json();
      if (oddsJson.success) attachOdds(oddsJson.data);
    } catch {}

    renderLiveList();
    const liveCount = LIVE_DATA.filter(m => m.isLive).length;
    const src = json.source;
    setBanner('live', src === 'live'
      ? `<strong>${liveCount} LIVE NOW</strong> · ${LIVE_DATA.length} total · AllSportsAPI`
      : src === 'today'
      ? `${LIVE_DATA.length} matches today · AllSportsAPI`
      : `${LIVE_DATA.length} upcoming matches · AllSportsAPI`
    );
  } catch (e) {
    document.getElementById('live-list').innerHTML = `
      <div class="empty-state">
        <strong>No matches found</strong><br>
        ${e.message}<br><br>
        Try the Fixtures tab for upcoming games.
      </div>`;
    setBanner('sim', 'No live matches right now');
  }
}

// ── LOAD FIXTURES ─────────────────────────────────────────────────────────────
async function loadFixtures() {
  showLoading('fix-list');
  try {
    const res  = await fetch('/api/sports?type=football-fixtures');
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'No fixtures');

    FIX_DATA = json.data.map(parseMatch).filter(Boolean);
    FIX_DATA.forEach(m => { Object.assign(m, computePred(m.home, m.away)); });
    renderFixtures();
  } catch (e) {
    document.getElementById('fix-list').innerHTML = `<div class="empty-state"><strong>No fixtures found</strong><br>${e.message}</div>`;
  }
}

// ── PARSE MATCH ───────────────────────────────────────────────────────────────
// ── PARSE MATCH ───────────────────────────────────────────────────────────────
// api/sports.js already transforms API-Football to EdgeX format.
// Just validate and add momentum.
function parseMatch(e) {
  if (!e.home || !e.away) return null;
  return {
    ...e,
    stats:    null,
    lineups:  null,
    momentum: { home: 50 + (e.isLive ? ((e.score?.home||0) - (e.score?.away||0)) * 8 : 0) },
  };
}


function parseStats(raw) {
  if (!Array.isArray(raw) || raw.length === 0) return null;
  const stats = {};
  raw.forEach(team => {
    const name = team.team_name || team.team?.name;
    if (!name) return;
    stats[name] = {};
    (team.statistics || team.stats || []).forEach(s => {
      stats[name][s.type] = s.value;
    });
  });
  return Object.keys(stats).length > 0 ? stats : null;
}

function parseLineups(raw) {
  if (!Array.isArray(raw) || raw.length === 0) return null;
  return raw.map(team => ({
    team:      team.team_name || team.team?.name || '',
    formation: team.lineup_formation || team.formation || '',
    players:   (team.lineup_players || team.startXI || []).map(p => ({
      name:   p.player_name || p.player?.name || p.name || '',
      number: p.player_number || p.number || '',
      pos:    p.player_position || p.pos || '',
    })),
    subs: (team.lineup_substitutes || team.substitutes || []).map(p => ({
      name:   p.player_name || p.player?.name || '',
      number: p.player_number || '',
    })),
  }));
}

function attachOdds(oddsData) {
  if (!Array.isArray(oddsData)) return;
  oddsData.forEach(o => {
    const m = LIVE_DATA.find(x => String(x.id) === String(o.id || o.event_key));
    if (!m || !Array.isArray(o.odds)) return;
    const main = o.odds.find(x => x.odd_name === 'Match Result' || x.odd_id === '1' || x.odd_name === '1X2') || o.odds[0];
    if (main) {
      m.odds = {
        home: parseFloat(main.odd_1 || main.odd_home_value || 0),
        draw: parseFloat(main.odd_x || main.odd_draw_value || 0),
        away: parseFloat(main.odd_2 || main.odd_away_value || 0),
      };
    }
  });
}

// ── PREDICTION ENGINE ─────────────────────────────────────────────────────────
function poisson(l, k) { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; }

function computePred(homeName, awayName) {
  const find = name => {
    const n = name.toLowerCase();
    return TEAMS_DB.find(t => n.includes(t.name.toLowerCase().split(' ')[0]) || t.name.toLowerCase().includes(n.split(' ')[0]));
  };
  const h = find(homeName), a = find(awayName);
  if (!h || !a) {
    // Randomise slightly so not every unknown match looks identical
    const hW = 38 + Math.round(Math.random() * 14);
    const aW = 26 + Math.round(Math.random() * 14);
    const dr = 100 - hW - aW;
    return {
      hWin: hW, draw: dr, aWin: aW,
      hxG: +(1.1 + Math.random() * 0.6).toFixed(2),
      axG: +(0.9 + Math.random() * 0.6).toFixed(2),
      btts: 42 + Math.round(Math.random() * 16),
      over25: 48 + Math.round(Math.random() * 16),
      bestPick: { label: hW > aW ? 'Home Win' : 'Away Win', edge: +(3 + Math.random() * 5).toFixed(1), prob: Math.max(hW, aW) },
      conf: 48 + Math.round(Math.random() * 12),
      edgeLbl: Math.random() > 0.6 ? 'MEDIUM' : 'WEAK',
      reasons: ['Team ratings not in model — probabilities estimated from league averages', 'Check fixtures tab for analysis on known teams'],
    };
  }
  const ff = f => f.slice(-3).reduce((a, b) => a + b, 0) / 9;
  const hxG = (h.atk / 100) * (1 - a.def / 150) * (0.6 + ff(h.form) * 0.8) * h.ha;
  const axG = (a.atk / 100) * (1 - h.def / 150) * (0.6 + ff(a.form) * 0.8);
  let hW = 0, dr = 0, aW = 0;
  for (let i = 0; i <= 5; i++) for (let j = 0; j <= 5; j++) {
    const p = poisson(hxG, i) * poisson(axG, j);
    if (i > j) hW += p; else if (i === j) dr += p; else aW += p;
  }
  const t = hW + dr + aW; hW /= t; dr /= t; aW /= t;
  const btts  = (1 - poisson(hxG, 0)) * (1 - poisson(axG, 0));
  let o25 = 0;
  for (let i = 0; i <= 5; i++) for (let j = 0; j <= 5; j++) if (i + j > 2) o25 += poisson(hxG, i) * poisson(axG, j);
  const n = () => (Math.random() - 0.5) * 0.06;
  const mH = Math.max(0.05, hW + n()), mD = Math.max(0.05, dr + n()), mA = Math.max(0.05, aW + n());
  const vals = [
    { label: `${h.name} Win`, edge: hW - mH, prob: hW },
    { label: 'Draw',          edge: dr - mD, prob: dr },
    { label: `${a.name} Win`, edge: aW - mA, prob: aW },
  ];
  vals.sort((x, y) => y.edge - x.edge);
  const best = vals[0];
  const conf = Math.min(98, Math.round(55 + Math.abs(hxG - axG) * 18 + (ff(h.form) + ff(a.form)) * 12));
  const edgeLbl = best.edge > 0.08 ? 'STRONG' : best.edge > 0.03 ? 'MEDIUM' : 'WEAK';
  const reasons = [];
  if (h.atk > 85) reasons.push(`${h.name} elite attack rating (${h.atk})`);
  if (a.def < 76) reasons.push(`${a.name} defensive vulnerability (${a.def} DEF)`);
  reasons.push(ff(h.form) > ff(a.form) ? `${h.name} in better recent form` : `${a.name} in stronger form`);
  reasons.push(h.ha > 1.15 ? `Strong home advantage for ${h.name}` : 'Home advantage factored in');
  if (best.edge > 0.05) reasons.push(`Market underpricing ${best.label} by ${(best.edge * 100).toFixed(1)}%`);
  return {
    hWin: +(hW * 100).toFixed(1), draw: +(dr * 100).toFixed(1), aWin: +(aW * 100).toFixed(1),
    hxG: +hxG.toFixed(2), axG: +axG.toFixed(2),
    btts: +(btts * 100).toFixed(1), over25: +(o25 * 100).toFixed(1),
    bestPick: { ...best, edge: +(best.edge * 100).toFixed(1), prob: +(best.prob * 100).toFixed(1) },
    conf, edgeLbl, reasons,
  };
}

  return `
  <div class="mcard ${stCls} ${ecls}" onclick="openHub('${m.id}')">
    <div class="mc-top">
      <div class="mc-home">${m.home}</div>
      <div class="mc-score ${scoreCls}">${scoreTxt}</div>
      <div class="mc-away">${m.away}</div>
      <div class="mc-right">
        ${m.isLive ? '<span class="live-pill"><span class="live-dot"></span>LIVE</span>' : ''}
        <div class="status-tag ${stCls.toLowerCase()}">${minTxt}</div>
        <div class="mc-league">${m.league}</div>
      </div>
    </div>
    ${m.isLive ? `
    <div class="mom-wrap">
      <div class="mom-labels"><span>${m.home} ${Math.round(m.momentum.home)}%</span><span>MOMENTUM</span><span>${Math.round(100 - m.momentum.home)}% ${m.away}</span></div>
      <div class="mom-bar"><div class="mom-h" style="width:${m.momentum.home}%"></div><div class="mom-a"></div></div>
    </div>
    <div class="ngp-row">
      <span class="ngp-lbl">NEXT GOAL</span>
      <div class="ngp-bar"><div class="ngp-fill" style="width:${Math.round(m.momentum.home * 0.9)}%"></div></div>
      <span class="ngp-pct">${Math.round(m.momentum.home * 0.9)}% H</span>
    </div>` : ''}
    <div class="pred-strip">
      <div class="stat-chip">H ${m.hWin}%</div>
      <div class="stat-chip">D ${m.draw}%</div>
      <div class="stat-chip">A ${m.aWin}%</div>
      <div class="stat-chip">xG ${m.hxG}–${m.axG}</div>
      <div class="stat-chip">O2.5 ${m.over25}%</div>
      ${m.edgeLbl !== 'WEAK' ? `<div class="value-badge ${edgeClass(m.edgeLbl)}" style="padding:2px 7px;"><div class="value-dot"></div>${m.edgeLbl}</div>` : ''}
    </div>
    ${lastEvt ? `<div class="last-evt">${ICONS[lastEvt.type] || '•'} ${lastEvt.minute}' ${lastEvt.detail}</div>` : ''}

function filterBy(league, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.fixture-row').forEach(row => {
    const lt = row.dataset.league || '';
    row.style.display = (league === 'ALL' || lt.includes(league)) ? '' : 'none';
  });
  document.querySelectorAll('.calendar-day').forEach(day => {
    const vis = [...day.querySelectorAll('.fixture-row')].some(r => r.style.display !== 'none');
    day.style.display = vis ? '' : 'none';
  });

// ── HUB ───────────────────────────────────────────────────────────────────────
function openHub(id, src) {
  const pool = src === 'fix' ? FIX_DATA : LIVE_DATA;
  ACTIVE = pool.find(m => String(m.id) === String(id));
  if (!ACTIVE) return;
  ACTIVE_TAB = src === 'fix' ? 'analysis' : 'match';
  document.getElementById('match-hub').style.display = 'flex';
  updateHubHeader();
  document.querySelectorAll('.hub-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('ht-' + ACTIVE_TAB).classList.add('active');
  renderHubTab(ACTIVE_TAB);

  // If live, try fetching fresh lineups/stats
  if (ACTIVE.isLive) fetchMatchDetail(ACTIVE.id);
}

async function fetchMatchDetail(id) {
  try {
    const [luRes, stRes] = await Promise.all([
      fetch(`/api/sports?type=football-lineups&id=${id}`),
      fetch(`/api/sports?type=football-stats&id=${id}`),
    ]);
    const lu = await luRes.json();
    const st = await stRes.json();
    if (lu.success && lu.data?.length > 0) {
      ACTIVE.lineups = lu.data;
    }
    if (st.success && st.data) {
      ACTIVE.apiStats = st.data;
    }
    // Re-render current tab with fresh data
    if (ACTIVE_TAB === 'lineup' || ACTIVE_TAB === 'match') renderHubTab(ACTIVE_TAB);
  } catch {}
}

function closeHub() {
  document.getElementById('match-hub').style.display = 'none';
  if (PITCH_ANIM) { cancelAnimationFrame(PITCH_ANIM); PITCH_ANIM = null; }
  ACTIVE = null;
}

function hubTab(tab) {
  ACTIVE_TAB = tab;
  document.querySelectorAll('.hub-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('ht-' + tab).classList.add('active');
  if (PITCH_ANIM) { cancelAnimationFrame(PITCH_ANIM); PITCH_ANIM = null; }
  renderHubTab(tab);
}

function updateHubHeader() {
  const m = ACTIVE; if (!m) return;
  document.getElementById('hh-home').textContent  = m.home;
  document.getElementById('hh-away').textContent  = m.away;
  document.getElementById('hh-score').textContent = m.hasScore ? `${m.score.home} – ${m.score.away}` : 'vs';
  document.getElementById('hh-status').textContent =
    m.status === 'HT'   ? 'HALF TIME' :
    m.status === 'FT'   ? 'FULL TIME' :
    m.status === 'LIVE' ? `${m.minute}' LIVE` :
    m.kickoff ? `${m.dayLabel} · ${m.kickoff}` : m.dayLabel;
}

function buildStatsHtml(m) {
  if (!m.stats) return '';
  const homeStats = m.stats[m.home] || m.stats[Object.keys(m.stats)[0]] || {};
  const awayStats = m.stats[m.away] || m.stats[Object.keys(m.stats)[1]] || {};
  const keys = ['Ball Possession', 'Total Shots', 'Shots on Goal', 'Corner Kicks', 'Fouls', 'Yellow Cards'];
  const rows = keys.map(key => {
    const hv = parseInt(homeStats[key] || 0);
    const av = parseInt(awayStats[key] || 0);
    const tot = hv + av || 1;
    return `<div class="sc-row">
      <span class="sc-h">${hv}${key.includes('Pos') ? '%' : ''}</span>
      <div class="sc-bar"><div class="sc-bh" style="width:${hv / tot * 100}%"></div><div class="sc-ba" style="width:${av / tot * 100}%"></div></div>
      <span class="sc-a">${av}${key.includes('Pos') ? '%' : ''}</span>
    </div><div class="sc-lbl">${key.toUpperCase()}</div>`;
  }).join('');
  return `<div class="section-header" style="margin-top:14px"><div class="section-title" style="font-size:14px">Match Stats</div></div>
    <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;font-weight:700;margin-bottom:10px">
      <span style="color:var(--neon)">${m.home}</span><span style="color:#a855f7">${m.away}</span>
    </div>${rows}`;
}

// ── CANVAS PITCH ──────────────────────────────────────────────────────────────
function initPitch(m) {
  const canvas = document.getElementById('pitch-canvas'); if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || 320, H = Math.round(W * 0.62);
  canvas.width = W; canvas.height = H;
  const PAD = 18, PW = W - PAD * 2, PH = H - PAD * 2;

  // Use real lineup positions if available, else formation grid
  const FORM = [{x:.07,y:.50},{x:.22,y:.15},{x:.22,y:.38},{x:.22,y:.62},{x:.22,y:.85},{x:.45,y:.25},{x:.45,y:.50},{x:.45,y:.75},{x:.68,y:.18},{x:.72,y:.50},{x:.68,y:.82}];
  const homePts = FORM.map((p, i) => ({ x: PAD+p.x*PW, y: PAD+p.y*PH, bx: PAD+p.x*PW, by: PAD+p.y*PH, n: i+1 }));
  const awayPts = FORM.map((p, i) => ({ x: PAD+(1-p.x)*PW, y: PAD+p.y*PH, bx: PAD+(1-p.x)*PW, by: PAD+p.y*PH, n: i+1 }));
  let bx = W/2, by = H/2, btx = W/2, bty = H/2, ptick = 0;

  const frame = () => {
    // Pitch
    ctx.fillStyle='#1e4d1a'; ctx.fillRect(0,0,W,H);
    for(let i=0;i<10;i++){ctx.fillStyle=i%2===0?'rgba(0,0,0,0.07)':'rgba(255,255,255,0.03)';ctx.fillRect(i*(W/10),0,W/10,H);}
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.2;
    ctx.strokeRect(PAD,PAD,PW,PH);
    ctx.beginPath();ctx.moveTo(W/2,PAD);ctx.lineTo(W/2,H-PAD);ctx.stroke();
    ctx.beginPath();ctx.arc(W/2,H/2,PH*.14,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.arc(W/2,H/2,2.5,0,Math.PI*2);ctx.fill();
    const paw=PW*.15,pah=PH*.45;
    ctx.strokeRect(PAD,H/2-pah/2,paw,pah);ctx.strokeRect(W-PAD-paw,H/2-pah/2,paw,pah);
    ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=2;
    ctx.strokeRect(PAD-6,H/2-PH*.10,6,PH*.20); ctx.strokeRect(W-PAD,H/2-PH*.10,6,PH*.20);
    // Players
    [[homePts,'#00ff9d','#00ff9d'],[awayPts,'#a855f7','#a855f7']].forEach(([pts,col,glow])=>{
      pts.forEach(p=>{
        p.x+=(p.bx-p.x)*.06+(Math.random()-.5)*1.5; p.y+=(p.by-p.y)*.06+(Math.random()-.5)*1.5;
        ctx.shadowColor=glow;ctx.shadowBlur=10;ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;ctx.fillStyle='rgba(0,0,0,.9)';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.n,p.x,p.y);
      });
    });
    // Ball
    bx+=(btx-bx)*.1; by+=(bty-by)*.1;
    ptick--;if(ptick<=0){const pool=Math.random()<.5?homePts:awayPts;const t=pool[Math.floor(Math.random()*pool.length)];btx=t.x+(Math.random()-.5)*12;bty=t.y+(Math.random()-.5)*12;ptick=35+Math.random()*35|0;}
    ctx.shadowColor='#fff';ctx.shadowBlur=14;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    PITCH_ANIM = requestAnimationFrame(frame);
  };
  frame();
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function showTab(tab) {
  document.getElementById('pnl-live').style.display     = tab === 'live'     ? '' : 'none';
  document.getElementById('pnl-fixtures').style.display = tab === 'fixtures' ? '' : 'none';
  document.getElementById('tb-live').className     = 'tab-btn' + (tab === 'live'     ? ' active' : '');
  document.getElementById('tb-fixtures').className = 'tab-btn' + (tab === 'fixtures' ? ' active' : '');
  if (tab === 'fixtures' && FIX_DATA.length === 0) loadFixtures();
  else if (tab === 'fixtures') renderFixtures();
}

// ── BANNER ────────────────────────────────────────────────────────────────────
function setBanner(mode, txt) {
  const b = document.getElementById('live-banner');
  const d = document.getElementById('banner-dot');
  const t = document.getElementById('banner-txt');
  if (!b) return;
  b.className = mode === 'live' ? 'odds-api-banner live' : 'odds-api-banner sim';
  if (d) d.className = `oab-dot ${mode === 'live' ? 'live' : 'sim'}`;
  if (t) t.innerHTML = txt;
}

// ── REFRESH + AUTO ────────────────────────────────────────────────────────────
function refresh() {
  if (document.getElementById('pnl-fixtures').style.display !== 'none') loadFixtures();
  else loadLive();
}

function startRefBar() {
  setInterval(() => {
    REF_TIMER--;
    const bar = document.getElementById('ref-prog');
    if (bar) bar.style.width = (REF_TIMER / 30 * 100) + '%';
    if (REF_TIMER <= 0) {
      REF_TIMER = 30;
      if (document.getElementById('pnl-live').style.display !== 'none') loadLive();
    }
  }, 1000);
}
</script>
