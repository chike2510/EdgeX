<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football — EdgeX</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2300ff9d'/><text x='50%25' y='58%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-weight='bold' font-size='16' fill='%2307090d'>EX</text></svg>" />
</head>
<body>

<nav id="side-nav"></nav>

<div id="page-wrap">
  <header id="page-header">
    <div class="page-title">
      <span class="page-title-icon">⚽</span>
      FOOTBALL
      <span class="page-subtitle">xG ENGINE + LIVE ODDS</span>
    </div>
    <!-- Bankroll -->
    <div class="bankroll-wrap">
      <span class="br-currency">$</span>
      <input class="br-input" id="br-input" type="number" min="1" step="100" value="1000" />
    </div>
    <button id="refresh-btn" onclick="location.reload()">⟳ REFRESH</button>
  </header>

  <main id="page-main">
    <!-- Odds API Status -->
    <div id="odds-banner" class="odds-api-banner sim">
      <div class="oab-dot sim"></div>
      <div class="oab-text">Loading odds data...</div>
    </div>

    <!-- League filter -->
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="tool-label">LEAGUE</span>
        <button class="filter-btn active" onclick="filterLeague('ALL',this)">ALL</button>
        <button class="filter-btn" onclick="filterLeague('EPL',this)">EPL</button>
        <button class="filter-btn" onclick="filterLeague('UCL',this)">UCL</button>
        <button class="filter-btn" onclick="filterLeague('LA LIGA',this)">LA LIGA</button>
        <button class="filter-btn" onclick="filterLeague('BUNDESLIGA',this)">BUND</button>
        <button class="filter-btn" onclick="filterLeague('SERIE A',this)">SERIE A</button>
      </div>
    </div>

    <!-- Acca bar -->
    <div id="acca-bar" style="display:none;background:linear-gradient(135deg,rgba(0,201,255,0.08),rgba(0,255,157,0.05));border:1px solid rgba(0,201,255,0.25);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;"></div>

    <!-- Fixture Calendar -->
    <div id="fixture-calendar">
      <div class="loading-wrap"><div class="loader"></div><div class="loading-text">LOADING FIXTURES...</div></div>
    </div>
  </main>
</div>

<div id="ticker-bar"></div>

<script src="common.js"></script>
<script src="football-page.js"></script>
<script>
function filterLeague(league, btn) {
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b===btn));
  document.querySelectorAll('.fixture-row').forEach(row => {
    const league_text = row.querySelector('.fr-league')?.textContent || '';
    row.parentElement.style.display = (league==='ALL'||league_text.includes(league)) ? '' : 'none';
  });
  // Show/hide calendar days with no visible rows
  document.querySelectorAll('.calendar-day').forEach(day => {
    const visible = [...day.querySelectorAll('.fixture-row')].some(r=>r.parentElement.style.display!=='none'||r.style.display!=='none');
    day.style.display = visible ? '' : 'none';
  });
}
</script>
</body>
</html>
