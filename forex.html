<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Provider-backed forex market context and data availability from EdgeX.">
  <title>Forex · Markets · EdgeX</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="edgex-v2.css">
  <script src="edgex-v2-core.js"></script>
  <script src="edgex-shell.js"></script>
</head>
<body data-asset-type="forex">
  <aside id="side-nav"></aside>
  <main class="page-shell">
    <header class="topbar"><div class="topbar-title">Forex</div></header>
    <section class="edgex-page">
      <div class="edgex-v2-page-head">
        <div><span class="edgex-v2-eyebrow">Markets · Forex</span><h1>Forex market context</h1><p>Current provider rates, movement, and update times only. No directional signals, targets, stops, or broker execution.</p></div>
        <button class="edgex-v2-button" id="asset-refresh" type="button">Refresh</button>
      </div>
      <div class="edgex-v2-state edgex-v2-state-loading" id="asset-state" aria-live="polite"><strong>Loading forex data</strong><span>Requesting current provider values.</span></div>
      <div class="edgex-v2-grid" id="asset-list"></div>
    </section>
  </main>
  <script type="module" src="market-assets.mjs"></script>
</body>
</html>
