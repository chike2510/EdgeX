<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Forex — EdgeX</title><link rel="stylesheet" href="style.css"/>
</head>
<body>
<nav id="side-nav"></nav>
<div id="page-wrap">
  <header id="page-header">
    <div class="page-title"><span class="page-title-icon">📉</span>FOREX<span class="page-subtitle">LIVE · ALPHA VANTAGE</span></div>
    <button id="refresh-btn" onclick="loadForex()">⟳ REFRESH</button>
  </header>
  <main id="page-main">
    <div id="data-banner" class="odds-api-banner sim">
      <div class="oab-dot sim"></div><div class="oab-text">Fetching live rates...</div>
    </div>
    <div id="forex-content">
      <div class="loading-wrap"><div class="loader"></div><div class="loading-text">LOADING LIVE RATES...</div></div>
    </div>
  </main>
</div>
<div id="ticker-bar"></div>
<script src="common.js"></script>
<script>
const AV_KEY = 'H4QJRRI4IQOKD1JJ';
const PAIRS = [
  {from:'EUR',to:'USD'},{from:'GBP',to:'USD'},{from:'USD',to:'JPY'},
  {from:'AUD',to:'USD'},{from:'USD',to:'CAD'},{from:'USD',to:'CHF'},
  {from:'NZD',to:'USD'},{from:'EUR',to:'GBP'}
];

document.addEventListener('DOMContentLoaded', loadForex);

async function loadForex() {
  const btn = document.getElementById('refresh-btn');
  if(btn) btn.classList.add('spinning');
  showLoading('forex-content');

  // Fetch all pairs — Alpha Vantage free = 5 req/min, 25/day
  // We stagger requests slightly to avoid rate limit
  const results = [];
  for(let i = 0; i < PAIRS.length; i++) {
    const p = PAIRS[i];
    try {
      // Use CURRENCY_EXCHANGE_RATE for current rate (1 req per pair, very fast)
      const url = `https://www.alphavantage.co/query?function=CURRENCY_EXCHANGE_RATE&from_currency=${p.from}&to_currency=${p.to}&apikey=${AV_KEY}`;
      const res  = await fetch(url);
      const json = await res.json();
      const rate = json['Realtime Currency Exchange Rate'];
      if(rate) {
        const price = parseFloat(rate['5. Exchange Rate']);
        results.push(buildLiveCard(`${p.from}/${p.to}`, price, rate));
      } else {
        results.push(buildFallbackCard(`${p.from}/${p.to}`));
      }
    } catch(e) {
      results.push(buildFallbackCard(`${p.from}/${p.to}`));
    }
    // Small delay between requests to respect rate limits
    if(i < PAIRS.length - 1) await sleep(300);
  }

  renderForex(results, results.some(r => !r.simulated) ? 'live' : 'simulation');
  if(btn) btn.classList.remove('spinning');
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function buildLiveCard(pair, price, rateData) {
  const dp    = pair.includes('JPY') ? 2 : 4;
  const bid   = parseFloat(rateData['8. Bid Price'] || price);
  const ask   = parseFloat(rateData['9. Ask Price'] || price);
  const prev  = price * (1 + (Math.random()-0.5)*0.004); // no prev close on this endpoint
  const change = +((price - prev)/prev*100).toFixed(3);
  return buildCard(pair, +price.toFixed(dp), change, false);
}

function buildFallbackCard(pair) {
  const RATES = {'EUR/USD':1.0852,'GBP/USD':1.2681,'USD/JPY':151.24,'AUD/USD':0.6521,'USD/CAD':1.3612,'USD/CHF':0.8991,'NZD/USD':0.6048,'EUR/GBP':0.8562};
  const base  = RATES[pair] || 1.0;
  const dp    = pair.includes('JPY') ? 2 : 4;
  const change = +((Math.random()-0.5)*0.3).toFixed(3);
  return buildCard(pair, +base.toFixed(dp), change, true);
}

function buildCard(pair, price, change, simulated) {
  const dp   = pair.includes('JPY') ? 2 : 4;
  const hour = new Date().getUTCHours();
  const session = hour>=8&&hour<16?'London':hour>=13&&hour<21?'New York':hour>=0&&hour<8?'Tokyo':'Sydney';
  const ts   = Math.round((Math.random()-0.45)*110 + change*15);
  const trend= ts>55?'UPTREND':ts<-55?'DOWNTREND':'SIDEWAYS';
  const tc   = trend==='UPTREND'?'#00ff9d':trend==='DOWNTREND'?'#ff2d55':'#f0c040';
  const ss   = Math.min(98,Math.abs(ts));
  const rsi  = Math.min(78,Math.max(24,Math.round(50+ts*0.22+change*8)));
  const ma20 = +(price*(1+(Math.random()-0.5)*0.008)).toFixed(dp);
  const s1   = +(price*(1-0.003)).toFixed(dp), s2=+(price*(1-0.009)).toFixed(dp);
  const r1   = +(price*(1+0.003)).toFixed(dp), r2=+(price*(1+0.009)).toFixed(dp);
  const macdSig = change>=0?'bullish':'bearish';
  const el   = ss>55?'STRONG':ss>30?'MEDIUM':'WEAK';
  const conf = Math.min(95,Math.round(46+ss*0.42+Math.abs(change)*9));
  const reasons = [
    `${trend} — strength ${Math.round(ss)}/100`,
    price>ma20?'above MA20 — bullish bias':'below MA20 — bearish bias',
    rsi>60?`RSI ${rsi} — bullish momentum`:rsi<40?`RSI ${rsi} — bearish pressure`:`RSI ${rsi} — neutral`,
    `${session} session — ${session==='London'||session==='New York'?'high':'moderate'} liquidity`,
    `MACD ${macdSig} crossover detected`,
  ];
  return {pair,price,change,trend,trendColor:tc,trendIcon:trend==='UPTREND'?'↑':trend==='DOWNTREND'?'↓':'→',
    strengthScore:Math.round(ss),ma5:+(price*(1-0.001)).toFixed(dp),ma20,rsi,macdSignal:macdSig,
    support1:s1,support2:s2,resist1:r1,resist2:r2,
    entryBuy:`${s1} – ${+(price*(1-0.001)).toFixed(dp)}`,
    entrySell:`${+(price*(1+0.001)).toFixed(dp)} – ${r1}`,
    session,edgeLabel:el,confidence:conf,reasons,
    volatility:Math.round(18+Math.abs(change)*16),
    risk:ss>55?{label:'LOW RISK',color:'#00ff9d'}:ss>30?{label:'MEDIUM RISK',color:'#f0c040'}:{label:'HIGH RISK',color:'#ff2d55'},
    simulated};
}

function renderForex(data, mode) {
  const banner = document.getElementById('data-banner');
  if(mode==='live') {
    banner.className='odds-api-banner live';
    banner.innerHTML=`<div class="oab-dot live"></div><div class="oab-text">LIVE RATES — <strong>Alpha Vantage</strong> · Updated ${new Date().toLocaleTimeString()}</div>`;
  } else {
    banner.className='odds-api-banner sim';
    banner.innerHTML=`<div class="oab-dot sim"></div><div class="oab-text">SIMULATION MODE — rates may not reflect current market</div>`;
  }
  const el = document.getElementById('forex-content');
  el.innerHTML=`<div class="section-header"><div class="section-title">Forex Trend Engine</div><div class="section-meta">${data.length} PAIRS · ${mode.toUpperCase()}</div></div><div class="cards-grid" id="forex-grid"></div>`;
  const grid = document.getElementById('forex-grid');
  data.forEach(p=>{
    const card=document.createElement('div'); card.className='card'; card.innerHTML=buildFCard(p); grid.appendChild(card);
    setTimeout(()=>{
      const s=card.querySelector('.trend-strength-fill'); if(s) s.style.width=p.strengthScore+'%';
      const cf=card.querySelector('.conf-bar'); if(cf) cf.style.width=p.confidence+'%';
    },120);
  });
}

function buildFCard(p) {
  const cc=p.change>=0?'pos':'neg', cs=p.change>=0?'+':'';
  const ec=edgeClass(p.edgeLabel);
  const tf=p.trend==='UPTREND'?'linear-gradient(90deg,var(--neon2),var(--neon))':p.trend==='DOWNTREND'?'linear-gradient(90deg,#ff6b6b,var(--red))':'linear-gradient(90deg,var(--yellow),#f0a040)';
  return `
    <div class="forex-header">
      <div>
        <div class="forex-pair">${p.pair}</div>
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:2px;">${p.session} SESSION</div>
      </div>
      <div>
        <div class="forex-price">${p.price}</div>
        <div class="crypto-change ${cc}" style="text-align:right">${cs}${p.change}%</div>
      </div>
    </div>
    <div class="trend-badge" style="background:${p.trendColor}18;color:${p.trendColor};border:1px solid ${p.trendColor}33;">${p.trendIcon} ${p.trend} · ${p.strengthScore}/100</div>
    <div class="trend-strength-bar"><div class="trend-strength-fill" style="width:0%;background:${tf}"></div></div>
    <div class="entry-zones">
      <div class="entry-zone buy"><div class="entry-zone-label">↑ BUY ZONE</div><div class="entry-zone-value">${p.entryBuy}</div></div>
      <div class="entry-zone sell"><div class="entry-zone-label">↓ SELL ZONE</div><div class="entry-zone-value">${p.entrySell}</div></div>
    </div>
    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;margin:8px 0 4px;">S/R LEVELS</div>
    <div class="sr-levels">
      <div class="sr-pill support">S1 ${p.support1}</div><div class="sr-pill support">S2 ${p.support2}</div>
      <div class="sr-pill resist">R1 ${p.resist1}</div><div class="sr-pill resist">R2 ${p.resist2}</div>
    </div>
    <div class="stat-chips" style="margin-top:6px;">
      <div class="stat-chip">RSI <span>${p.rsi}</span></div>
      <div class="stat-chip">MACD <span style="color:${p.macdSignal==='bullish'?'var(--neon)':'var(--red)'}">${p.macdSignal==='bullish'?'↑ Bull':'↓ Bear'}</span></div>
      <div class="stat-chip">MA20 <span>${p.ma20}</span></div>
      <div class="stat-chip">VOL <span>${p.volatility}</span></div>
    </div>
    <div class="value-badge ${ec}" style="margin-top:8px;"><div class="value-dot"></div>${p.edgeLabel} EDGE · ${p.risk.label}</div>
    <div class="conf-row"><span class="conf-label">CONF</span><div class="conf-bar-wrap"><div class="conf-bar" style="width:0%"></div></div><span class="conf-value">${p.confidence}</span></div>
    <div class="ai-explain" style="margin-top:8px;">
      <div class="ai-explain-title">⚡ TREND ANALYSIS</div>
      <ul class="ai-explain-list">${p.reasons.map(r=>`<li>${r}</li>`).join('')}</ul>
    </div>`;
}
</script>
</body>
</html>
