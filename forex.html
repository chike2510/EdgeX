<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Forex — EdgeX</title><link rel="stylesheet" href="style.css"/>
</head>
<body>
<nav id="side-nav"></nav>
<div id="page-wrap">
  <header id="page-header">
    <div class="page-title"><span class="page-title-icon">📉</span>FOREX<span class="page-subtitle">LIVE · ALPHA VANTAGE</span></div>
    <button id="refresh-btn" onclick="loadForex()">⟳ REFRESH</button>
  </header>
  <main id="page-main">
    <div id="data-banner" class="odds-api-banner sim">
      <div class="oab-dot sim"></div><div class="oab-text">Fetching live rates...</div>
    </div>
    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted);margin-bottom:10px;">Free key at <strong style="color:var(--neon)">alphavantage.co</strong> — takes 30 seconds. Then add ALPHA_VANTAGE_KEY to Vercel env vars.</div>
      <div style="display:flex;gap:8px;">
        <input id="av-key-input" type="text" placeholder="Paste key here to test..." style="flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:8px 12px;outline:none;" />
        <button onclick="testAVKey()" style="background:var(--neon-dim);border:1px solid rgba(0,255,157,0.3);color:var(--neon);font-family:var(--font-mono);font-size:10px;padding:8px 14px;border-radius:var(--radius);cursor:pointer;">TEST KEY</button>
      </div>
    </div>
    <div id="forex-content">
      <div class="loading-wrap"><div class="loader"></div><div class="loading-text">LOADING LIVE RATES...</div></div>
    </div>
  </main>
</div>
<div id="ticker-bar"></div>
<script src="common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', loadForex);

async function loadForex() {
  const btn = document.getElementById('refresh-btn');
  if(btn) btn.classList.add('spinning');
  showLoading('forex-content');
  let data = null, mode = 'simulation';
  try {
    const res = await fetch('/api/forex');
    const json = await res.json();
    if(json.success && json.data?.length) {
      data = json.data; mode = json.mode;
      if(mode === 'simulation')
    }
  } catch(e) {}
  if(!data) { data = generateForexFallback();
  renderForex(data, mode);
  if(btn) btn.classList.remove('spinning');
}

function renderForex(data, mode) {
  const banner = document.getElementById('data-banner');
  if(mode === 'live') {
    banner.className = 'odds-api-banner live';
    banner.innerHTML = `<div class="oab-dot live"></div><div class="oab-text">LIVE RATES — <strong>Alpha Vantage</strong> · Updated ${new Date().toLocaleTimeString()}</div>`;
  } else {
    banner.className = 'odds-api-banner sim';
    banner.innerHTML = `<div class="oab-dot sim"></div><div class="oab-text">SIMULATION — add ALPHA_VANTAGE_KEY to Vercel env vars for live rates</div>`;
  }
  const el = document.getElementById('forex-content');
  el.innerHTML = `<div class="section-header"><div class="section-title">Forex Trend Engine</div><div class="section-meta">${data.length} PAIRS · ${mode.toUpperCase()}</div></div><div class="cards-grid" id="forex-grid"></div>`;
  const grid = document.getElementById('forex-grid');
  data.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card'; card.innerHTML = buildFCard(p); grid.appendChild(card);
    setTimeout(() => {
      const s = card.querySelector('.trend-strength-fill'); if(s) s.style.width = p.strengthScore+'%';
      const cf = card.querySelector('.conf-bar'); if(cf) cf.style.width = p.confidence+'%';
    }, 120);
  });
}

function buildFCard(p) {
  const cc = p.change>=0?'pos':'neg', cs = p.change>=0?'+':'';
  const ec = edgeClass(p.edgeLabel);
  const tf = p.trend==='UPTREND'?'linear-gradient(90deg,var(--neon2),var(--neon))':p.trend==='DOWNTREND'?'linear-gradient(90deg,#ff6b6b,var(--red))':'linear-gradient(90deg,var(--yellow),#f0a040)';
  return `
    <div class="forex-header">
      <div>
        <div class="forex-pair">${p.pair}</div>
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:2px;">${p.session} SESSION ${p.simulated?'· SIM':''}</div>
      </div>
      <div>
        <div class="forex-price">${p.price}</div>
        <div class="crypto-change ${cc}" style="text-align:right">${cs}${p.change}%</div>
      </div>
    </div>
    <div class="trend-badge" style="background:${p.trendColor}18;color:${p.trendColor};border:1px solid ${p.trendColor}33;">${p.trendIcon} ${p.trend} · ${p.strengthScore}/100</div>
    <div class="trend-strength-bar"><div class="trend-strength-fill" style="width:0%;background:${tf}"></div></div>
    <div class="entry-zones">
      <div class="entry-zone buy"><div class="entry-zone-label">↑ BUY ZONE</div><div class="entry-zone-value">${p.entryBuy}</div></div>
      <div class="entry-zone sell"><div class="entry-zone-label">↓ SELL ZONE</div><div class="entry-zone-value">${p.entrySell}</div></div>
    </div>
    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;margin:8px 0 4px;">S/R LEVELS</div>
    <div class="sr-levels">
      <div class="sr-pill support">S1 ${p.support1}</div>
      <div class="sr-pill support">S2 ${p.support2}</div>
      <div class="sr-pill resist">R1 ${p.resist1}</div>
      <div class="sr-pill resist">R2 ${p.resist2}</div>
    </div>
    <div class="stat-chips" style="margin-top:6px;">
      <div class="stat-chip">RSI <span>${p.rsi}</span></div>
      <div class="stat-chip">MACD <span style="color:${p.macdSignal==='bullish'?'var(--neon)':'var(--red)'}">${p.macdSignal==='bullish'?'↑ Bull':'↓ Bear'}</span></div>
      <div class="stat-chip">MA20 <span>${p.ma20}</span></div>
      <div class="stat-chip">VOL <span>${p.volatility}</span></div>
    </div>
    <div class="value-badge ${ec}" style="margin-top:8px;"><div class="value-dot"></div>${p.edgeLabel} EDGE · ${p.risk.label}</div>
    <div class="conf-row"><span class="conf-label">CONF</span><div class="conf-bar-wrap"><div class="conf-bar" style="width:0%"></div></div><span class="conf-value">${p.confidence}</span></div>
    <div class="ai-explain" style="margin-top:8px;">
      <div class="ai-explain-title">⚡ TREND ANALYSIS</div>
      <ul class="ai-explain-list">${p.reasons.map(r=>`<li>${r}</li>`).join('')}</ul>
    </div>`;
}


function generateForexFallback(){
  const pairs=[{pair:'EUR/USD',price:1.0852,change:0.12},{pair:'GBP/USD',price:1.2681,change:-0.08},{pair:'USD/JPY',price:151.24,change:0.22},{pair:'AUD/USD',price:0.6521,change:-0.15},{pair:'USD/CAD',price:1.3612,change:0.09},{pair:'USD/CHF',price:0.8991,change:-0.04},{pair:'NZD/USD',price:0.6048,change:0.06},{pair:'EUR/GBP',price:0.8562,change:0.03}];
  const hour=new Date().getUTCHours();
  const session=hour>=8&&hour<16?'London':hour>=13&&hour<21?'New York':hour>=0&&hour<8?'Tokyo':'Sydney';
  return pairs.map(p=>{
    const dp=p.pair.includes('JPY')?2:4;
    const ts=Math.round((Math.random()-0.5)*120);
    const trend=ts>60?'UPTREND':ts<-60?'DOWNTREND':'SIDEWAYS';
    const tc=trend==='UPTREND'?'#00ff9d':trend==='DOWNTREND'?'#ff2d55':'#f0c040';
    const ss=Math.abs(ts);const rsi=Math.round(40+Math.random()*20);
    const ma20=+(p.price*(1+(Math.random()-0.5)*0.01)).toFixed(dp);
    const s1=+(p.price*(1-0.003)).toFixed(dp),s2=+(p.price*(1-0.008)).toFixed(dp);
    const r1=+(p.price*(1+0.003)).toFixed(dp),r2=+(p.price*(1+0.008)).toFixed(dp);
    const el=ss>60?'STRONG':ss>35?'MEDIUM':'WEAK';
    return{pair:p.pair,price:p.price,change:p.change,trend,trendColor:tc,trendIcon:trend==='UPTREND'?'↑':trend==='DOWNTREND'?'↓':'→',strengthScore:Math.round(ss),ma5:+(p.price*0.999).toFixed(dp),ma20,rsi,macd:0,macdSignal:p.change>=0?'bullish':'bearish',support1:s1,support2:s2,resist1:r1,resist2:r2,entryBuy:`${s1} – ${+(p.price*0.999).toFixed(dp)}`,entrySell:`${+(p.price*1.001).toFixed(dp)} – ${r1}`,session,edgeLabel:el,confidence:Math.min(96,Math.round(45+ss*0.4)),reasons:[`${trend} — strength ${Math.round(ss)}/100`,p.price>ma20?'above MA20':'below MA20',`RSI ${rsi}`,`${session} session active`],volatility:Math.round(20+Math.abs(p.change)*15),risk:ss>60?{label:'LOW RISK',color:'#00ff9d'}:ss>35?{label:'MEDIUM RISK',color:'#f0c040'}:{label:'HIGH RISK',color:'#ff2d55'},simulated:true};
  });
}
</script>
</body>
</html>
