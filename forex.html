<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Forex — EdgeX</title>
<link rel="stylesheet" href="style.css"/>
<style>
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.pair-btn{padding:10px;font-family:var(--font-mono);font-size:11px;font-weight:700;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-muted);cursor:pointer;text-align:center;transition:var(--transition);}
.pair-btn.active{background:var(--neon-dim);border-color:rgba(0,255,157,0.4);color:var(--neon);}
.pair-btn:hover:not(.active){border-color:var(--border2);color:var(--text);}
.cat-label{font-family:var(--font-mono);font-size:9px;color:var(--neon2);letter-spacing:1.5px;margin:14px 0 8px;text-transform:uppercase;}
.fx-input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.fx-input-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
.fx-field{display:flex;flex-direction:column;gap:4px;}
.fx-field label{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:0.5px;}
.fx-field input,.fx-field select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:8px 10px;font-size:12px;font-family:var(--font-mono);outline:none;width:100%;transition:var(--transition);}
.fx-field input:focus,.fx-field select:focus{border-color:rgba(0,255,157,0.4);}
.fx-field select option{background:var(--bg2);}
.run-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--neon),var(--neon2));border:none;border-radius:var(--radius);color:#07090d;font-family:var(--font-mono);font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px;margin-top:4px;}
.run-btn:hover{opacity:0.9;}
.signal-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:10px;}
.sig-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sig-pair{font-family:var(--font-mono);font-size:14px;font-weight:700;}
.sig-dir{font-family:var(--font-mono);font-size:12px;font-weight:700;padding:4px 12px;border-radius:4px;}
.sig-dir.BUY{background:rgba(0,255,157,0.12);border:1px solid rgba(0,255,157,0.35);color:var(--neon);}
.sig-dir.SELL{background:rgba(255,45,85,0.10);border:1px solid rgba(255,45,85,0.35);color:var(--red);}
.sig-dir.WAIT{background:var(--bg3);border:1px solid var(--border);color:var(--text-dim);}
.signal-matrix{display:flex;flex-direction:column;gap:0;}
.sm-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.sm-lbl{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);width:80px;flex-shrink:0;}
.sm-val{font-family:var(--font-mono);font-size:11px;font-weight:700;}
.sm-bar-wrap{flex:1;height:4px;background:var(--bg4);border-radius:2px;margin:0 10px;overflow:hidden;}
.sm-bar{height:100%;border-radius:2px;transition:width 0.8s ease;}
.level-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0;}
.level-cell{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center;}
.level-cell.tp{border-color:rgba(0,255,157,0.25);}
.level-cell.sl{border-color:rgba(255,45,85,0.25);}
.level-lbl{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:0.5px;}
.level-val{font-family:var(--font-mono);font-size:13px;font-weight:700;margin-top:4px;}
.session-tabs{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
.session-tab{flex-shrink:0;padding:6px 14px;font-family:var(--font-mono);font-size:10px;font-weight:700;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text-muted);cursor:pointer;transition:var(--transition);}
.session-tab.active{background:var(--neon-dim);border-color:rgba(0,255,157,0.35);color:var(--neon);}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.fx-chip{padding:4px 10px;border-radius:20px;font-size:10px;font-family:var(--font-mono);border:1px solid var(--border2);color:var(--text-dim);background:var(--bg2);cursor:pointer;}
.fx-chip.on{background:rgba(0,255,157,0.12);border-color:rgba(0,255,157,0.35);color:var(--neon);}
.live-rates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.rate-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px;cursor:pointer;transition:var(--transition);}
.rate-card:hover{border-color:rgba(0,255,157,0.3);}
.rate-pair{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);}
.rate-price{font-family:var(--font-mono);font-size:14px;font-weight:700;margin:3px 0;}
.rate-chg{font-family:var(--font-mono);font-size:10px;font-weight:700;}
/* Polymarket panel */
.pm-strip{background:var(--bg3);border:1px solid rgba(0,201,255,0.2);border-radius:var(--radius);padding:10px 12px;margin-top:12px;}
.pm-title{font-family:var(--font-mono);font-size:9px;color:var(--neon2);letter-spacing:1px;margin-bottom:8px;}
.pm-market{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.05);}
.pm-q{font-size:11px;font-weight:600;margin-bottom:5px;color:var(--text);}
.pm-bar-wrap{display:flex;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-bottom:3px;}
.pm-yes{background:var(--neon);height:100%;}
.pm-no{background:var(--red);height:100%;flex:1;}
.pm-pcts{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--text-dim);}
</style>
</head>
<body>
<nav id="side-nav"></nav>
<div id="page-wrap">
<header id="page-header">
  <div class="page-title">
    <span class="page-title-icon">📉</span>FOREX
    <span class="page-subtitle">APEX ENGINE · MACD+RSI+PIVOT</span>
  </div>
  <button id="refresh-btn" onclick="refreshRates()">⟳</button>
</header>
<main id="page-main">

  <div id="live-rates-banner" class="odds-api-banner sim" style="margin-bottom:10px">
    <div class="oab-dot sim"></div><div class="oab-text">Loading rates...</div>
  </div>
  <div class="live-rates" id="live-rates"></div>

  <!-- Major Pairs -->
  <div class="cat-label">🌍 MAJORS</div>
  <div class="pair-grid">
    <button class="pair-btn active" onclick="selectPair('EUR/USD',this)">EUR/USD</button>
    <button class="pair-btn" onclick="selectPair('GBP/USD',this)">GBP/USD</button>
    <button class="pair-btn" onclick="selectPair('USD/JPY',this)">USD/JPY</button>
    <button class="pair-btn" onclick="selectPair('USD/CHF',this)">USD/CHF</button>
    <button class="pair-btn" onclick="selectPair('AUD/USD',this)">AUD/USD</button>
    <button class="pair-btn" onclick="selectPair('USD/CAD',this)">USD/CAD</button>
    <button class="pair-btn" onclick="selectPair('NZD/USD',this)">NZD/USD</button>
    <button class="pair-btn" onclick="selectPair('USD/MXN',this)">USD/MXN</button>
  </div>

  <!-- Cross Pairs -->
  <div class="cat-label">🔀 CROSS PAIRS</div>
  <div class="pair-grid">
    <button class="pair-btn" onclick="selectPair('EUR/GBP',this)">EUR/GBP</button>
    <button class="pair-btn" onclick="selectPair('EUR/JPY',this)">EUR/JPY</button>
    <button class="pair-btn" onclick="selectPair('GBP/JPY',this)">GBP/JPY</button>
    <button class="pair-btn" onclick="selectPair('EUR/CHF',this)">EUR/CHF</button>
    <button class="pair-btn" onclick="selectPair('AUD/JPY',this)">AUD/JPY</button>
    <button class="pair-btn" onclick="selectPair('GBP/CHF',this)">GBP/CHF</button>
  </div>

  <!-- Commodities -->
  <div class="cat-label">🥇 COMMODITIES</div>
  <div class="pair-grid">
    <button class="pair-btn" onclick="selectPair('XAU/USD',this)">XAU/USD (Gold)</button>
    <button class="pair-btn" onclick="selectPair('XAG/USD',this)">XAG/USD (Silver)</button>
    <button class="pair-btn" onclick="selectPair('WTI/USD',this)">WTI Oil</button>
    <button class="pair-btn" onclick="selectPair('BRN/USD',this)">Brent Oil</button>
  </div>

  <!-- Session -->
  <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1.5px;margin-bottom:8px">SESSION</div>
  <div class="session-tabs">
    <button class="session-tab active" onclick="selectSession('London',this)">🇬🇧 London</button>
    <button class="session-tab" onclick="selectSession('New York',this)">🇺🇸 New York</button>
    <button class="session-tab" onclick="selectSession('Tokyo',this)">🇯🇵 Tokyo</button>
    <button class="session-tab" onclick="selectSession('Sydney',this)">🇦🇺 Sydney</button>
    <button class="session-tab" onclick="selectSession('Overlap',this)">⚡ Overlap</button>
  </div>

  <!-- Inputs -->
  <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1.5px;margin-bottom:8px">MARKET DATA</div>
  <div class="fx-input-row">
    <div class="fx-field"><label>Current Rate</label><input type="number" id="fx-rate" placeholder="e.g. 1.0842" step="0.0001"/></div>
    <div class="fx-field"><label>Pivot Level</label><input type="number" id="fx-pivot" placeholder="e.g. 1.0850" step="0.0001"/></div>
  </div>
  <div class="fx-input-row-3">
    <div class="fx-field"><label>RSI (14)</label><input type="number" id="fx-rsi" placeholder="55" min="0" max="100"/></div>
    <div class="fx-field"><label>ATR (pips)</label><input type="number" id="fx-atr" placeholder="68"/></div>
    <div class="fx-field"><label>MACD</label>
      <select id="fx-macd">
        <option>Bullish Crossover</option>
        <option>Bearish Crossover</option>
        <option>Above Signal</option>
        <option>Below Signal</option>
        <option>Histogram Rising</option>
        <option>Histogram Falling</option>
      </select>
    </div>
  </div>

  <!-- Context flags -->
  <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1.5px;margin-bottom:8px">CONTEXT FLAGS</div>
  <div class="chip-row">
    <div class="fx-chip" onclick="this.classList.toggle('on')">USD Bullish Bias</div>
    <div class="fx-chip on" onclick="this.classList.toggle('on')">Trending</div>
    <div class="fx-chip" onclick="this.classList.toggle('on')">Risk-Off Mode</div>
    <div class="fx-chip" onclick="this.classList.toggle('on')">News Pending</div>
    <div class="fx-chip" onclick="this.classList.toggle('on')">Strong Support</div>
    <div class="fx-chip" onclick="this.classList.toggle('on')">Key Resistance</div>
    <div class="fx-chip" onclick="this.classList.toggle('on')">DXY Bearish</div>
    <div class="fx-chip" onclick="this.classList.toggle('on')">Risk-On Mode</div>
  </div>

  <button class="run-btn" onclick="runApexForex()">⚡ RUN APEX FOREX ENGINE</button>

  <div id="forex-result" style="display:none;margin-top:16px"></div>

</main>
</div>
<div id="ticker-bar"></div>
<script src="common.js"></script>
<script>
'use strict';

let activePair    = 'EUR/USD';
let activeSession = 'London';

// All pairs with live rate seeds + decimal places
const RATE_SEEDS = {
  'EUR/USD': { rate:1.0824, chg:'-0.12%', pos:false, dec:4, usdBase:false },
  'GBP/USD': { rate:1.2681, chg:'+0.08%', pos:true,  dec:4, usdBase:false },
  'USD/JPY': { rate:151.42, chg:'+0.21%', pos:true,  dec:2, usdBase:true  },
  'USD/CHF': { rate:0.9012, chg:'-0.06%', pos:false, dec:4, usdBase:true  },
  'AUD/USD': { rate:0.6431, chg:'+0.14%', pos:true,  dec:4, usdBase:false },
  'USD/CAD': { rate:1.3641, chg:'-0.09%', pos:false, dec:4, usdBase:true  },
  'NZD/USD': { rate:0.5910, chg:'+0.06%', pos:true,  dec:4, usdBase:false },
  'USD/MXN': { rate:17.24,  chg:'-0.15%', pos:false, dec:2, usdBase:true  },
  'EUR/GBP': { rate:0.8541, chg:'-0.04%', pos:false, dec:4, usdBase:false },
  'EUR/JPY': { rate:163.8,  chg:'+0.10%', pos:true,  dec:2, usdBase:false },
  'GBP/JPY': { rate:191.8,  chg:'+0.18%', pos:true,  dec:2, usdBase:false },
  'EUR/CHF': { rate:0.9721, chg:'-0.03%', pos:false, dec:4, usdBase:false },
  'AUD/JPY': { rate:97.4,   chg:'+0.12%', pos:true,  dec:2, usdBase:false },
  'GBP/CHF': { rate:1.1430, chg:'+0.02%', pos:true,  dec:4, usdBase:false },
  'XAU/USD': { rate:3085,   chg:'+0.31%', pos:true,  dec:1, usdBase:false },
  'XAG/USD': { rate:31.24,  chg:'+0.42%', pos:true,  dec:2, usdBase:false },
  'WTI/USD': { rate:68.40,  chg:'-0.90%', pos:false, dec:2, usdBase:false },
  'BRN/USD': { rate:72.10,  chg:'-0.75%', pos:false, dec:2, usdBase:false },
};

// Only show these in the live rate cards grid (top 8 most traded)
const RATE_CARD_PAIRS = ['EUR/USD','GBP/USD','USD/JPY','USD/CHF','AUD/USD','USD/CAD','NZD/USD','EUR/JPY'];

document.addEventListener('DOMContentLoaded', () => {
  renderLiveRates();
  refreshRates();
  prefill('EUR/USD');
});

function renderLiveRates() {
  const el = document.getElementById('live-rates');
  el.innerHTML = RATE_CARD_PAIRS.map(pair => {
    const d = RATE_SEEDS[pair];
    return `<div class="rate-card" onclick="selectPairByName('${pair}')">
      <div class="rate-pair">${pair}</div>
      <div class="rate-price">${d.rate.toFixed(d.dec)}</div>
      <div class="rate-chg" style="color:${d.pos?'var(--neon)':'var(--red)'}">${d.chg}</div>
    </div>`;
  }).join('');
}

async function refreshRates() {
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.classList.add('spinning');
  try {
    const res  = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
    const data = await res.json();
    if (data.rates) {
      // Update all USD-quoted pairs
      if (data.rates.EUR) RATE_SEEDS['EUR/USD'].rate = +(1/data.rates.EUR).toFixed(4);
      if (data.rates.GBP) RATE_SEEDS['GBP/USD'].rate = +(1/data.rates.GBP).toFixed(4);
      if (data.rates.JPY) RATE_SEEDS['USD/JPY'].rate = +data.rates.JPY.toFixed(2);
      if (data.rates.CHF) RATE_SEEDS['USD/CHF'].rate = +data.rates.CHF.toFixed(4);
      if (data.rates.AUD) RATE_SEEDS['AUD/USD'].rate = +(1/data.rates.AUD).toFixed(4);
      if (data.rates.CAD) RATE_SEEDS['USD/CAD'].rate = +data.rates.CAD.toFixed(4);
      if (data.rates.NZD) RATE_SEEDS['NZD/USD'].rate = +(1/data.rates.NZD).toFixed(4);
      if (data.rates.MXN) RATE_SEEDS['USD/MXN'].rate = +data.rates.MXN.toFixed(2);
      // Derive crosses
      if (data.rates.EUR && data.rates.GBP)
        RATE_SEEDS['EUR/GBP'].rate = +(data.rates.GBP/data.rates.EUR).toFixed(4);
      if (data.rates.EUR && data.rates.JPY)
        RATE_SEEDS['EUR/JPY'].rate = +(data.rates.JPY/data.rates.EUR).toFixed(2);
      if (data.rates.GBP && data.rates.JPY)
        RATE_SEEDS['GBP/JPY'].rate = +(data.rates.JPY/data.rates.GBP).toFixed(2);
      if (data.rates.EUR && data.rates.CHF)
        RATE_SEEDS['EUR/CHF'].rate = +(data.rates.CHF/data.rates.EUR).toFixed(4);
      if (data.rates.AUD && data.rates.JPY)
        RATE_SEEDS['AUD/JPY'].rate = +(data.rates.JPY/data.rates.AUD).toFixed(2);
      renderLiveRates();
      prefill(activePair);
      document.getElementById('live-rates-banner').className = 'odds-api-banner live';
      document.getElementById('live-rates-banner').innerHTML =
        '<div class="oab-dot live"></div><div class="oab-text">LIVE rates · ExchangeRate-API · ' + new Date().toLocaleTimeString() + '</div>';
    }
  } catch(e) {
    document.getElementById('live-rates-banner').className = 'odds-api-banner sim';
    document.getElementById('live-rates-banner').innerHTML =
      '<div class="oab-dot sim"></div><div class="oab-text">Simulation mode — reference rates shown</div>';
  }
  if (btn) btn.classList.remove('spinning');
}

function selectPair(pair, btn) {
  activePair = pair;
  document.querySelectorAll('.pair-btn').forEach(b => b.classList.toggle('active', b === btn));
  prefill(pair);
}
function selectPairByName(pair) {
  activePair = pair;
  document.querySelectorAll('.pair-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === pair || b.textContent.trim().startsWith(pair)));
  prefill(pair);
}
function selectSession(session, btn) {
  activeSession = session;
  document.querySelectorAll('.session-tab').forEach(b => b.classList.toggle('active', b === btn));
}

function prefill(pair) {
  const d = RATE_SEEDS[pair];
  if (!d) return;
  document.getElementById('fx-rate').value  = d.rate.toFixed(d.dec);
  document.getElementById('fx-pivot').value = +(d.rate * (1 + (Math.random()-0.5)*0.002)).toFixed(d.dec);
  document.getElementById('fx-atr').value   = Math.round(40 + Math.random()*60);
  document.getElementById('fx-rsi').value   = Math.round(40 + Math.random()*30);
}

// ── APEX FOREX ENGINE ─────────────────────────────────────────────────────────
function runApexForex() {
  const rate    = parseFloat(document.getElementById('fx-rate').value)  || RATE_SEEDS[activePair]?.rate || 1.0;
  const pivot   = parseFloat(document.getElementById('fx-pivot').value) || rate;
  const rsi     = parseFloat(document.getElementById('fx-rsi').value)   || 50;
  const atr     = parseFloat(document.getElementById('fx-atr').value)   || 60;
  const macdVal = document.getElementById('fx-macd').value;

  const chips      = [...document.querySelectorAll('.fx-chip.on')].map(c => c.textContent.trim());
  const usdBull    = chips.includes('USD Bullish Bias');
  const trending   = chips.includes('Trending');
  const riskOff    = chips.includes('Risk-Off Mode');
  const riskOn     = chips.includes('Risk-On Mode');
  const newsPend   = chips.includes('News Pending');
  const support    = chips.includes('Strong Support');
  const resistance = chips.includes('Key Resistance');
  const dxyBear    = chips.includes('DXY Bearish');

  // APEX signal scoring
  const macdScore  = macdVal.includes('Bull')||macdVal.includes('Rising') ? +0.20
                   : macdVal.includes('Bear')||macdVal.includes('Falling') ? -0.20
                   : macdVal.includes('Above') ? +0.10 : -0.10;
  const rsiScore   = rsi>65?+0.15 : rsi<35?-0.15 : rsi>55?+0.08 : rsi<45?-0.08 : 0;
  const pivotScore = rate > pivot ? +0.10 : -0.10;
  const usdScore   = usdBull ? -0.10 : dxyBear ? +0.08 : +0.02;
  const trendScore = trending ? +0.10 : 0;
  const riskScore  = riskOff ? -0.08 : riskOn ? +0.06 : 0;
  const newsScore  = newsPend ? -0.05 : 0;
  const suppScore  = support ? +0.07 : 0;
  const resScore   = resistance ? -0.07 : 0;

  const bullProb = Math.max(0.05, Math.min(0.95,
    0.50 + macdScore + rsiScore + pivotScore + usdScore + trendScore + riskScore + newsScore + suppScore + resScore
  ));
  const direction = bullProb > 0.57 ? 'BUY' : bullProb < 0.43 ? 'SELL' : 'WAIT';
  const dirCol    = direction==='BUY' ? 'var(--neon)' : direction==='SELL' ? 'var(--red)' : 'var(--text-dim)';
  const conf      = Math.round(50 + Math.abs(bullProb-0.5)*80);

  const d = RATE_SEEDS[activePair] || { dec: 4 };
  const atrUnit = activePair.includes('JPY') ? atr * 0.01
                : activePair.includes('XAU') ? atr * 1.0
                : activePair.includes('Oil') || activePair.includes('WTI') || activePair.includes('BRN') ? atr * 0.1
                : atr * 0.0001;

  const tp1 = direction==='BUY'  ? +(rate + atrUnit*1.0).toFixed(d.dec)
            : direction==='SELL' ? +(rate - atrUnit*1.0).toFixed(d.dec) : null;
  const tp2 = direction==='BUY'  ? +(rate + atrUnit*2.0).toFixed(d.dec)
            : direction==='SELL' ? +(rate - atrUnit*2.0).toFixed(d.dec) : null;
  const sl  = direction==='BUY'  ? +(rate - atrUnit*0.6).toFixed(d.dec)
            : direction==='SELL' ? +(rate + atrUnit*0.6).toFixed(d.dec) : null;

  const rr = tp1 && sl ? (Math.abs(tp1-rate)/Math.abs(sl-rate)).toFixed(1) : '—';

  // Fractional Kelly (25%) for stake sizing
  const bankroll   = typeof getBankroll === 'function' ? getBankroll() : 1000;
  const p          = bullProb;
  const b          = direction==='WAIT' ? 1 : 1.5; // estimated odds
  const q          = 1 - p;
  const kelly      = Math.max(0, (b*p - q) / b);
  const fracKelly  = +(kelly * 0.25 * bankroll).toFixed(2);

  const signals = [
    { lbl:'MACD',     val:macdVal,                                          score:macdScore,  bar:Math.abs(macdScore)*500 },
    { lbl:'RSI',      val:`${rsi} ${rsi>65?'▲ OB':rsi<35?'▼ OS':'Neutral'}`, score:rsiScore, bar:Math.abs(rsiScore)*500 },
    { lbl:'vs Pivot', val:rate>pivot?'Above ↑':'Below ↓',                  score:pivotScore, bar:50 },
    { lbl:'USD Bias', val:usdBull?'USD Bull':dxyBear?'DXY Weak':'Neutral', score:usdScore,   bar:Math.abs(usdScore)*500 },
    { lbl:'Trend',    val:trending?'Trending':'Ranging',                   score:trendScore, bar:Math.abs(trendScore)*500 },
    { lbl:'Session',  val:activeSession,                                    score:0,          bar:40 },
  ];

  const verdict = direction==='BUY'
    ? bullProb>0.72 ? 'Strong bullish confluence — enter long on retest of pivot.' : 'Moderate bullish bias. Wait for confirmation.'
    : direction==='SELL'
    ? bullProb<0.28 ? 'Strong bearish setup — scale in on rallies to pivot.' : 'Moderate bearish bias. Use tight stop.'
    : 'Conflicting signals. Do not force entry — wait for cleaner setup.';

  document.getElementById('forex-result').style.display = 'block';
  document.getElementById('forex-result').innerHTML = `
    <div class="signal-card">
      <div class="sig-header">
        <div>
          <div class="sig-pair">${activePair}</div>
          <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">${activeSession} Session · Rate: ${rate.toFixed(d.dec)}</div>
        </div>
        <div class="sig-dir ${direction}">${direction}</div>
      </div>

      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-bottom:4px">
          <span>BEAR ${Math.round((1-bullProb)*100)}%</span><span>BULL ${Math.round(bullProb*100)}%</span>
        </div>
        <div style="height:8px;background:var(--bg4);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${Math.round(bullProb*100)}%;background:${dirCol};border-radius:4px"></div>
        </div>
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:4px">CONF: <span style="color:${dirCol};font-weight:700">${conf}%</span></div>
      </div>

      ${direction!=='WAIT'?`<div class="level-grid">
        <div class="level-cell tp"><div class="level-lbl">TP1</div><div class="level-val" style="color:var(--neon)">${tp1}</div></div>
        <div class="level-cell tp"><div class="level-lbl">TP2</div><div class="level-val" style="color:var(--neon2)">${tp2}</div></div>
        <div class="level-cell sl"><div class="level-lbl">STOP LOSS</div><div class="level-val" style="color:var(--red)">${sl}</div></div>
      </div>
      <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-bottom:14px">R:R <span style="color:var(--yellow);font-weight:700">1:${rr}</span> · ATR: ${atr} pips · Kelly stake: <span style="color:var(--neon);font-weight:700">$${fracKelly}</span> <span style="color:var(--text-dim)">(25% fractional)</span></div>`:''}

      <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-bottom:8px">SIGNAL MATRIX</div>
      <div class="signal-matrix">
        ${signals.map(s=>`<div class="sm-row">
          <span class="sm-lbl">${s.lbl}</span>
          <div class="sm-bar-wrap"><div class="sm-bar" style="width:${Math.min(100,s.bar)}%;background:${s.score>0?'var(--neon)':s.score<0?'var(--red)':'var(--border2)'}"></div></div>
          <span class="sm-val" style="color:${s.score>0?'var(--neon)':s.score<0?'var(--red)':'var(--text-dim)'}">${s.val}</span>
        </div>`).join('')}
      </div>

      <div style="background:var(--bg3);border-radius:var(--radius);padding:12px;margin-top:12px;text-align:center">
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-bottom:4px">COMPOSITE SIGNAL</div>
        <div style="font-family:var(--font-mono);font-size:24px;font-weight:700;color:${dirCol}">${direction}</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-top:4px">${Math.round(bullProb*100)}% bull probability</div>
      </div>

      <div class="ai-explain" style="margin-top:12px">
        <div class="ai-explain-title">⚡ APEX VERDICT</div>
        <ul class="ai-explain-list">
          <li>${verdict}</li>
          <li>${activePair} @ ${rate.toFixed(d.dec)} · Pivot: ${pivot.toFixed(d.dec)} (${rate>pivot?'above ✓':'below ✗'})</li>
          <li>RSI ${rsi} · MACD: ${macdVal}</li>
          ${direction!=='WAIT'?`<li>Entry: ${rate.toFixed(d.dec)} · TP1: ${tp1} · TP2: ${tp2} · SL: ${sl}</li><li>Fractional Kelly (25%) stake: $${fracKelly} of $${bankroll} bankroll</li>`:'<li>No trade — wait for cleaner confluence before entering</li>'}
        </ul>
      </div>

      <div id="fx-polymarket" class="pm-strip" style="display:none">
        <div class="pm-title">📊 POLYMARKET — RELATED MARKETS</div>
        <div id="fx-pm-body"></div>
      </div>
    </div>`;

  // Load related Polymarket forex/economy markets
  loadForexPolymarkets(activePair);
}

// Load Polymarket markets related to forex/macro
async function loadForexPolymarkets(pair) {
  try {
    const keywords = {
      'EUR/USD': 'euro', 'GBP/USD': 'pound', 'USD/JPY': 'japan yen',
      'USD/CHF': 'swiss', 'AUD/USD': 'australia', 'USD/CAD': 'canada',
      'XAU/USD': 'gold', 'EUR/GBP': 'euro pound',
    };
    const q = keywords[pair] || pair.split('/')[0].toLowerCase();
    // Fetch economy category markets from Polymarket
    const res = await fetch(`/api/polymarket?cat=economy&limit=30`);
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) return;

    // Filter for relevant markets
    const relevant = data.filter(m => {
      const question = (m.question || '').toLowerCase();
      return question.includes('rate') || question.includes('fed') || question.includes('inflation') ||
             question.includes(q) || question.includes('dollar') || question.includes('usd');
    }).slice(0, 4);

    if (!relevant.length) return;

    const strip = document.getElementById('fx-polymarket');
    const body  = document.getElementById('fx-pm-body');
    if (!strip || !body) return;

    body.innerHTML = relevant.map(m => {
      let prices = [];
      try { prices = JSON.parse(m.outcomePrices || '[]'); } catch {}
      const yesPct = prices[0] ? Math.round(parseFloat(prices[0]) * 100) : 50;
      return `<div class="pm-market">
        <div class="pm-q">${m.question}</div>
        <div class="pm-bar-wrap">
          <div class="pm-yes" style="width:${yesPct}%"></div>
          <div class="pm-no"></div>
        </div>
        <div class="pm-pcts"><span style="color:var(--neon)">YES ${yesPct}%</span><span style="color:var(--red)">NO ${100-yesPct}%</span></div>
      </div>`;
    }).join('');
    strip.style.display = 'block';
  } catch(e) {}
}
</script>
