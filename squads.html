<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Squads · EdgeX</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="edgex-v2.css">
  <script src="edgex-v2-core.js"></script>
  <script src="shared.js"></script>
  <script src="edgex-shell.js"></script>
</head>
<body>
  <aside id="side-nav"></aside>
  <main class="page-shell">
    <header class="topbar">
      <div class="topbar-title">Squads</div>
      <a class="edgex-v2-button" href="search.html">Search</a>
    </header>

    <section id="squads-page" class="edgex-squads-page" aria-live="polite">
      <div id="squad-roster-layer" class="edgex-squad-layer">
        <div class="edgex-v2-page-head edgex-squad-page-head">
          <div>
            <span class="edgex-v2-eyebrow">Squad intelligence</span>
            <h1>Player directory</h1>
            <p>Explore players with available market context, recent evidence, and analysis readiness.</p>
          </div>
          <span class="edgex-squad-data-note">Live data</span>
        </div>
        <div class="edgex-squad-toolbar">
          <label class="edgex-squad-search"><span class="sr-only">Search players</span><input id="squad-player-search" type="search" placeholder="Search player or team" autocomplete="off"></label>
          <select id="squad-state-filter" aria-label="Filter player evidence state"><option value="all">All evidence</option><option value="SUPPORTED">Supported</option><option value="LINEUP_PENDING">Lineup pending</option><option value="INSUFFICIENT_DATA">Insufficient data</option></select>
        </div>
        <div id="squad-roster-grid" class="edgex-squad-roster-grid"></div>
      </div>

      <div id="squad-player-detail-layer" class="edgex-squad-layer" hidden>
        <div class="edgex-squad-detail-head">
          <button id="squad-back-button" class="edgex-v2-button edgex-squad-back" type="button">← Back to players</button>
          <div id="squad-selected-summary" class="edgex-squad-selected-summary"></div>
        </div>
        <div id="player-edge-root" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script src="common.js"></script>
  <script src="edgex-squads.js"></script>
  <script src="edgex-player-edge.js"></script>
</body>
</html>
