<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Player Compare — EdgeX</title>
<link rel="stylesheet" href="style.css"/>
<style>
.search-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:14px;}
.search-label{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-bottom:6px;}
.search-row{display:flex;gap:8px;}
.search-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-family:var(--font-mono);font-size:12px;color:var(--text);outline:none;}
.search-input:focus{border-color:rgba(0,255,157,0.4);}
.search-btn{padding:10px 16px;font-family:var(--font-mono);font-size:11px;font-weight:700;background:var(--neon-dim);color:var(--neon);border:1px solid rgba(0,255,157,0.3);border-radius:var(--radius);cursor:pointer;transition:var(--transition);}
.search-btn:hover{background:rgba(0,255,157,0.18);}
.search-results{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);margin-top:6px;overflow:hidden;}
.result-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);transition:var(--transition);}
.result-item:hover{background:var(--bg4);}
.result-item:last-child{border-bottom:none;}
.result-name{font-weight:700;font-size:12px;}
.result-meta{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:2px;}
.player-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;}
.player-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.player-photo{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--bg4);flex-shrink:0;}
.player-name{font-weight:800;font-size:15px;margin-bottom:3px;line-height:1.2;}
.player-meta{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);line-height:1.7;}
.winner-banner{background:linear-gradient(135deg,rgba(0,255,157,0.08),rgba(0,201,255,0.05));border:1px solid rgba(0,255,157,0.25);border-radius:var(--radius);padding:12px;margin-bottom:14px;text-align:center;}
.season-select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-family:var(--font-mono);font-size:10px;color:var(--text);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
.stat-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px;text-align:center;}
.stat-val{font-family:var(--font-mono);font-size:16px;font-weight:700;line-height:1;}
.stat-lbl{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);margin-top:3px;letter-spacing:0.5px;}
.selected-tag{display:inline-flex;align-items:center;gap:6px;background:var(--neon-dim);border:1px solid rgba(0,255,157,0.3);border-radius:var(--radius);padding:4px 10px;margin-top:6px;font-family:var(--font-mono);font-size:10px;color:var(--neon);}
</style>
</head>
<body>
<nav id="side-nav"></nav>
<div id="page-wrap">
  <header id="page-header">
    <div class="page-title">
      <span class="page-title-icon">👤</span>PLAYERS
      <span class="page-subtitle">SEARCH · COMPARE · STATS</span>
    </div>
    <select class="season-select" id="season-sel" onchange="reloadBoth()">
      <option value="2025">2025/26</option>
      <option value="2024">2024/25</option>
      <option value="2023">2023/24</option>
    </select>
  </header>
  <main id="page-main">

    <div class="search-box">
      <div class="search-label">PLAYER 1</div>
      <div class="search-row">
        <input class="search-input" id="search1" placeholder="Search player name..." onkeydown="if(event.key==='Enter')searchPlayer(1)"/>
        <button class="search-btn" onclick="searchPlayer(1)">FIND</button>
      </div>
      <div id="selected1"></div>
      <div id="results1"></div>
    </div>

    <div class="search-box">
      <div class="search-label">PLAYER 2</div>
      <div class="search-row">
        <input class="search-input" id="search2" placeholder="Search player name..." onkeydown="if(event.key==='Enter')searchPlayer(2)"/>
        <button class="search-btn" onclick="searchPlayer(2)">FIND</button>
      </div>
      <div id="selected2"></div>
      <div id="results2"></div>
    </div>

    <div id="compare-area"></div>
  </main>
</div>

<div id="ticker-bar"></div>
<script src="common.js"></script>
<script>
'use strict';

let player1 = null;
let player2 = null;

// Store search results in memory — avoid JSON in onclick attributes (breaks with apostrophes)
let _results1 = [];
let _results2 = [];

async function searchPlayer(slot) {
  const input  = document.getElementById('search' + slot);
  const name   = input.value.trim();
  if (name.length < 2) return;

  const resultsEl = document.getElementById('results' + slot);
  resultsEl.innerHTML = '<div style="padding:10px;font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">Searching...</div>';

  const season = document.getElementById('season-sel').value;
  try {
    const res  = await fetch(`/api/sports?type=football-player-search&name=${encodeURIComponent(name)}&season=${season}`);
    const json = await res.json();

    if (!json.success || !json.data?.length) {
      resultsEl.innerHTML = '<div style="padding:10px;font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">No players found — try a different spelling</div>';
      return;
    }

    // Store results in memory — use index to select
    if (slot === 1) _results1 = json.data;
    else            _results2 = json.data;

    resultsEl.innerHTML = `<div class="search-results">
      ${json.data.map((item, i) => {
        const p = item.player;
        const s = item.statistics?.[0] || {};
        return `<div class="result-item" onclick="selectPlayer(${slot}, ${i})">
          <div class="result-name">${p.name}</div>
          <div class="result-meta">${s.team?.name||'—'} · ${p.nationality||''} · ${p.age||'?'} yrs · ${s.games?.position||'—'}</div>
        </div>`;
      }).join('')}
    </div>`;

  } catch(e) {
    resultsEl.innerHTML = '<div style="padding:10px;font-family:var(--font-mono);font-size:10px;color:var(--red)">Error searching — try again</div>';
  }
}

function selectPlayer(slot, index) {
  const data = slot === 1 ? _results1[index] : _results2[index];
  if (!data) return;

  if (slot === 1) player1 = data;
  else            player2 = data;

  // Clear results, show selected tag
  document.getElementById('results' + slot).innerHTML = '';
  document.getElementById('search' + slot).value = data.player?.name || '';
  document.getElementById('selected' + slot).innerHTML =
    `<div class="selected-tag">✓ ${data.player?.name} · ${data.statistics?.[0]?.team?.name||''}
      <span style="cursor:pointer;opacity:0.6;margin-left:4px" onclick="clearPlayer(${slot})">✕</span>
    </div>`;

  renderCompare();
}

function clearPlayer(slot) {
  if (slot === 1) { player1 = null; _results1 = []; }
  else            { player2 = null; _results2 = []; }
  document.getElementById('selected' + slot).innerHTML = '';
  document.getElementById('search' + slot).value = '';
  renderCompare();
}

function reloadBoth() {
  player1 = null; player2 = null;
  _results1 = []; _results2 = [];
  document.getElementById('compare-area').innerHTML = '';
  document.getElementById('selected1').innerHTML = '';
  document.getElementById('selected2').innerHTML = '';
}

function renderCompare() {
  const area = document.getElementById('compare-area');
  if (!player1 && !player2) { area.innerHTML = ''; return; }

  // Winner calc
  let winnerHtml = '';
  if (player1 && player2) {
    const s1 = player1.statistics?.[0] || {};
    const s2 = player2.statistics?.[0] || {};
    const score = s => (s.goals?.total||0)*3 + (s.goals?.assists||0)*2 +
      (s.passes?.key||0)*1.5 + parseFloat(s.games?.rating||0)*2 +
      (s.dribbles?.success||0)*0.5 - (s.cards?.red||0)*3 - (s.cards?.yellow||0)*0.5;
    const sc1 = score(s1), sc2 = score(s2);
    const winner = sc1>sc2 ? player1.player?.name : sc2>sc1 ? player2.player?.name : null;
    if (winner) {
      winnerHtml = `<div class="winner-banner">
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-bottom:4px">EdgeX RATING WINNER</div>
        <div style="font-weight:800;font-size:18px;color:var(--neon)">🏆 ${winner}</div>
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:4px">
          ${player1.player?.name.split(' ').pop()}: ${sc1.toFixed(0)} pts · ${player2.player?.name.split(' ').pop()}: ${sc2.toFixed(0)} pts
        </div>
      </div>`;
    }
  }

  area.innerHTML = winnerHtml + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    ${renderCard(player1,'Player 1')}
    ${renderCard(player2,'Player 2')}
  </div>`;
}

function renderCard(data, placeholder) {
  if (!data) return `<div class="player-card" style="display:flex;align-items:center;justify-content:center;min-height:140px;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;text-align:center">Search<br>${placeholder}</div>`;

  const p = data.player;
  const s = data.statistics?.[0] || {};
  const rating = parseFloat(s.games?.rating||0);

  return `<div class="player-card">
    <div class="player-header">
      <img class="player-photo" src="${p.photo||''}" onerror="this.style.display='none'" alt=""/>
      <div>
        <div class="player-name">${p.name}</div>
        <div class="player-meta">
          ${s.team?.name||'—'}<br>
          ${p.nationality||''} · ${p.age||'?'} yrs<br>
          ${s.games?.position||'—'}<br>
          ${p.injured?'🚑 Injured':'✅ Available'}
        </div>
      </div>
    </div>
    <div class="stat-grid">
      ${statBox('APPS',   s.games?.appearences||0,     'var(--text)')}
      ${statBox('RATING', rating?rating.toFixed(1):'—','var(--neon)')}
      ${statBox('GOALS',  s.goals?.total||0,            'var(--neon)')}
      ${statBox('ASSISTS',s.goals?.assists||0,           'var(--neon2)')}
      ${statBox('SHOTS',  s.shots?.total||0,             'var(--text-muted)')}
      ${statBox('ON TGT', s.shots?.on||0,                'var(--neon2)')}
      ${statBox('PASSES', s.passes?.total||0,            'var(--text-muted)')}
      ${statBox('KEY PSS',s.passes?.key||0,              'var(--yellow)')}
      ${statBox('DRIB',   s.dribbles?.success||0,        'var(--neon2)')}
      ${statBox('TACKLES',s.tackles?.total||0,           'var(--text-muted)')}
      ${statBox('YEL',    s.cards?.yellow||0,            'var(--yellow)')}
      ${statBox('RED',    s.cards?.red||0,               'var(--red)')}
    </div>
  </div>`;
}

function statBox(label, value, color) {
  return `<div class="stat-box">
    <div class="stat-val" style="color:${color}">${value}</div>
    <div class="stat-lbl">${label}</div>
  </div>`;
}
</script>
</body>
</html>
