<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Player Compare — EdgeX</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .search-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:14px;}
    .search-label{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-bottom:6px;}
    .search-row{display:flex;gap:8px;}
    .search-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-family:var(--font-mono);font-size:12px;color:var(--text);}
    .search-btn{padding:10px 16px;font-family:var(--font-mono);font-size:11px;font-weight:700;background:var(--neon-dim);color:var(--neon);border:1px solid rgba(0,255,157,0.3);border-radius:var(--radius);cursor:pointer;}
    .player-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;}
    .player-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
    .player-photo{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--bg4);}
    .player-name{font-weight:800;font-size:16px;margin-bottom:3px;}
    .player-meta{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);line-height:1.6;}
    .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
    .stat-compare-row{margin-bottom:8px;}
    .sc-label{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:1px;margin-bottom:4px;text-align:center;}
    .sc-dual{display:flex;align-items:center;gap:4px;}
    .sc-val-l{font-family:var(--font-mono);font-size:11px;font-weight:700;text-align:right;flex-shrink:0;width:32px;}
    .sc-val-r{font-family:var(--font-mono);font-size:11px;font-weight:700;text-align:left;flex-shrink:0;width:32px;}
    .sc-bars-dual{flex:1;display:flex;flex-direction:column;gap:2px;}
    .sc-bar-l{height:5px;border-radius:2px;margin-left:auto;}
    .sc-bar-r{height:5px;border-radius:2px;}
    .search-results{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);margin-top:4px;overflow:hidden;}
    .result-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);}
    .result-item:hover{background:var(--bg4);}
    .result-item:last-child{border-bottom:none;}
    .result-name{font-weight:700;font-size:12px;}
    .result-meta{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:2px;}
    .winner-banner{background:linear-gradient(135deg,rgba(0,255,157,0.08),rgba(0,201,255,0.05));border:1px solid rgba(0,255,157,0.25);border-radius:var(--radius);padding:12px;margin-bottom:14px;text-align:center;}
    .season-select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-family:var(--font-mono);font-size:10px;color:var(--text);margin-left:8px;}
  </style>
</head>
<body>
<nav id="side-nav"></nav>

<div id="page-wrap">
  <header id="page-header">
    <div class="page-title">
      <span class="page-title-icon">👤</span>PLAYERS
      <span class="page-subtitle">SEARCH · COMPARE · STATS</span>
    </div>
    <select class="season-select" id="season-sel" onchange="reloadBoth()">
      <option value="2025">2025/26</option>
      <option value="2024">2024/25</option>
      <option value="2023">2023/24</option>
    </select>
  </header>

  <main id="page-main">
    <!-- Player 1 search -->
    <div class="search-box">
      <div class="search-label">PLAYER 1</div>
      <div class="search-row">
        <input class="search-input" id="search1" placeholder="Search player name..." onkeydown="if(event.key==='Enter')searchPlayer(1)"/>
        <button class="search-btn" onclick="searchPlayer(1)">FIND</button>
      </div>
      <div id="results1"></div>
    </div>

    <!-- Player 2 search -->
    <div class="search-box">
      <div class="search-label">PLAYER 2</div>
      <div class="search-row">
        <input class="search-input" id="search2" placeholder="Search player name..." onkeydown="if(event.key==='Enter')searchPlayer(2)"/>
        <button class="search-btn" onclick="searchPlayer(2)">FIND</button>
      </div>
      <div id="results2"></div>
    </div>

    <div id="compare-area"></div>
  </main>
</div>

<div id="ticker-bar"></div>
<script src="common.js"></script>
<script>
'use strict';

let player1 = null;
let player2 = null;

document.addEventListener('DOMContentLoaded', () => {});

async function searchPlayer(slot) {
  const input = document.getElementById('search' + slot);
  const name  = input.value.trim();
  if (name.length < 3) return;
  const season = document.getElementById('season-sel').value;

  const res  = await fetch(`/api/sports?type=football-player-search&name=${encodeURIComponent(name)}&season=${season}`);
  const json = await res.json();

  const el = document.getElementById('results' + slot);
  if (!json.success || !json.data?.length) {
    el.innerHTML = '<div style="padding:10px;font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">No players found</div>';
    return;
  }

  el.innerHTML = `<div class="search-results">
    ${json.data.map(item => {
      const p = item.player;
      const s = item.statistics?.[0] || {};
      return `<div class="result-item" onclick="selectPlayer(${slot}, ${JSON.stringify(item).replace(/"/g,'&quot;')})">
        <div class="result-name">${p.name}</div>
        <div class="result-meta">${s.team?.name||'—'} · ${p.nationality||''} · ${p.age||'?'} yrs · ${s.games?.position||'—'}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function selectPlayer(slot, data) {
  if (slot === 1) player1 = data;
  else player2 = data;
  document.getElementById('results' + slot).innerHTML = '';
  document.getElementById('search' + slot).value = data.player?.name || '';
  renderCompare();
}

async function reloadBoth() {
  player1 = null; player2 = null;
  document.getElementById('compare-area').innerHTML = '';
}

function renderCompare() {
  const area = document.getElementById('compare-area');
  if (!player1 && !player2) { area.innerHTML = ''; return; }

  const renderCard = (data, side) => {
    if (!data) return `<div class="player-card" style="display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--text-dim);font-family:var(--font-mono);font-size:10px">Search ${side}</div>`;
    const p = data.player;
    const s = data.statistics?.[0] || {};
    return `
      <div class="player-card">
        <div class="player-header">
          <img class="player-photo" src="${p.photo||''}" onerror="this.src=''" alt=""/>
          <div>
            <div class="player-name">${p.name}</div>
            <div class="player-meta">
              ${s.team?.name||'—'}<br>
              ${p.nationality||''} · ${p.age||'?'} yrs<br>
              ${s.games?.position||'—'} · ${p.height||'?'} / ${p.weight||'?'}kg<br>
              ${p.injured?'🚑 Injured':'✅ Available'}
            </div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${stat('APPS',   s.games?.appearences||0)}
          ${stat('GOALS',  s.goals?.total||0, 'var(--neon)')}
          ${stat('ASSISTS',s.goals?.assists||0,'var(--neon2)')}
          ${stat('MINS',   s.games?.minutes||0)}
          ${stat('SHOTS',  s.shots?.total||0)}
          ${stat('ON TGT', s.shots?.on||0)}
          ${stat('PASSES', s.passes?.total||0)}
          ${stat('KEY PSS',s.passes?.key||0,'var(--yellow)')}
          ${stat('TACKLES',s.tackles?.total||0)}
          ${stat('DRIBBLES',s.dribbles?.success||0,'var(--neon2)')}
          ${stat('FOULS',  s.fouls?.committed||0,'var(--red)')}
          ${stat('YEL',    s.cards?.yellow||0,'var(--yellow)')}
          ${stat('RED',    s.cards?.red||0,'var(--red)')}
          ${stat('RATING', parseFloat(s.games?.rating||0).toFixed(1),'var(--neon)')}
        </div>
      </div>`;
  };

  const stat = (label, value, color='var(--text-muted)') => `
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px;text-align:center">
      <div style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:${color}">${value}</div>
      <div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);margin-top:2px">${label}</div>
    </div>`;

  // If both players selected, show comparison
  let winnerHtml = '';
  if (player1 && player2) {
    const s1 = player1.statistics?.[0] || {};
    const s2 = player2.statistics?.[0] || {};
    const score1 = (s1.goals?.total||0)*3 + (s1.goals?.assists||0)*2 + (s1.passes?.key||0)*1.5 + parseFloat(s1.games?.rating||0)*2;
    const score2 = (s2.goals?.total||0)*3 + (s2.goals?.assists||0)*2 + (s2.passes?.key||0)*1.5 + parseFloat(s2.games?.rating||0)*2;
    const winner = score1>score2 ? player1.player?.name : score2>score1 ? player2.player?.name : null;
    if (winner) winnerHtml = `
      <div class="winner-banner">
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-bottom:4px">EdgeX RATING WINNER</div>
        <div style="font-weight:800;font-size:16px;color:var(--neon)">🏆 ${winner}</div>
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:4px">Score: ${score1.toFixed(0)} vs ${score2.toFixed(0)}</div>
      </div>`;
  }

  area.innerHTML = winnerHtml + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    ${renderCard(player1,'Player 1')}${renderCard(player2,'Player 2')}
  </div>`;
}
</script>
</body>
</html>
